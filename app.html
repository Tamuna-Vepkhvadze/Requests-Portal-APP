const CryptoModule = {
  PBKDF2_ITERATIONS: 310000, 
  
  generateSalt() {
    return crypto.getRandomValues(new Uint8Array(16));
  },
  
  async deriveKey(password, salt, iterations = this.PBKDF2_ITERATIONS) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw',
      enc.encode(password),
      'PBKDF2',
      false,
      ['deriveBits', 'deriveKey']
    );
    
    return crypto.subtle.deriveKey(
      {
        name: 'PBKDF2',
        salt: salt,
        iterations: iterations,
        hash: 'SHA-256'
      },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      true,
      ['encrypt', 'decrypt']
    );
  },
  
  async hashPassword(password) {
    const salt = this.generateSalt();
    const iterations = this.PBKDF2_ITERATIONS;
    
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw',
      enc.encode(password),
      'PBKDF2',
      false,
      ['deriveBits']
    );
    
    const hashBuffer = await crypto.subtle.deriveBits(
      {
        name: 'PBKDF2',
        salt: salt,
        iterations: iterations,
        hash: 'SHA-256'
      },
      keyMaterial,
      256
    );
    
    return {
      hash: Array.from(new Uint8Array(hashBuffer)),
      salt: Array.from(salt),
      iterations
    };
  },
  
  async verifyPassword(password, storedHash, storedSalt, iterations) {
    const salt = new Uint8Array(storedSalt);
    
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw',
      enc.encode(password),
      'PBKDF2',
      false,
      ['deriveBits']
    );
    
    const hashBuffer = await crypto.subtle.deriveBits(
      {
        name: 'PBKDF2',
        salt: salt,
        iterations: iterations,
        hash: 'SHA-256'
      },
      keyMaterial,
      256
    );
    
    const hash = Array.from(new Uint8Array(hashBuffer));
    
    if (hash.length !== storedHash.length) return false;
    let diff = 0;
    for (let i = 0; i < hash.length; i++) {
      diff |= hash[i] ^ storedHash[i];
    }
    return diff === 0;
  },
  
  async encryptData(data, key) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const enc = new TextEncoder();
    const encoded = enc.encode(JSON.stringify(data));
    
    const encrypted = await crypto.subtle.encrypt(
      { name: 'AES-GCM', iv },
      key,
      encoded
    );
    
    return {
      encrypted: Array.from(new Uint8Array(encrypted)),
      iv: Array.from(iv)
    };
  },
  
  async decryptData(encryptedData, iv, key) {
    try {
      const decrypted = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: new Uint8Array(iv) },
        key,
        new Uint8Array(encryptedData)
      );
      
      const dec = new TextDecoder();
      return JSON.parse(dec.decode(decrypted));
    } catch (e) {
      throw new Error('დეშიფრაცია ვერ მოხერხდა. პაროლი არასწორია.');
    }
  },
  
  checkPasswordStrength(password) {
    if (password.length < 8) return 0;
    
    let strength = 0;
    if (password.length >= 12) strength++;
    if (/[a-z]/.test(password)) strength++;
    if (/[A-Z]/.test(password)) strength++;
    if (/[0-9]/.test(password)) strength++;
    if (/[^a-zA-Z0-9]/.test(password)) strength++;
    
    if (strength <= 2) return 1;
    if (strength <= 3) return 2;
    return 3;
  }
};

const QA_IDB_NAME = "qa_audit_secure_v1";
const QA_IDB_VERSION = 1;

const SecureStorage = {
  db: null,
  
  async init() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(QA_IDB_NAME, QA_IDB_VERSION);
      
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        
        if (!db.objectStoreNames.contains('user')) {
          db.createObjectStore('user', { keyPath: 'id' });
        }
        if (!db.objectStoreNames.contains('encrypted_data')) {
          db.createObjectStore('encrypted_data', { keyPath: 'id' });
        }
      };
      
      req.onsuccess = () => {
        this.db = req.result;
        resolve(true);
      };
      
      req.onerror = () => reject(req.error);
    });
  },
  
  async getUser() {
    const tx = this.db.transaction('user', 'readonly');
    const store = tx.objectStore('user');
    
    return new Promise((resolve, reject) => {
      const req = store.get('main');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  
  async saveUser(userData) {
    const tx = this.db.transaction('user', 'readwrite');
    const store = tx.objectStore('user');
    
    return new Promise((resolve, reject) => {
      const req = store.put({ id: 'main', ...userData });
      req.onsuccess = () => resolve(true);
      req.onerror = () => reject(req.error);
    });
  },
  
  async getEncryptedData() {
    const tx = this.db.transaction('encrypted_data', 'readonly');
    const store = tx.objectStore('encrypted_data');
    
    return new Promise((resolve, reject) => {
      const req = store.get('main');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  
  async saveEncryptedData(encryptedPayload) {
    const tx = this.db.transaction('encrypted_data', 'readwrite');
    const store = tx.objectStore('encrypted_data');
    
    return new Promise((resolve, reject) => {
      const req = store.put({ id: 'main', ...encryptedPayload });
      req.onsuccess = () => resolve(true);
      req.onerror = () => reject(req.error);
    });
  },
  
  async deleteAllData() {
    const tx = this.db.transaction(['user', 'encrypted_data'], 'readwrite');
    
    return new Promise((resolve, reject) => {
      tx.objectStore('user').clear();
      tx.objectStore('encrypted_data').clear();
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }
};

function isoWeek(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + "T00:00:00");
  if (isNaN(d)) return null;
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + 4 - (d.getDay() || 7));
  const yearStart = new Date(d.getFullYear(), 0, 1);
  return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
}

function monthOf(dateStr) {
  if (!dateStr) return null;
  return Number(dateStr.slice(5, 7));

function quarterOf(dateStr) {
  const m = monthOf(dateStr);

}

function formatDate(dateStr) {
  if (!dateStr) return "—";
  const [y, m, d] = dateStr.split("-");
  return `${d}.${m}.${y}`;
}

function tally(list, key) {
  const map = {};
  list.forEach(item => {
    const v = item[key] || "მიზეზი მითითებული არ არის";
    map[v] = (map[v] || 0) + 1;
  });
  return Object.entries(map).sort((a, b) => b[1] - a[1]);
}

function applyFilters(cases, f) {
  return cases.filter(c => {
    const d = c.incidentDate;
    if (f.date && d !== f.date) return false;
    if (f.week && String(isoWeek(d)) !== String(f.week)) return false;
    if (f.month && String(monthOf(d)) !== String(f.month)) return false;
    if (f.quarter && String(quarterOf(d)) !== String(f.quarter)) return false;
    if (f.year && String(yearOf(d)) !== String(f.year)) return false;
    return true;
  });
}

  const strengthLabel = ["", "სუსტი", "საშუალო", "ძლიერი"][strength];
  const strengthClass = ["", "pwd-weak", "pwd-medium", "pwd-strong"][strength];
  
  const handleSubmit = async (e) => {
    e.preventDefault();
    setError("");
    
    const emailRegex = /^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/;
    if (!emailRegex.test(email.trim())) {
      setError("გთხოვთ შეიყვანოთ სწორი ელფოსტა (წერტილის შემდეგ მინიმუმ 2 სიმბოლო)");
      return;
    }
    
    if (password.length < 8) {
      setError("პაროლი უნდა იყოს მინიმუმ 8 სიმბოლო");
      return;
    }
    
    if (password !== confirmPassword) {
      setError("პაროლები არ ემთხვევა");
      return;
    }
    
    if (strength < 2) {
      setError("პაროლი ძალიან სუსტია. გამოიყენეთ დიდი/პატარა ასოები და ციფრები.");
      return;
    }
    
    setLoading(true);
    
    try {
      const { hash, salt, iterations } = await CryptoModule.hashPassword(password);
      
      await SecureStorage.saveUser({
        email: email.toLowerCase().trim(),
        passwordHash: hash,
        salt: salt,
        iterations: iterations,
        createdAt: new Date().toISOString()
      });
      
      const encryptionKey = await CryptoModule.deriveKey(password, new Uint8Array(salt), iterations);
      const encryptedPayload = await CryptoModule.encryptData(SEED_DATA, encryptionKey);
      await SecureStorage.saveEncryptedData(encryptedPayload);
      
      onRegister(encryptionKey, SEED_DATA, email);
      
    } catch (err) {

function LoginPage({ userEmail, onLogin, onReset }) {
  const [password, setPassword] = useState("");
  const [showPw, setShowPw] = useState(false);
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  
  // ✅ v2.0: Brute-force protection - persistent across refresh
  const LOCKOUT_KEY = `qa_lockout_${userEmail}`;
  const ATTEMPTS_KEY = `qa_attempts_${userEmail}`;
  
  const [loginAttempts, setLoginAttempts] = useState(() => {
    try {
      return parseInt(localStorage.getItem(ATTEMPTS_KEY) || "0", 10);
    } catch {
      return 0;
    }
  });
  
  const [lockedUntil, setLockedUntil] = useState(() => {
    try {
      const stored = localStorage.getItem(LOCKOUT_KEY);
      if (stored) {
        const timestamp = parseInt(stored, 10);
        if (timestamp > Date.now()) {
          return timestamp;
        } else {
          // Lockout expired - clean up
          localStorage.removeItem(LOCKOUT_KEY);
          localStorage.removeItem(ATTEMPTS_KEY);
          return null;
        }
      }
    } catch {
      return null;
    }
    return null;
  });
  
  const [remainingSeconds, setRemainingSeconds] = useState(0);
  
  // Real-time countdown
  useEffect(() => {
    if (lockedUntil) {
      const interval = setInterval(() => {
        const remaining = Math.ceil((lockedUntil - Date.now()) / 1000);
        
        if (remaining <= 0) {
          // Lockout expired
          setLockedUntil(null);
          setLoginAttempts(0);
          setRemainingSeconds(0);
          setError("");
          
          // Clean up localStorage
          localStorage.removeItem(LOCKOUT_KEY);
          localStorage.removeItem(ATTEMPTS_KEY);
        } else {
          setRemainingSeconds(remaining);
        }
      }, 1000);
      
      return () => clearInterval(interval);
    }
  }, [lockedUntil, LOCKOUT_KEY, ATTEMPTS_KEY]);
  
  const handleSubmit = async (e) => {
    e.preventDefault();
    e.stopPropagation();
    setError("");
    
    // Check lockout
    if (lockedUntil && Date.now() < lockedUntil) {
      const mins = Math.floor(remainingSeconds / 60);
      const secs = remainingSeconds % 60;
      setError(`🔒 ბლოკირებულია უსაფრთხოების გამო. დარჩენილია: ${mins}:${String(secs).padStart(2, '0')}`);
      return;
    }
    
    setLoading(true);
    
    try {
      const user = await SecureStorage.getUser();
      if (!user) {
        setError("მომხმარებელი ვერ მოიძებნა");
        setLoading(false);
        return;
      }
      
      const isValid = await CryptoModule.verifyPassword(
        password,
        user.passwordHash,
        user.salt,
        user.iterations
      );
      
      if (!isValid) {
        const newAttempts = loginAttempts + 1;
        setLoginAttempts(newAttempts);
        
        // ✅ Save to localStorage
        localStorage.setItem(ATTEMPTS_KEY, String(newAttempts));
        
        if (newAttempts >= 5) {
          const lockoutTime = 5 * 60 * 1000; // 5 წუთი
          const lockUntil = Date.now() + lockoutTime;
          
          setLockedUntil(lockUntil);
          setRemainingSeconds(300);
          
          // ✅ Save lockout to localStorage
          localStorage.setItem(LOCKOUT_KEY, String(lockUntil));
          
          setError(`⚠️ 5 წარუმატებელი მცდელობა. ბლოკირებულია 5:00 წუთით.`);
        } else {
          setError(`❌ პაროლი არასწორია (${newAttempts}/5 მცდელობა)`);
        }
        setLoading(false);
        return;
      }
      
      // ✅ Success - reset attempts and clear localStorage
      setLoginAttempts(0);
      setLockedUntil(null);
      setRemainingSeconds(0);
      localStorage.removeItem(LOCKOUT_KEY);
      localStorage.removeItem(ATTEMPTS_KEY);
      
      const encryptionKey = await CryptoModule.deriveKey(
        password,
        new Uint8Array(user.salt),
        user.iterations
      );
      
      const encrypted = await SecureStorage.getEncryptedData();
      if (!encrypted) {
        setError("დაშიფრული მონაცემები ვერ მოიძებნა");
        setLoading(false);
        return;
      }
      
      const decryptedData = await CryptoModule.decryptData(
        encrypted.encrypted,
        encrypted.iv,
        encryptionKey
      );
      
      onLogin(encryptionKey, normalizeData(decryptedData), user.email);
      
    } catch (err) {
      setError(err.message || "შესვლა ვერ მოხერხდა");
      setLoading(false);
    }
  };
  
  return React.createElement("div", { className: "qa-root min-h-screen flex items-center justify-center bg-[#F3F1E7] p-6" },
    React.createElement(FontStyles, null),
    React.createElement("form", {
      onSubmit: handleSubmit,
      noValidate: true,
      className: "qa-fade-up w-full max-w-sm bg-white rounded-xl border border-[#E4E1D6] shadow-xl p-8 flex flex-col gap-5"
    },
      React.createElement("div", { className: "flex flex-col items-center gap-2 mb-1" },
        React.createElement("div", { className: "w-12 h-12 rounded-lg bg-[#16213E] flex items-center justify-center" },
          React.createElement(Icon, { name: "approval", size: 22, className: "text-[#B8860B]" })
        ),
        React.createElement("h1", { className: "qa-serif text-xl font-bold text-[#16213E]" }, "QA აუდიტის პლათფორმა"),
        React.createElement("p", { className: "text-xs text-[#9A967F]" }, "გთხოვთ, შეხვიდეთ სისტემაში")
      ),
      
      React.createElement(Field, { label: "ელფოსტა" },
        React.createElement("input", {
          type: "email",
          disabled: true,
          className: inputCls + " opacity-60",
          value: userEmail,
          readOnly: true
        })
      ),
      
      React.createElement(Field, { label: "პაროლი" },
        React.createElement("div", { className: "relative" },
          React.createElement("input", {
            type: showPw ? "text" : "password",
            required: true,
            autoFocus: true,
            disabled: lockedUntil && Date.now() < lockedUntil,
            className: inputCls + " pr-9",
            value: password,
            onChange: e => { setError(""); setPassword(e.target.value); }
          }),
          React.createElement("button", {
            type: "button",
            onClick: () => setShowPw(!showPw),
            className: "absolute right-2 top-1/2 -translate-y-1/2 text-[#9A967F] hover:text-[#16213E]",
            tabIndex: -1
          }, showPw
            ? React.createElement(Icon, { name: "visibility_off", size: 15 })
            : React.createElement(Icon, { name: "visibility", size: 15 })
          )
        )
      ),
      
      // Lockout countdown
      lockedUntil && remainingSeconds > 0 && React.createElement("div", {
        className: "bg-[#F6E4E1] border border-[#F0999B] rounded-md px-4 py-3 text-center"
      },
        React.createElement("div", { className: "text-3xl font-bold text-[#C0392B] qa-mono mb-1" },
          `${Math.floor(remainingSeconds / 60)}:${String(remainingSeconds % 60).padStart(2, '0')}`
        ),
        React.createElement("p", { className: "text-xs text-[#C0392B]" }, "ბლოკირებულია უსაფრთხოების მიზეზით"),
      ),
      
      error && React.createElement("div", {
        className: "bg-[#F6E4E1] border border-[#F0999B] rounded-md px-3 py-2 text-xs text-[#C0392B] flex gap-2"
      },
        React.createElement(Icon, { name: "error", size: 14, className: "shrink-0" }),
        React.createElement("span", null, error)
      ),
      
      React.createElement("button", {
        type: "submit",
        disabled: loading || (lockedUntil && Date.now() < lockedUntil),
        className: "mt-1 px-4 py-2.5 rounded-md text-sm font-semibold bg-[#16213E] text-white hover:bg-[#223057] disabled:opacity-40 flex items-center justify-center gap-2"
      },
        loading && React.createElement(Icon, { name: "progress_activity", size: 14, className: "animate-pulse" }),
        loading ? "შემოწმება..." : "შესვლა"
      ),
      
    )
  );
}

function CasesPage({ data, saveData }) {
  const [query, setQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("");
  const [categoryFilter, setCategoryFilter] = useState("");
  const [resultFilter, setResultFilter] = useState("");
  const [timeFilters, setTimeFilters] = useState({
    date: "",
    week: "",
    month: "",
    quarter: "",
    year: ""
  });
  const [editing, setEditing] = useState(null);
  const [adding, setAdding] = useState(false);
  const [toDelete, setToDelete] = useState(null);
  
  const years = useMemo(() => {
    const s = new Set(data.cases.map(c => yearOf(c.incidentDate)).filter(Boolean));
    [2024, 2025, 2026, 2027, 2028].forEach(y => s.add(y));
    return Array.from(s).sort();
  }, [data.cases]);
  
    // ✅ v2.0: Pre-built search index
  const searchIndex = useMemo(() => {
    return data.cases.map(c => ({
      id: c.id,
      searchable: [
        c.jira,
        c.operator,
        c.category,
        c.problem,
        c.recommendation,
        c.department,
        c.delayReason
      ].filter(Boolean).join(' ').toLowerCase()
    }));
  }, [data.cases]);
  
  const filtered = useMemo(() => {
    let result = applyFilters(data.cases, timeFilters);
    
    // Status filter
    if (statusFilter) {
      result = result.filter(c => c.status === statusFilter);
    }
    
    // Category filter
    if (categoryFilter) {
      result = result.filter(c => c.category === categoryFilter);
    }
    
    // Result filter
    if (resultFilter) {
      result = result.filter(c => c.auditResult === resultFilter);
    }
    
    // ✅ v2.0: Optimized search
    if (query) {
      const q = query.toLowerCase();
      const matchingIds = new Set(
        searchIndex
          .filter(item => item.searchable.includes(q))
          .map(item => item.id)
      );
      result = result.filter(c => matchingIds.has(c.id));
    }
    
    return result.slice().reverse();
  }, [data.cases, query, statusFilter, categoryFilter, resultFilter, timeFilters, searchIndex]);
  
  const filtersActive = Boolean(
    statusFilter || categoryFilter || resultFilter ||
    timeFilters.date || timeFilters.week || timeFilters.month ||
    timeFilters.quarter || timeFilters.year
  );
  
  const saveCase = form => {
    let cases;
    if (editing) {
      cases = data.cases.map(c => c.id === editing.id ? { ...editing, ...form } : c);
    } else {
      const no = (data.cases.reduce((m, c) => Math.max(m, c.no || 0), 0) || 0) + 1;
      cases = [...data.cases, { id: uid(), no, ...form }];
    }
    saveData({ ...data, cases });
    setEditing(null);
    setAdding(false);
  };
  
  const deleteCase = () => {
    saveData({ ...data, cases: data.cases.filter(c => c.id !== toDelete.id) });
    setToDelete(null);
  };
  
  const exportExcel = async (filteredCases) => {
    const all = filteredCases;
    const total = all.length;
    const closed = all.filter(c => c.status === "დახურულია").length;
    const open = total - closed;
    const auditRows = tally(all, "auditResult");
    const catRows = tally(all, "category");
    const statusRows = tally(all, "status");
    const helpRows = tally(all, "helpType");
    const delayRows = tally(all, "delayReason");
    
    const NAVY = "FF16213E", GREEN = "FF1F6F50", RED = "FFC0392B";
    const PAPER = "FFFBF9F3", WHITE = "FFFFFFFF", BORDERC = "FFDBD7C8", MUTED = "FF8A8672";
    const PIE_COLORS = ["#16213E", "#B8860B", "#C0392B", "#2A4270", "#1F6F50", "#6B7A99", "#8C6B21"];

    // ---- Chart image builders (canvas) ----
    function drawDonutLegend(rows, canvasW, canvasH, titleText) {
        const canvas = document.createElement("canvas");
        canvas.width = canvasW;
        canvas.height = canvasH;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvasW, canvasH);
        ctx.font = "bold 15px sans-serif";
        ctx.fillStyle = "#16213E";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText(titleText, 4, 4);
        const topPad = 34;
        const sum = rows.reduce((s, [, v]) => s + v, 0) || 1;
        const donutSize = Math.min(canvasH - topPad - 12, 160);
        const cx = donutSize / 2 + 16, cy = topPad + (canvasH - topPad) / 2, r = donutSize / 2 - 4;
        let start = -Math.PI / 2;
        rows.forEach(([, value], i) => {
            const angle = value / sum * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, start, start + angle);
            ctx.closePath();
            ctx.fillStyle = PIE_COLORS[i % PIE_COLORS.length];
            ctx.fill();
            start += angle;
        });
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.55, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.fillStyle = "#16213E";
        ctx.font = "bold 20px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(String(sum), cx, cy - 8);
        ctx.font = "10px sans-serif";
        ctx.fillStyle = "#8A8672";
        ctx.fillText("სულ", cx, cy + 12);
        const lx = donutSize + 40;
        const availW = canvasW - lx - 60;
        const lineH = Math.min(30, (canvasH - topPad - 8) / Math.max(rows.length, 1));
        rows.forEach(([label, value], i) => {
            const ly = topPad + i * lineH + lineH / 2;
            ctx.fillStyle = PIE_COLORS[i % PIE_COLORS.length];
            ctx.fillRect(lx, ly - 7, 14, 14);
            ctx.font = "13px sans-serif";
            let display = label;
            while (ctx.measureText(display).width > availW && display.length > 4) {
                display = display.slice(0, -2);
            }
            if (display !== label) display = display.replace(/\s+$/, "") + "…";
            ctx.fillStyle = "#3A3A32";
            ctx.textAlign = "left";
            ctx.textBaseline = "middle";
            ctx.fillText(display, lx + 22, ly);
            ctx.fillStyle = "#16213E";
            ctx.font = "bold 13px sans-serif";
            ctx.textAlign = "right";
            ctx.fillText(String(value), canvasW - 10, ly);
        });
        return canvas.toDataURL("image/png");
    }

    function drawBar(rows, width, height, titleText) {
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, width, height);
        ctx.font = "bold 15px sans-serif";
        ctx.fillStyle = "#16213E";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText(titleText, 4, 4);
        const topPad = 34;
        const max = Math.max(...rows.map(([, v]) => v), 1);
        ctx.font = "13px sans-serif";
        let widest = 0;
        rows.forEach(([label]) => {
            const w = ctx.measureText(label).width;
            if (w > widest) widest = w;
        });
        const leftPad = Math.min(Math.max(widest + 26, 120), width * 0.42);
        const rightPad = 50;
        const n = Math.max(rows.length, 1);
        const barH = Math.min(26, Math.floor((height - topPad - 10) / n) - 8);
        rows.forEach(([label, value], i) => {
            const y = topPad + i * (barH + 8);
            let display = label;
            let font = "13px sans-serif";
            ctx.font = font;
            if (ctx.measureText(display).width > leftPad - 14) {
                font = "11px sans-serif";
                ctx.font = font;
            }
            ctx.fillStyle = "#3A3A32";
            ctx.textAlign = "right";
            ctx.textBaseline = "middle";
            ctx.fillText(display, leftPad - 10, y + barH / 2);
            const barW = (width - leftPad - rightPad) * value / max;
            ctx.fillStyle = PIE_COLORS[i % PIE_COLORS.length];
            ctx.fillRect(leftPad, y, Math.max(barW, 2), barH);
            ctx.fillStyle = "#16213E";
            ctx.font = "bold 13px sans-serif";
            ctx.textAlign = "left";
            ctx.fillText(String(value), leftPad + barW + 8, y + barH / 2);
        });
        return canvas.toDataURL("image/png");
    }

    const wb = new ExcelJS.Workbook();
    wb.creator = "QA აუდიტის პლათფორმა";
    wb.created = new Date();

    // ===== Dashboard sheet =====
    const dash = wb.addWorksheet("დეშბორდი", { views: [{ showGridLines: false }] });
    dash.columns = [
        { width: 3 }, { width: 14 }, { width: 14 }, { width: 14 }, { width: 14 },
        { width: 14 }, { width: 14 }, { width: 14 }, { width: 14 }, { width: 3 }
    ];

    dash.mergeCells("B2:I2");
    const titleCell = dash.getCell("B2");
    titleCell.value = "QA აუდიტის პლათფორმა მიმოხილვა";
    titleCell.font = { size: 18, bold: true, color: { argb: NAVY }, name: "Calibri" };

    dash.mergeCells("B3:I3");
    dash.getCell("B3").value = `შედგენილია: ${formatDate(new Date().toISOString().slice(0, 10))}`;
    dash.getCell("B3").font = { size: 10, italic: true, color: { argb: MUTED } };

    const kpis = [
        ["სულ ქეისი", total, NAVY, "B"],
        ["დახურული", closed, GREEN, "E"],
        ["ღია", open, RED, "H"]
    ];

    kpis.forEach(([label, value, color, col]) => {
        const nextCol = String.fromCharCode(col.charCodeAt(0) + 1);
        dash.mergeCells(`${col}5:${nextCol}5`);
        dash.mergeCells(`${col}6:${nextCol}7`);
        const labelCell = dash.getCell(`${col}5`);
        labelCell.value = label;
        labelCell.font = { size: 10, bold: true, color: { argb: MUTED } };
        const valueCell = dash.getCell(`${col}6`);
        valueCell.value = value;
        valueCell.font = { size: 26, bold: true, color: { argb: color } };
        valueCell.alignment = { vertical: "middle" };
    });

    // Two donuts side by side
    const donutW = 430, donutH = 230;
    const auditImg = drawDonutLegend(auditRows, donutW, donutH, "აუდიტის შედეგი");
    dash.addImage(wb.addImage({ base64: auditImg, extension: "png" }), "B9:E17");

    const statusImg = drawDonutLegend(statusRows, donutW, donutH, "სტატუსი");
    dash.addImage(wb.addImage({ base64: statusImg, extension: "png" }), "F9:I17");

    // Bar charts
    let row = 19;
    function barSection(title, rows, rowStart) {
        const h = Math.max(rows.length * 34 + 46, 140);
        const img = drawBar(rows, 900, h, title);
        const spanRows = Math.max(Math.round(h / 20), 6);
        dash.addImage(wb.addImage({ base64: img, extension: "png" }), `B${rowStart}:I${rowStart + spanRows}`);
        return rowStart + spanRows + 2;
    }

    row = barSection("მოთხოვნის კატეგორია", catRows, row);
    row = barSection("დახმარების ტიპი", helpRows, row);
    barSection("შეფერხების მიზეზი", delayRows, row);

    // ===== Cases sheet =====
    const cs = wb.addWorksheet("საქმეები", { views: [{ state: "frozen", ySplit: 1 }] });

    const headerDefs = [
        ["№", 6],

                cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: PAPER } };
            });

            cell.alignment = { vertical: "middle", wrapText: true };

    a.click();

function QAAuditPlatform() {
  const [initState, setInitState] = useState('checking'); // checking | no-user | has-user | logged-in
  const [user, setUser] = useState(null);
  const [encryptionKey, setEncryptionKey] = useState(null);
  const [data, setData] = useState(null);
  const [active, setActive] = useState("dashboard");
  const [navOpen, setNavOpen] = useState(false);
  const [selectedEmployee, setSelectedEmployee] = useState("");
  const [selectedCategory, setSelectedCategory] = useState("");
  const [saveState, setSaveState] = useState("idle");
  const [loadProgress, setLoadProgress] = useState(0);

  const saveTimer = useRef(null);
  const encryptionKeyRef = useRef(null);

  useEffect(() => {
    encryptionKeyRef.current = encryptionKey;
  }, [encryptionKey]);

  // Initialize storage + restore session after refresh
  useEffect(() => {
    (async () => {
      try {
        await SecureStorage.init();
        const existingUser = await SecureStorage.getUser();

        if (!existingUser) {
          setInitState('no-user');
          return;
        }

        setUser(existingUser);

        // Refresh-ზე დალოგინებული დარჩენა sessionStorage-დან
        const storedKey = sessionStorage.getItem('qa_session_key');

        if (storedKey) {
          try {
            const keyData = JSON.parse(storedKey);

            const restoredKey = await crypto.subtle.importKey(
              'jwk',
              keyData,
              { name: 'AES-GCM', length: 256 },
              true,
              ['encrypt', 'decrypt']
            );

            const encrypted = await SecureStorage.getEncryptedData();

            if (encrypted) {
              const decryptedData = await CryptoModule.decryptData(
                encrypted.encrypted,
                encrypted.iv,
                restoredKey
              );

              setEncryptionKey(restoredKey);
              encryptionKeyRef.current = restoredKey;
              setData(normalizeData(decryptedData));
              setInitState('logged-in');
              console.log('[v2.0] Session restored after refresh');
              return;
            }
          } catch (err) {
            console.warn('[v2.0] Session restore failed. Clearing session.', err);
            sessionStorage.removeItem('qa_session_key');
          }
        }

        setInitState('has-user');
      } catch (err) {
        console.error('Storage init error:', err);
        setInitState('no-user');
      }
    })();
  }, []);

  const saveSessionKey = async (key) => {
    try {
      const exportedKey = await crypto.subtle.exportKey('jwk', key);
      sessionStorage.setItem('qa_session_key', JSON.stringify(exportedKey));
      console.log('[v2.0] Session key saved');
    } catch (err) {
      console.error('[v2.0] Session key save failed:', err);
    }
  };

  const handleLogout = useCallback(() => {
    setEncryptionKey(null);
    setData(null);
    setActive("dashboard");
    setInitState('has-user');
    if (saveTimer.current) clearTimeout(saveTimer.current);
    
    sessionStorage.removeItem('qa_session_key');
  }, []);

  const handlePlatformReset = useCallback(async () => {
    await SecureStorage.deleteAllData();

    if (saveTimer.current) clearTimeout(saveTimer.current);

    setEncryptionKey(null);
    encryptionKeyRef.current = null;
    setData(null);
    setUser(null);
    setActive("dashboard");
    setSelectedEmployee("");
    setSelectedCategory("");
    setInitState('no-user');

    sessionStorage.removeItem('qa_session_key');
    console.log('[v2.0] Platform reset completed');
  }, []);

  const handleRegistration = async (key, initialData, email) => {
    setLoadProgress(0);
    setEncryptionKey(key);
    encryptionKeyRef.current = key;
    setLoadProgress(50);
    setData(initialData);
    setLoadProgress(100);
    setUser({ email });
    setInitState('logged-in');

    await saveSessionKey(key);

    setTimeout(() => setLoadProgress(0), 500);
  };

  const handleLogin = async (key, decryptedData, email) => {
    setLoadProgress(0);
    setEncryptionKey(key);
    encryptionKeyRef.current = key;
    setLoadProgress(50);
    setData(decryptedData);
    setLoadProgress(100);
    setUser({ email });
    setInitState('logged-in');

    await saveSessionKey(key);

    setTimeout(() => setLoadProgress(0), 500);
  };

  const saveData = async (nextData) => {
    if (!encryptionKeyRef.current) return;

    setData(nextData);
    setSaveState("saving");

    if (saveTimer.current) clearTimeout(saveTimer.current);

    saveTimer.current = setTimeout(async () => {
      try {
        const encryptedPayload = await CryptoModule.encryptData(nextData, encryptionKeyRef.current);
        await SecureStorage.saveEncryptedData(encryptedPayload);
        setSaveState("saved");
        setTimeout(() => setSaveState("idle"), 1500);
      } catch (err) {
        console.error('Save error:', err);
        setSaveState("idle");
      }
    }, 350);
  };

  // Auto-save every 5 minutes
  useEffect(() => {
    if (data && encryptionKey) {
      const autoSaveInterval = setInterval(() => {
        if (saveState === "idle") {
          console.log('[v2.0] Auto-save triggered');
          saveData(data);
        }
      }, 5 * 60 * 1000);

      return () => clearInterval(autoSaveInterval);
    }
  }, [data, encryptionKey, saveState]);

  // beforeunload emergency save
  useEffect(() => {
    const handleBeforeUnload = (e) => {
      if (saveTimer.current && encryptionKeyRef.current && data) {
        e.preventDefault();
        e.returnValue = '';

        clearTimeout(saveTimer.current);

        CryptoModule.encryptData(data, encryptionKeyRef.current)
          .then(encryptedPayload => SecureStorage.saveEncryptedData(encryptedPayload))
          .then(() => console.log('[v2.0] Emergency save completed'))
          .catch(err => console.error('[v2.0] Emergency save failed:', err));
      }
    };

    window.addEventListener('beforeunload', handleBeforeUnload);
    return () => window.removeEventListener('beforeunload', handleBeforeUnload);
  }, [data]);

  // Memory cleanup on logout
  useEffect(() => {
    if (initState === 'has-user' && !encryptionKey) {
      setData(null);
      setSelectedEmployee("");
      setSelectedCategory("");

      if (typeof window !== 'undefined' && window.gc) {
        console.log('[v2.0] Triggering garbage collection');
        window.gc();
      }
    }
  }, [initState, encryptionKey]);

  const goToEmployee = name => {
    setSelectedEmployee(name);
    setActive("employeeDetail");
  };

  if (initState === 'checking') {
    return React.createElement("div", { className: "qa-root min-h-screen flex items-center justify-center bg-[#F3F1E7]" },
      React.createElement(FontStyles, null),
      React.createElement("div", { className: "flex flex-col items-center gap-3 text-[#16213E]" },
        React.createElement(Icon, { name: "shield", className: "animate-pulse", size: 32 }),
        React.createElement("p", { className: "text-sm font-medium" }, "სისტემის ინიციალიზაცია...")
      )
    );
  }

  if (initState === 'no-user') {
    return React.createElement(RegistrationPage, {
      onRegister: handleRegistration
    });
  }

  if (initState === 'has-user' && !encryptionKey) {
    return React.createElement(LoginPage, {
      userEmail: user?.email || "",
      onLogin: handleLogin,
      onReset: handlePlatformReset
    });
  }

  if (!data) {
    return React.createElement("div", { className: "qa-root min-h-screen flex items-center justify-center bg-[#F3F1E7]" },
      React.createElement(FontStyles, null),
      React.createElement("div", { className: "flex flex-col items-center gap-3 text-[#16213E]" },
        React.createElement(Icon, { name: "lock_open", className: "animate-pulse", size: 32 }),
        React.createElement("p", { className: "text-sm font-medium" }, "მონაცემების გაშიფვრა..."),
        loadProgress > 0 && React.createElement("div", { className: "w-64 h-2 bg-[#EFEDE2] rounded-full overflow-hidden mt-2" },
          React.createElement("div", {
            className: "h-full bg-[#B8860B] transition-all duration-300",
            style: { width: `${loadProgress}%` }
          })
        )
      )
    );
  }

  return React.createElement("div", { className: "qa-root flex bg-[#F3F1E7] min-h-screen" },
    React.createElement(FontStyles, null),

    React.createElement(Sidebar, {
      active,
      setActive,
      open: navOpen,
      setOpen: setNavOpen,
      caseCount: data.cases.length
    }),

    React.createElement("div", { className: "flex-1 flex flex-col min-w-0 lg:ml-64" },
      React.createElement("header", {
        className: "qa-noprint flex items-center justify-between px-4 lg:px-8 py-3 border-b border-[#E4E1D6] bg-[#FBF9F3]"
      },
        React.createElement("button", {
          className: "lg:hidden p-2 rounded-md hover:bg-[#EFEDE2]",
          onClick: () => setNavOpen(true)
        },
          React.createElement(Icon, {
            name: "menu",
            size: 18,
            className: "text-[#16213E]"
          })
        ),

        React.createElement("div", { className: "flex items-center gap-2 text-xs text-[#9A967F]" },
          React.createElement(Icon, { name: "shield", size: 13 }),
          React.createElement("span", null, user?.email)
        ),

        React.createElement("div", { className: "flex items-center gap-3 text-xs font-medium" },
          saveState === "saving" && React.createElement("span", { className: "text-[#B8860B] flex items-center gap-1" },
            React.createElement(Icon, { name: "sync", size: 12 }),
            "ინახება..."
          ),

          saveState === "saved" && React.createElement("span", { className: "text-[#1F6F50] flex items-center gap-1" },
            React.createElement(Icon, { name: "check_circle", size: 12 }),
            "შენახულია"
          ),

          React.createElement("button", {
            onClick: handleLogout,
            className: "flex items-center gap-1 text-[#9A967F] hover:text-[#C0392B] font-semibold"
          },
            React.createElement(Icon, { name: "logout", size: 13 }),
            "გასვლა"
          )
        )
      ),

      React.createElement("main", {
        className: "flex-1 overflow-y-auto qa-scroll px-4 lg:px-8 py-6"
      },
        active === "dashboard" && React.createElement(DashboardPage, {
          cases: data.cases
        }),

        active === "cases" && React.createElement(CasesPage, {
          data,
          saveData
        }),

        active === "employees" && React.createElement(EmployeesPage, {
          data,
          saveData,
          goToEmployee
        }),

        active === "employeeDetail" && React.createElement(EmployeeDetailPage, {
          data,
          selected: selectedEmployee,
          setSelected: setSelectedEmployee
        }),

        active === "categoryDetail" && React.createElement(CategoryDetailPage, {
          data,
          selected: selectedCategory,
          setSelected: setSelectedCategory
        }),

        active === "settings" && React.createElement(SettingsPage, {
          data,
          saveData,
          onPlatformReset: handlePlatformReset
        })
      )
    )
  );
}
/* ================================================================== */
/*  🎬 RENDER APP                                                     */
/* ================================================================== */

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(React.createElement(QAAuditPlatform, null));
document.getElementById("boot-loader").remove();

} catch (err) {
  showBootError("JS შეცდომა: " + (err && err.stack ? err.stack : err));
}
</script>
</body>
</html>
