/* ================================================================== */
/*  INCIDENTS PAGE (შემთხვევები)                                   */
/* ================================================================== */

function IncidentsPage({ data, saveData }) {
  const [query, setQuery] = useState("");
  const [typeFilter, setTypeFilter] = useState("");
  const [markFilter, setMarkFilter] = useState("");
  const [consultationFilter, setConsultationFilter] = useState("");
  const [extraFilters, setExtraFilters] = useState({});
  const [timeFilters, setTimeFilters] = useState({
    date: "",
    week: "",
    month: "",
    quarter: "",
    year: ""
  });
  const [editing, setEditing] = useState(null);
  const [adding, setAdding] = useState(false);
  const [toDelete, setToDelete] = useState(null);
  const [printId, setPrintId] = useState(null);
  const [selectedIds, setSelectedIds] = useState([]);
  const [bulkDeletePending, setBulkDeletePending] = useState(false);
  const [highlightTarget, setHighlightTarget] = useState(null);
  const highlightTimerRef = useRef(null);

  const handleViewDuplicate = (record, fieldKey, value) => {
    setEditing(null);
    setAdding(false);
    setTypeFilter("");
    setMarkFilter("");
    setConsultationFilter("");
    setExtraFilters({});
    setTimeFilters({ date: "", week: "", month: "", quarter: "", year: "" });
    setQuery(asIdString(value).trim());
    setHighlightTarget(record && record.id ? { id: record.id, fieldKey: fieldKey } : null);
    if (highlightTimerRef.current) clearTimeout(highlightTimerRef.current);
    highlightTimerRef.current = setTimeout(() => setHighlightTarget(null), 4500);
  };

  const incidents = data.incidents || [];
  const extraCfg = normalizeIncidentExtraFields(data.incidentExtraFields);
  const extraFilterDefs = useMemo(
    () => incidentExtraKeysForFilter(extraCfg, incidents),
    [data.incidentExtraFields, incidents]
  );

  useEffect(() => {
    setSelectedIds([]);
  }, [query, typeFilter, markFilter, consultationFilter, extraFilters, timeFilters.date, timeFilters.week, timeFilters.month, timeFilters.quarter, timeFilters.year]);

  useEffect(() => {
    if (printId) {
      const t = setTimeout(() => window.print(), 100);
      const onAfterPrint = () => setPrintId(null);
      window.addEventListener("afterprint", onAfterPrint);
      return () => {
        clearTimeout(t);
        window.removeEventListener("afterprint", onAfterPrint);
      };
    }
  }, [printId]);

  const searchIndex = useMemo(() => {
    return incidents.map(i => ({
      id: i.id,
      searchable: [
        i.jira, i.personalId, i.caseNo, i.employee, i.incidentType, i.consultation,
        i.incomingRequest, i.response, i.criticalNote, i.extraNote,
        i.category, i.department, i.helpType, i.delayReason, i.status, i.auditResult
      ].filter(Boolean).join(' ').toLowerCase()
    }));
  }, [incidents]);

  const years = useMemo(
    () => buildFilterYears((incidents || []).map(i => i.incidentDate || (i.createdAt || "").slice(0, 10))),
    [incidents]
  );

  useEffect(() => {
    if (timeFilters.year && !years.some(y => String(y) === String(timeFilters.year))) {
      setTimeFilters(f => ({ ...f, year: "" }));
    }
  }, [years, timeFilters.year]);

  const filtered = useMemo(() => {
    const normalized = incidents.map(i => ({
      ...i,
      incidentDate: i.incidentDate || (i.createdAt ? String(i.createdAt).slice(0, 10) : "")
    }));
    let result = applyFilters(normalized, timeFilters);
    if (typeFilter) result = result.filter(i => i.incidentTypeId === typeFilter || i.incidentType === typeFilter);
    if (markFilter) result = result.filter(i => markFilterMatch(i, markFilter));
    if (consultationFilter) {
      result = result.filter(i => {
        const ids = Array.isArray(i.consultationIds) ? i.consultationIds : (i.consultationId ? [i.consultationId] : []);
        return ids.includes(consultationFilter) || i.consultation === consultationFilter;
      });
    }
    Object.keys(extraFilters || {}).forEach(key => {
      const val = extraFilters[key];
      if (!val) return;
      const def = INCIDENT_EXTRA_FIELD_DEFS.find(d => d.key === key);
      if (def) {
        result = result.filter(i => i[key] === val || i[def.labelKey] === val);
        return;
      }

      result = result.filter(i => {
        const cv = normalizeCustomValues(i.customValues);
        return cv[key] === val;
      });
    });
    if (query) {
      const q = query.toLowerCase();
      const matchingIds = new Set(
        searchIndex.filter(item => item.searchable.includes(q)).map(item => item.id)
      );
      result = result.filter(i => matchingIds.has(i.id));
    }
    return result.slice().reverse();
  }, [incidents, typeFilter, markFilter, consultationFilter, extraFilters, query, searchIndex, timeFilters]);

  const filtersActive = Boolean(
    typeFilter || markFilter || consultationFilter || query ||
    Object.values(extraFilters || {}).some(Boolean) ||
    timeFilters.date || timeFilters.week || timeFilters.month || timeFilters.quarter || timeFilters.year
  );

  const saveIncident = form => {
    let list;
    if (editing) {
      list = incidents.map(i => i.id === editing.id ? { ...editing, ...form } : i);
    } else {
      const no = (incidents.reduce((m, i) => Math.max(m, i.no || 0), 0) || 0) + 1;
      list = [...incidents, { id: uid(), no, createdAt: new Date().toISOString(), ...form }];
    }
    saveData({ ...data, incidents: list });
    setEditing(null);
    setAdding(false);
  };

  const deleteIncident = () => {
    saveData({ ...data, incidents: incidents.filter(i => i.id !== toDelete.id) });
    setToDelete(null);
    setSelectedIds(ids => ids.filter(id => id !== toDelete.id));
  };

  const toggleSelect = (id) => {
    setSelectedIds(ids => ids.includes(id) ? ids.filter(x => x !== id) : [...ids, id]);
  };

  const toggleSelectAll = (pageIds, select) => {
    if (select) {
      setSelectedIds(prev => [...new Set([...prev, ...pageIds])]);
    } else {
      const pageSet = new Set(pageIds);
      setSelectedIds(prev => prev.filter(id => !pageSet.has(id)));
    }
  };

  const confirmBulkDelete = () => {
    const idSet = new Set(selectedIds);
    saveData({ ...data, incidents: incidents.filter(i => !idSet.has(i.id)) });
    setSelectedIds([]);
    setBulkDeletePending(false);
  };

  const generatedAt = `${formatDocDate()} ${formatDocTime()}`;

  const exportIncidentsExcel = async (list) => {

    const all = [...list].sort((a, b) => (a.no || 0) - (b.no || 0));
    const total = all.length;
    const criticalN = all.filter(i => i.critical).length;
    const nonCriticalN = total - criticalN;
    const typeTally = tally(all, "incidentType");
    const consultTally = tally(all, "consultation");
    const empTally = tally(
      all.map(i => ({ employeeLabel: i.employee || "თანამშრომელი არ არის მითითებული" })),
      "employeeLabel"
    );
    const criticalExcelRows = [
      ["დამატებითი ჩანაწერით", criticalN],
      ["დამატებითი ჩანაწერის გარეშე", nonCriticalN]
    ];

    const { NAVY, GREEN, RED, PAPER, WHITE, BORDERC, MUTED } = EXCEL_COLORS;

    const wb = new ExcelJS.Workbook();
    wb.creator = "QA აუდიტის პლათფორმა";
    wb.created = new Date();

    const dash = wb.addWorksheet("სტატისტიკა", { views: [{ showGridLines: false }] });
    dash.columns = [
      { width: 3 }, { width: 14 }, { width: 14 }, { width: 14 }, { width: 14 },
      { width: 14 }, { width: 14 }, { width: 14 }, { width: 14 }, { width: 3 }
    ];

    const dashBannerRight = paintExcelBanner(dash, NAVY, 10);

    const excelGeneratedAt = `${formatDocDate()} ${formatDocTime()}`;
    const respLines = getResponsiblePersonLines(data);
    dash.mergeCells(`C2:${dashBannerRight}2`);
    const respCell = dash.getCell("C2");
    respCell.value = respLines.primary;
    respCell.font = { size: 11, bold: true, color: { argb: WHITE } };
    respCell.alignment = { horizontal: "right", vertical: "middle" };

    dash.mergeCells(`C3:${dashBannerRight}3`);
    const respSubCell = dash.getCell("C3");
    respSubCell.value = [respLines.secondary, excelGeneratedAt].filter(Boolean).join("   •   ");
    respSubCell.font = { size: 9, color: { argb: WHITE } };
    respSubCell.alignment = { horizontal: "right", vertical: "middle" };

    dash.addImage(wb.addImage({ base64: LOGO_PNG_BASE64, extension: "png" }), {
      tl: { col: 0.55, row: 1.1 },
      ext: { width: 180, height: 40 }
    });

    dash.mergeCells("B4:I4");
    const sectionTitleCell = dash.getCell("B4");
    sectionTitleCell.value = "შემთხვევების მიმოხილვა";
    sectionTitleCell.font = { size: 15, bold: true, color: { argb: NAVY }, name: "Calibri" };
    sectionTitleCell.alignment = { vertical: "middle" };
    dash.getRow(4).height = 26;

    const kpis = [
      ["სულ შემთხვევა", total, NAVY, "B"],
      ["დამატებითი ჩანაწერით", criticalN, RED, "E"],
      ["დამატებითი ჩანაწერის გარეშე", nonCriticalN, GREEN, "H"]
    ];

    kpis.forEach(([label, value, color, col]) => {
      const nextCol = String.fromCharCode(col.charCodeAt(0) + 1);
      dash.mergeCells(`${col}5:${nextCol}5`);
      dash.mergeCells(`${col}6:${nextCol}7`);
      const labelCell = dash.getCell(`${col}5`);
      labelCell.value = label;
      labelCell.font = { size: 10, bold: true, color: { argb: MUTED } };
      const valueCell = dash.getCell(`${col}6`);
      valueCell.value = value;
      valueCell.font = { size: 26, bold: true, color: { argb: color } };
      valueCell.alignment = { vertical: "middle" };
    });

    const donutW = 430, donutH = 230;
    const starImg = chartDrawDonut(criticalExcelRows, donutW, donutH, "დამატებითი ჩანაწერი", ["#C0392B", "#6B7A99"]);
    dash.addImage(wb.addImage({ base64: starImg, extension: "png" }), "B9:E17");

    const typeImg = chartDrawDonut(typeTally, donutW, donutH, "შემთხვევების ტიპები");
    dash.addImage(wb.addImage({ base64: typeImg, extension: "png" }), "F9:I17");

    let row = 19;
    const empImgH = Math.max(empTally.length * 34 + 46, 140);
    const empImg = chartDrawBar(empTally, 900, empImgH, "თანამშრომლების ჭრილი");
    const spanRows = Math.max(Math.round(empImgH / 20), 6);
    dash.addImage(wb.addImage({ base64: empImg, extension: "png" }), `B${row}:I${row + spanRows}`);

    const rs = wb.addWorksheet("ჩანაწერები", { views: [{ state: "frozen", ySplit: 5 }] });

    const incIdKeys = idKeysForExcel(all);
    const incIdHeaders = incIdKeys.map(k => {
      const def = ID_FIELD_DEFS.find(d => d.key === k);
      return [def ? def.label : k, 22];
    });

    const extraDefsExcel = incidentExtraKeysForExcel(data.incidentExtraFields, all);
    const extraHeaders = extraDefsExcel.map(d => [d.label, 22]);
    const incCustomExcel = customFieldsForExcel(data.customFieldDefs, "incidents", all);
    const incCustomHeaders = incCustomExcel.map(f => [f.label, customFieldExcelWidth(f)]);

    const exportConsultInc = shouldExportConsultation(data.consultationExcelExport, "incidents");
    const exportIncidentDate = isIncidentDateExcel(data.incidentExtraFields, "incidentDate");
    const exportAuditDate = isIncidentDateExcel(data.incidentExtraFields, "auditDate");
    const dateHeadersExcel = [
      ...(exportIncidentDate ? [["შემთხვევის თარიღი", 16]] : []),
      ...(exportAuditDate ? [["აუდიტის თარიღი", 15]] : [])
    ];
    const exportExtraNoteInc = !!(normalizeExtraNoteConfig(data.extraNoteConfig).incidents.excel)
      && all.some(i => String(i.extraNote || "").trim() !== "");
    const headerDefs = [
      ["№", 6],
      ...dateHeadersExcel,
      ...incIdHeaders,
      ["თანამშრომელი", 45],
      ["შემთხვევა", 45],
      ...(exportExtraNoteInc ? [[EXTRA_NOTE_LABEL, 53]] : []),
      ...extraHeaders,
      ["კომენტარი", 40],
      ["შემოსული მოთხოვნა", 53],
      ["დაბრუნებული პასუხი", 53],
      ...(exportConsultInc ? [["საქმის ადრესატი", 28]] : []),
      ...incCustomHeaders
    ];
    const dateColCount = (exportIncidentDate ? 1 : 0) + (exportAuditDate ? 1 : 0);
    const dateColIndexes = [];
    if (exportIncidentDate) dateColIndexes.push(2);
    if (exportAuditDate) dateColIndexes.push(exportIncidentDate ? 3 : 2);
    const incIdColIndexes = incIdKeys.map((_, idx) => 2 + dateColCount + idx);
    const centeredCols = new Set([1, ...dateColIndexes, ...incIdColIndexes]);
    const rsLastColLetter = excelColLetter(headerDefs.length);
    const commentColInc = headerDefs.findIndex(([h]) => h === "კომენტარი") + 1;

    rs.columns = headerDefs.map(([h, w]) => ({ key: h, width: w }));

    const rsBannerRight = paintExcelBanner(rs, NAVY, headerDefs.length);

    rs.mergeCells(`C2:${rsBannerRight}2`);
    const rsRespCell = rs.getCell("C2");
    const rsRespLines = getResponsiblePersonLines(data);
    rsRespCell.value = rsRespLines.primary;
    rsRespCell.font = { size: 11, bold: true, color: { argb: WHITE } };
    rsRespCell.alignment = { horizontal: "right", vertical: "middle" };

    rs.mergeCells(`C3:${rsBannerRight}3`);
    const rsExcelGeneratedAt = `${formatDocDate()} ${formatDocTime()}`;
    const rsRespSubCell = rs.getCell("C3");
    rsRespSubCell.value = [rsRespLines.secondary, rsExcelGeneratedAt].filter(Boolean).join("   •   ");
    rsRespSubCell.font = { size: 9, color: { argb: WHITE } };
    rsRespSubCell.alignment = { horizontal: "right", vertical: "middle" };

    rs.addImage(wb.addImage({ base64: LOGO_PNG_BASE64, extension: "png" }), {
      tl: { col: 0.55, row: 1.1 },
      ext: { width: 180, height: 40 }
    });

    rs.mergeCells(`A4:${rsLastColLetter}4`);
    const rsSectionTitle = rs.getCell("A4");
    rsSectionTitle.value = "შემთხვევების ჩანაწერები";
    rsSectionTitle.font = { size: 14, bold: true, color: { argb: NAVY }, name: "Calibri" };
    rsSectionTitle.alignment = { vertical: "middle" };
    rs.getRow(4).height = 24;

    const headerRow = rs.getRow(5);
    headerDefs.forEach(([label], i) => { headerRow.getCell(i + 1).value = label; });
    headerRow.eachCell((cell, colNumber) => {
      cell.font = { bold: true, color: { argb: WHITE } };
      cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: NAVY } };
      cell.alignment = {
        vertical: "middle",
        horizontal: centeredCols.has(colNumber) ? "center" : "left",
        wrapText: true
      };
    });
    headerRow.height = 26;

    all.forEach((inc, i) => {
      const critNote = inc.critical
        ? ((inc.criticalNote || "").trim() || "კომენტარი არ არის")
        : "";
      const idVals = incIdKeys.map(k => asIdString(inc[k]));
      const extraVals = extraDefsExcel.map(d => {
        const lab = inc[d.labelKey];
        if (lab && String(lab).trim()) return String(lab);
        return labelOf(data[d.listKey] || [], inc[d.key]) || "";
      });
      const cv = normalizeCustomValues(inc.customValues);
      const customVals = incCustomExcel.map(f => customFieldDisplayValue(f, cv[f.id]));
      const extraNoteVal = String(inc.extraNote || "").trim();
      const r = rs.addRow([
        inc.no,
        ...(exportIncidentDate ? [inc.incidentDate || ""] : []),
        ...(exportAuditDate ? [inc.auditDate || ""] : []),
        ...idVals,
        inc.employee || "თანამშრომელი არ არის მითითებული",
        inc.incidentType || "",
        ...(exportExtraNoteInc ? [extraNoteVal] : []),
        ...extraVals,
        critNote,
        inc.incomingRequest || "",
        inc.response || "",
        ...(exportConsultInc ? [(inc.consultation || "").trim() || ""] : []),
        ...customVals
      ]);

      incIdKeys.forEach((k, idx) => {
        const col = 2 + dateColCount + idx;
        const raw = asIdString(inc[k]).trim();
        if (!raw) return;
        const cell = r.getCell(col);
        if (k === "jira") {
          cell.value = { text: raw, hyperlink: jiraUrl(raw) };
          cell.font = { color: { argb: "FF0563C1" }, underline: true };
        } else if (k === "personalId") {
          cell.value = { text: raw, hyperlink: PERSONAL_ID_URL };
          cell.font = { color: { argb: "FF0563C1" }, underline: true };
          cell.numFmt = "@";
        } else {
          cell.value = raw;
          cell.numFmt = "@";
        }
      });

      if (inc.critical) {
        r.eachCell(cell => {
          cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFF6E4E1" } };
        });
        if (commentColInc > 0) {
          r.getCell(commentColInc).font = { bold: true, color: { argb: RED } };
        }
      } else if (i % 2 === 1) {
        r.eachCell(cell => {
          if (!cell.font || !cell.font.color) {
            cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: PAPER } };
          }
        });
      }

      r.eachCell((cell, colNumber) => {
        cell.border = { bottom: { style: "thin", color: { argb: BORDERC } } };
        cell.alignment = {
          vertical: "middle",
          horizontal: centeredCols.has(colNumber) ? "center" : "left",
          wrapText: true
        };
      });

      r.height = excelRowHeightFromLengths([
        (inc.incomingRequest || "").length,
        (inc.response || "").length,
        critNote.length,
        extraNoteVal.length,
        ...extraVals.map(v => String(v || "").length),
        ...customVals.map(v => String(v || "").length)
      ]);
    });

    rs.autoFilter = {
      from: "A5",
      to: `${rsLastColLetter}5`
    };

    applyExcelPrintSetup(rs, {
      lastColLetter: rsLastColLetter,
      lastRow: rs.rowCount,
      titleRows: "1:5",
      orientation: "landscape"
    });
    applyExcelPrintSetup(dash, {
      lastColLetter: "J",
      lastRow: dash.rowCount || 40,
      titleRows: "1:3",
      orientation: "landscape"
    });

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], {
      type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `qa-incidents-report-${new Date().toISOString().slice(0, 10)}.xlsx`;
    a.click();
  };

  const selectCls = "px-2.5 py-1.5 rounded-md border border-[#DBD7C8] bg-white text-sm text-[#2C2B24] focus:outline-none focus:ring-2 focus:ring-[#B8860B]/40";
  const printIncident = printId ? incidents.find(i => i.id === printId) : null;

function EmployeesPage({ data, saveData, goToEmployee }) {
  const [editing, setEditing] = useState(null);
  const [adding, setAdding] = useState(false);
  const [toDelete, setToDelete] = useState(null);
  
  const stats = name => {
    const list = data.cases.filter(c => c.operator === name || c.operatorId === (data.employees.find(e => e.name === name) || {}).id);
    const closed = list.filter(c => isStatusClosed(c)).length;
    return { total: list.length, closed, open: list.length - closed };
  };
  
  const save = form => {
    let employees;
    if (editing) {
      employees = data.employees.map(e => e.id === editing.id ? { ...editing, ...form } : e);
    } else {
      employees = [...data.employees, { id: newRefId("emp"), ...form }];
    }
    saveData(resyncLabels({ ...data, employees }));
    setEditing(null);
    setAdding(false);
  };
  
  const remove = () => {
    saveData({ ...data, employees: data.employees.filter(e => e.id !== toDelete.id) });
    setToDelete(null);

      try {
        const parsed = JSON.parse(reader.result);

          setImportModal({

        } else if (parsed.encrypted === false && parsed.data) {

function QAAuditPlatform() {
  const [initState, setInitState] = useState('checking');
  const [user, setUser] = useState(null);
  const [encryptionKey, setEncryptionKey] = useState(null);
  const [data, setData] = useState(null);
  const [active, setActive] = useState("dashboard");
  const [navOpen, setNavOpen] = useState(false);
  const [selectedEmployee, setSelectedEmployee] = useState("");
  const [selectedCategory, setSelectedCategory] = useState("");
  const [saveState, setSaveState] = useState("idle");
  const [loadProgress, setLoadProgress] = useState(0);
  const [lastBackupAt, setLastBackupAt] = useState(null);
  const [showBackupReminder, setShowBackupReminder] = useState(false);
  const [storagePersisted, setStoragePersisted] = useState(null);

  const saveTimer = useRef(null);
  const encryptionKeyRef = useRef(null);
  const dataRef = useRef(null);
  const saveEpochRef = useRef(0);
  const saveInFlightRef = useRef(null);
  const lastSavedJsonRef = useRef(null);

  useEffect(() => {
    encryptionKeyRef.current = encryptionKey;
  }, [encryptionKey]);

  useEffect(() => {
    dataRef.current = data;
  }, [data]);

  const toNonExtractableKey = async (key) => {
    try {
      const jwk = await crypto.subtle.exportKey('jwk', key);
      return await crypto.subtle.importKey(
        'jwk',
        jwk,
        { name: 'AES-GCM', length: 256 },
        false, 
        ['encrypt', 'decrypt']
      );
    } catch (err) {
      return key;
    }
  };


  useEffect(() => {
    (async () => {
      try {
        await SecureStorage.init();
        try { sessionStorage.removeItem('qa_session_key'); } catch (_) {}

        const existingUser = await SecureStorage.getUser();

        if (!existingUser) {
          setInitState('no-user');
          return;
        }

        setUser(existingUser);
        setInitState('has-user');
      } catch (err) {
        console.error('Storage init error:', err);
        setInitState('no-user');
      }
    })();
  }, []);

  const lockKeyInMemory = async (key) => {
    try {
      const locked = await toNonExtractableKey(key);
  
      return locked;
    } catch (err) {
      console.error('[v2.0] lockKeyInMemory failed:', err);
      return key;
    }
  };

  const cancelPendingSave = () => {
    if (saveTimer.current) {
      clearTimeout(saveTimer.current);
      saveTimer.current = null;
    }
    saveEpochRef.current += 1;
  };

  const markSaved = (snapshot) => {
    try {
      lastSavedJsonRef.current = JSON.stringify(snapshot);
    } catch (_) {
      lastSavedJsonRef.current = null;
    }
  };

  const isDirty = () => {
    if (!dataRef.current) return false;
    if (saveTimer.current) return true;
    try {
      return JSON.stringify(dataRef.current) !== lastSavedJsonRef.current;
    } catch (_) {
      return true;
    }
  };

  const persistNow = async () => {
    if (!encryptionKeyRef.current || !dataRef.current) return;

    if (saveTimer.current) {
      clearTimeout(saveTimer.current);
      saveTimer.current = null;
    }

    if (saveInFlightRef.current) {
      try { await saveInFlightRef.current; } catch (_) {}
    }
    if (!isDirty()) return;

    const key = encryptionKeyRef.current;

    const epoch = saveEpochRef.current;
    if (!key || !dataRef.current) return;
    if (epoch !== saveEpochRef.current) return;

    setSaveState("saving");

    const workPromise = (async () => {
      try {
        const toSave = dataRef.current;
        if (!toSave) return;

        const encryptedPayload = await CryptoModule.encryptData(toSave, key);
        if (epoch !== saveEpochRef.current) return;

        await SecureStorage.saveEncryptedData(encryptedPayload);
        if (epoch !== saveEpochRef.current) return;

        markSaved(toSave);

        let stillDirty = false;
        try {
          stillDirty = JSON.stringify(dataRef.current) !== JSON.stringify(toSave);
        } catch (_) {
          stillDirty = dataRef.current !== toSave;
        }

        if (stillDirty && epoch === saveEpochRef.current && encryptionKeyRef.current) {
          setSaveState("saving");
          if (saveTimer.current) clearTimeout(saveTimer.current);
          const followEpoch = saveEpochRef.current;
          saveTimer.current = setTimeout(() => {
            saveTimer.current = null;
            if (followEpoch !== saveEpochRef.current) return;
            persistNow();
          }, 100);
        } else {
          setSaveState("saved");
          setTimeout(() => {
            setSaveState(s => (s === "saved" ? "idle" : s));
          }, 1500);
        }
      } catch (err) {
        console.error('[v2.0] Save failed:', err);
        setSaveState("error");
      } finally {
        if (saveInFlightRef.current === workPromise) {
          saveInFlightRef.current = null;
        }
      }
    })();

    saveInFlightRef.current = workPromise;
    await workPromise;
  };

  const flushPendingSave = () => persistNow();

  const retrySave = () => {
    if (!encryptionKeyRef.current || !dataRef.current) return;
    persistNow();
  };

  const preparePasswordChange = async () => {
    cancelPendingSave();
    if (saveInFlightRef.current) {
      try { await saveInFlightRef.current; } catch (_) {}
    }
  };

  const handleLogout = useCallback(async () => {
    try {
      await persistNow();
    } catch (_) { /* best-effort flush */ }
    cancelPendingSave();
    setEncryptionKey(null);
    encryptionKeyRef.current = null;
    setData(null);
    dataRef.current = null;
    lastSavedJsonRef.current = null;
    setActive("dashboard");
    setInitState('has-user');
    setLastBackupAt(null);
  }, []);

  const handlePlatformReset = useCallback(async () => {
    cancelPendingSave();
    await SecureStorage.deleteAllData();

    setEncryptionKey(null);
    encryptionKeyRef.current = null;
    setData(null);
    dataRef.current = null;
    lastSavedJsonRef.current = null;
    setUser(null);
    setActive("dashboard");
    setSelectedEmployee("");
    setSelectedCategory("");
    setInitState('no-user');
    setLastBackupAt(null);
    setStoragePersisted(null);

    try { sessionStorage.removeItem('qa_session_key'); } catch (_) {}
 
  }, []);

  const handleRegistration = async (key, initialData, email) => {
    setLoadProgress(0);
    const lockedKey = await lockKeyInMemory(key);
    setEncryptionKey(lockedKey);
    encryptionKeyRef.current = lockedKey;
    setLoadProgress(50);
    setData(initialData);
    dataRef.current = initialData;
    markSaved(initialData);
    setLoadProgress(100);
    setUser({ email });
    setInitState('logged-in');

    setTimeout(() => setLoadProgress(0), 500);
  };

  const handleLogin = async (key, decryptedData, email) => {
    setLoadProgress(0);
    const lockedKey = await lockKeyInMemory(key);
    setEncryptionKey(lockedKey);
    encryptionKeyRef.current = lockedKey;
    setLoadProgress(50);
    setData(decryptedData);
    dataRef.current = decryptedData;
    markSaved(decryptedData);
    setLoadProgress(100);
    setUser({ email });
    setInitState('logged-in');

    try {
      const encryptedPayload = await CryptoModule.encryptData(decryptedData, lockedKey);
      await SecureStorage.saveEncryptedData(encryptedPayload);
    } catch (e) {
      console.warn('[id-model] could not persist migrated data on login', e);
    }

    setTimeout(() => setLoadProgress(0), 500);
  };

  const saveData = async (nextData) => {
    if (!encryptionKeyRef.current) return;

    setData(nextData);
    dataRef.current = nextData;
    setSaveState("saving");

    if (saveTimer.current) clearTimeout(saveTimer.current);

    const epochAtSchedule = saveEpochRef.current;

    saveTimer.current = setTimeout(() => {
      saveTimer.current = null;
      if (epochAtSchedule !== saveEpochRef.current) return;
      if (!encryptionKeyRef.current || !dataRef.current) return;
      persistNow();
    }, 350);
  };

  useEffect(() => {
    if (data && encryptionKey) {
      const autoSaveInterval = setInterval(() => {
        if (isDirty() && encryptionKeyRef.current && dataRef.current) {
  
          flushPendingSave();
        }
      }, 5 * 60 * 1000);

      return () => clearInterval(autoSaveInterval);
    }
  }, [data, encryptionKey]);


  useEffect(() => {
    const handleVisibilityOrHide = () => {
      if (document.visibilityState === 'hidden' || document.hidden) {
        if (isDirty()) flushPendingSave();
      }
    };

    const handlePageHide = () => {
      if (isDirty()) flushPendingSave();
    };

    const handleBeforeUnload = (e) => {
      if (isDirty()) {

        flushPendingSave();
        e.preventDefault();
        e.returnValue = '';
      }
    };

    document.addEventListener('visibilitychange', handleVisibilityOrHide);
    window.addEventListener('pagehide', handlePageHide);
    window.addEventListener('beforeunload', handleBeforeUnload);
    return () => {
      document.removeEventListener('visibilitychange', handleVisibilityOrHide);
      window.removeEventListener('pagehide', handlePageHide);
      window.removeEventListener('beforeunload', handleBeforeUnload);
    };
  }, []);

  useEffect(() => {
    if (initState === 'has-user' && !encryptionKey) {
      setData(null);
      dataRef.current = null;
      lastSavedJsonRef.current = null;
      setSelectedEmployee("");
      setSelectedCategory("");

      if (typeof window !== 'undefined' && window.gc) {

        window.gc();
      }
    }
  }, [initState, encryptionKey]);

  const handlePasswordChanged = useCallback(async (newEncryptionKey) => {
    cancelPendingSave();
    if (saveInFlightRef.current) {
      try { await saveInFlightRef.current; } catch (_) { /* ignore */ }
    }
    const lockedKey = await lockKeyInMemory(newEncryptionKey);
    setEncryptionKey(lockedKey);
    encryptionKeyRef.current = lockedKey;
    if (dataRef.current) markSaved(dataRef.current);
    setSaveState("idle");
  }, []);

  const refreshBackupStatus = useCallback(async () => {
    try {
      const u = await SecureStorage.getUser();
      setLastBackupAt(u?.lastBackupAt || null);
    } catch (e) {
      console.warn('[backup] status check failed', e);
    }
  }, []);

  const recordBackupDone = useCallback(async () => {
    try {
      const u = await SecureStorage.getUser();
      if (!u) return;
      const nowIso = new Date().toISOString();
      await SecureStorage.saveUser({ ...u, lastBackupAt: nowIso });
      setLastBackupAt(nowIso);
    } catch (e) {
      console.warn('[backup] could not record backup timestamp', e);
    }
  }, []);

  const requestPersist = useCallback(async () => {
    const result = await PersistentStorage.request();
    setStoragePersisted(result);
    return result;
  }, []);

  useEffect(() => {
    if (initState === 'logged-in') {
      refreshBackupStatus();
      requestPersist();
    }
  }, [initState, refreshBackupStatus, requestPersist]);

  useEffect(() => {
    if (initState !== 'logged-in') {
      setShowBackupReminder(false);
      return;
    }
    const tick = () => setShowBackupReminder(shouldShowBackupReminder(lastBackupAt));
    tick();
    const id = setInterval(tick, 60 * 1000);
    const onVis = () => { if (document.visibilityState === "visible") tick(); };
    const onFocus = () => tick();
    document.addEventListener("visibilitychange", onVis);
    window.addEventListener("focus", onFocus);
    return () => {
      clearInterval(id);
      document.removeEventListener("visibilitychange", onVis);
      window.removeEventListener("focus", onFocus);
    };
  }, [initState, lastBackupAt]);

  const goToEmployee = name => {
    setSelectedEmployee(name);
    setActive("employeeDetail");
  };

  if (initState === 'checking') {
    return React.createElement("div", { className: "qa-root min-h-screen flex items-center justify-center bg-[#F3F1E7]" },
      React.createElement(FontStyles, null),
      React.createElement("div", { className: "flex flex-col items-center gap-3 text-[#16213E]" },
        React.createElement(Icon, { name: "shield", className: "animate-pulse", size: 32 }),
        React.createElement("p", { className: "text-sm font-medium" }, "სისტემის ინიციალიზაცია...")
      )
    );
  }

  if (initState === 'no-user') {
    return React.createElement(RegistrationPage, {
      onRegister: handleRegistration
    });
  }

  if (initState === 'has-user' && !encryptionKey) {
    return React.createElement(LoginPage, {
      userEmail: user?.email || "",
      onLogin: handleLogin,
      onReset: handlePlatformReset
    });
  }

  if (!data) {
    return React.createElement("div", { className: "qa-root min-h-screen flex items-center justify-center bg-[#F3F1E7]" },
      React.createElement(FontStyles, null),
      React.createElement("div", { className: "flex flex-col items-center gap-3 text-[#16213E]" },
        React.createElement(Icon, { name: "lock_open", className: "animate-pulse", size: 32 }),
        React.createElement("p", { className: "text-sm font-medium" }, "მონაცემების გაშიფვრა..."),
        loadProgress > 0 && React.createElement("div", { className: "w-64 h-2 bg-[#EFEDE2] rounded-full overflow-hidden mt-2" },
          React.createElement("div", {
            className: "h-full bg-[#B8860B] transition-all duration-300",
            style: { width: `${loadProgress}%` }
          })
        )
      )
    );
  }

  return React.createElement("div", { className: "qa-root bg-[#F3F1E7] min-h-screen" },
    React.createElement(FontStyles, null),

    React.createElement(BackupReminderToast, {
      lastBackupAt,
      show: showBackupReminder,
      onGoToBackup: () => setActive("settings")
    }),
    React.createElement(AppToastHost, null),

    React.createElement("div", { className: "qa-app-frame" },
    React.createElement(Sidebar, {
      active,
      setActive,
      open: navOpen,
      setOpen: setNavOpen,
      caseCount: data.cases.length
    }),

    React.createElement("div", { className: "flex-1 flex flex-col min-w-0" },
      React.createElement("div", { className: "qa-shell flex flex-col flex-1 min-h-0 w-full" },
      React.createElement("header", {
        className: "qa-noprint qa-topbar flex items-center justify-between px-4 lg:px-8 py-3 border-b border-[#E4E1D6]"
      },
        React.createElement("button", {
          className: "lg:hidden p-2 rounded-md hover:bg-[#EFEDE2]",
          onClick: () => setNavOpen(true)
        },
          React.createElement(Icon, {
            name: "menu",
            size: 18,
            className: "text-[#16213E]"
          })
        ),

        React.createElement("div", { className: "flex items-center gap-2 text-xs text-[#9A967F]" },
          React.createElement(Icon, { name: "shield", size: 13 }),
          React.createElement("span", null, user?.email)
        ),

        React.createElement("div", { className: "flex items-center gap-3 text-xs font-medium" },
          saveState === "saving" && React.createElement("span", { className: "text-[#B8860B] flex items-center gap-1" },
            React.createElement(Icon, { name: "sync", size: 12 }),
            "ინახება..."
          ),

          saveState === "saved" && React.createElement("span", { className: "text-[#1F6F50] flex items-center gap-1" },
            React.createElement(Icon, { name: "check_circle", size: 12 }),
            "შენახულია"
          ),

          saveState === "error" && React.createElement("span", {
            className: "text-[#C0392B] flex items-center gap-1.5"
          },
            React.createElement(Icon, { name: "error", size: 12 }),
            React.createElement("span", null, "შენახვა ვერ მოხერხდა"),
            React.createElement("button", {
              type: "button",
              onClick: retrySave,
              className: "ml-1 px-2 py-0.5 rounded border border-[#C0392B]/40 bg-[#C0392B]/10 hover:bg-[#C0392B]/20 font-semibold text-[#C0392B]"
            }, "ხელახლა ცდა")
          ),

          React.createElement("button", {
            onClick: handleLogout,
            className: "flex items-center gap-1 text-[#9A967F] hover:text-[#C0392B] font-semibold"
          },
            React.createElement(Icon, { name: "logout", size: 13 }),
            "გასვლა"
          )
        )
      ),

      React.createElement("main", {
        className: "flex-1 overflow-y-auto qa-scroll px-4 lg:px-8 py-6"
      },
        React.createElement("div", { className: "qa-main-inner" },
        active === "dashboard" && React.createElement(DashboardPage, {
          cases: data.cases,
          incidents: data.incidents,
          consultations: data.consultations
        }),

        active === "cases" && React.createElement(CasesPage, {
          data,
          saveData
        }),

        active === "incidents" && React.createElement(IncidentsPage, {
          data,
          saveData
        }),

        active === "employees" && React.createElement(EmployeesPage, {
          data,
          saveData,
          goToEmployee
        }),

        active === "employeeDetail" && React.createElement(EmployeeDetailPage, {
          data,
          selected: selectedEmployee,
          setSelected: setSelectedEmployee
        }),

        active === "categoryDetail" && React.createElement(CategoryDetailPage, {
          data,
          selected: selectedCategory,
          setSelected: setSelectedCategory
        }),

        active === "settings" && React.createElement(SettingsPage, {
          data,
          saveData,
          onPlatformReset: handlePlatformReset,
          onPasswordChanged: handlePasswordChanged,
          userEmail: user?.email || "",
          lastBackupAt,
          onBackupRecorded: recordBackupDone,
          getLatestData: () => dataRef.current,
          onPreparePasswordChange: preparePasswordChange
        })
        )
      )
      )
    )
    )
  );
}
/* ================================================================== */
/*   ERROR BOUNDARY (guards against a blank white screen)           */
/*  Purely defensive UI never touches storage or encryption state,   */
/*  so it cannot introduce any data-loss risk. On a render crash it    */
/*  offers a reload (safe: IndexedDB data is untouched by a reload).  */
/* ================================================================== */

class AppErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }

  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }

  componentDidCatch(error, info) {
    console.error('[AppErrorBoundary] caught render error:', error, info);
  }

  render() {
    if (this.state.hasError) {
      return React.createElement("div", {
        className: "qa-root min-h-screen flex items-center justify-center bg-[#F3F1E7] p-6"
      },
        React.createElement(FontStyles, null),
        React.createElement("div", {
          className: "w-full max-w-md bg-white rounded-xl border border-[#E4E1D6] shadow-2xl p-8 flex flex-col items-center gap-4 text-center"
        },
          React.createElement("div", { className: "w-12 h-12 rounded-lg bg-[#F6E4E1] flex items-center justify-center" },
            React.createElement(Icon, { name: "error", size: 24, className: "text-[#C0392B]" })
          ),
          React.createElement("h1", { className: "qa-serif text-lg font-bold text-[#16213E]" }, "მოულოდნელი შეცდომა"),
          React.createElement("p", { className: "text-sm text-[#6B6A5C]" },
            "ინტერფეისმა შეცდომა დაუშვა, მაგრამ თქვენი დაშიფრული მონაცემები ხელუხლებელია ეს იყო მხოლოდ ეკრანის ჩვენების პრობლემა."
          ),
          React.createElement("button", {
            onClick: () => window.location.reload(),
            className: "px-4 py-2.5 rounded-md text-sm font-semibold bg-[#16213E] text-white hover:bg-[#223057] flex items-center gap-2"
          },
            React.createElement(Icon, { name: "refresh", size: 15 }),
            " გვერდის განახლება"
          ),
          this.state.error && React.createElement("p", {
            className: "text-[10px] text-[#B3AF9C] qa-mono mt-2",
            style: { wordBreak: "break-all" }
          }, String(this.state.error.message || this.state.error))
        )
      );
    }
    return this.props.children;
  }
}

/* ================================================================== */
/*  RENDER APP                                                     */
/* ================================================================== */

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(
  React.createElement(AppErrorBoundary, null, React.createElement(QAAuditPlatform, null))
);
document.getElementById("boot-loader").remove();

} catch (err) {
  showBootError("JS შეცდომა: " + (err && err.stack ? err.stack : err));
}
</script>
</body>
