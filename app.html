const CryptoModule = {
  PBKDF2_ITERATIONS: 310000, 
  
  generateSalt() {
    return crypto.getRandomValues(new Uint8Array(16));
  },
  
  async deriveKey(password, salt, iterations = this.PBKDF2_ITERATIONS) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw',
      enc.encode(password),
      'PBKDF2',
      false,
      ['deriveBits', 'deriveKey']
    );
    
    return crypto.subtle.deriveKey(
      {
        name: 'PBKDF2',
        salt: salt,
        iterations: iterations,
        hash: 'SHA-256'
      },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false, 
      ['encrypt', 'decrypt']
    );
  },
  
  async hashPassword(password) {
    const salt = this.generateSalt();
    const iterations = this.PBKDF2_ITERATIONS;
    
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw',
      enc.encode(password),
      'PBKDF2',
      false,
      ['deriveBits']
    );
    
    const hashBuffer = await crypto.subtle.deriveBits(
      {
        name: 'PBKDF2',
        salt: salt,
        iterations: iterations,
        hash: 'SHA-256'
      },
      keyMaterial,
      256
    );
    
    return {
      hash: Array.from(new Uint8Array(hashBuffer)),
      salt: Array.from(salt),
      iterations
    };
  },
  
  async verifyPassword(password, storedHash, storedSalt, iterations) {
    const salt = new Uint8Array(storedSalt);
    
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw',
      enc.encode(password),
      'PBKDF2',
      false,
      ['deriveBits']
    );
    
    const hashBuffer = await crypto.subtle.deriveBits(
      {
        name: 'PBKDF2',
        salt: salt,
        iterations: iterations,
        hash: 'SHA-256'
      },
      keyMaterial,
      256
    );
    
    const hash = Array.from(new Uint8Array(hashBuffer));
    
    if (hash.length !== storedHash.length) return false;
    let diff = 0;
    for (let i = 0; i < hash.length; i++) {
      diff |= hash[i] ^ storedHash[i];
    }
    return diff === 0;
  },
  
  async encryptData(data, key) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const enc = new TextEncoder();
    const encoded = enc.encode(JSON.stringify(data));
    
    const encrypted = await crypto.subtle.encrypt(
      { name: 'AES-GCM', iv },
      key,
      encoded
    );
    
    return {
      encrypted: Array.from(new Uint8Array(encrypted)),
      iv: Array.from(iv)
    };
  },
  
  async decryptData(encryptedData, iv, key) {
    try {
      const decrypted = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: new Uint8Array(iv) },
        key,
        new Uint8Array(encryptedData)
      );
      
      const dec = new TextDecoder();
      return JSON.parse(dec.decode(decrypted));
    } catch (e) {
      throw new Error('დეშიფრაცია ვერ მოხერხდა პაროლი არასწორია ან მონაცემები დაზიანებულია.');
    }
  },
  
  // ============================================================
  // v2 KDF SCHEME domain-separated verification hash vs
  // encryption key (fixes v1 bug where both were byte-identical).
  // Two-stage derivation: PBKDF2(password) -> master bits,
  // then HKDF(master bits, info="verify"/"encrypt") -> two
  // cryptographically independent outputs.
  // Legacy v1 methods above are kept ONLY for transparently
  // migrating pre-existing accounts; new accounts always use v2.
  // ============================================================

  async deriveMasterBits(password, salt, iterations) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']
    );
    return crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
      keyMaterial,
      256
    );
  },

  async deriveSubkeysV2(masterBits) {
    const hkdfKey = await crypto.subtle.importKey('raw', masterBits, 'HKDF', false, ['deriveBits', 'deriveKey']);
    const verifyBits = await crypto.subtle.deriveBits(
      { name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(0), info: new TextEncoder().encode('qa-audit-verify-v1') },
      hkdfKey,
      256
    );
    const encryptionKey = await crypto.subtle.deriveKey(
      { name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(0), info: new TextEncoder().encode('qa-audit-encrypt-v1') },
      hkdfKey,
      { name: 'AES-GCM', length: 256 },
      false, 
      ['encrypt', 'decrypt']
    );
    return { verifyHash: Array.from(new Uint8Array(verifyBits)), encryptionKey };
  },


  async createCredentialsV2(password, iterations = this.PBKDF2_ITERATIONS) {
    const salt = this.generateSalt();
    const masterBits = await this.deriveMasterBits(password, salt, iterations);
    const { verifyHash, encryptionKey } = await this.deriveSubkeysV2(masterBits);
    return {
      hash: verifyHash,
      salt: Array.from(salt),
      iterations,
      scheme: 'v2',
      encryptionKey
    };
  },


  async verifyAndDeriveV2(password, storedHash, storedSalt, iterations) {
    const salt = new Uint8Array(storedSalt);
    const masterBits = await this.deriveMasterBits(password, salt, iterations);
    const { verifyHash, encryptionKey } = await this.deriveSubkeysV2(masterBits);

    if (verifyHash.length !== storedHash.length) return null;
    let diff = 0;
    for (let i = 0; i < verifyHash.length; i++) {
      diff |= verifyHash[i] ^ storedHash[i];
    }
    return diff === 0 ? encryptionKey : null;
  },

  checkPasswordStrength(password) {
    if (password.length < 8) return 0;
    
    let strength = 0;
    if (password.length >= 12) strength++;
    if (/[a-z]/.test(password)) strength++;
    if (/[A-Z]/.test(password)) strength++;
    if (/[0-9]/.test(password)) strength++;
    if (/[^a-zA-Z0-9]/.test(password)) strength++;
    
    if (strength <= 2) return 1;
    if (strength <= 3) return 2;
    return 3;
  }
};

const QA_IDB_NAME = "qa_audit_secure_v1";
const QA_IDB_VERSION = 1;

const SecureStorage = {
  db: null,
  
  async init() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(QA_IDB_NAME, QA_IDB_VERSION);
      
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        
        if (!db.objectStoreNames.contains('user')) {
          db.createObjectStore('user', { keyPath: 'id' });
        }
        if (!db.objectStoreNames.contains('encrypted_data')) {
          db.createObjectStore('encrypted_data', { keyPath: 'id' });
        }
      };
      
      req.onsuccess = () => {
        this.db = req.result;
        resolve(true);
      };
      
      req.onerror = () => reject(req.error);
    });
  },
  
  async getUser() {
    const tx = this.db.transaction('user', 'readonly');
    const store = tx.objectStore('user');
    
    return new Promise((resolve, reject) => {
      const req = store.get('main');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  
  async saveUser(userData) {
    const tx = this.db.transaction('user', 'readwrite');
    const store = tx.objectStore('user');
    
    return new Promise((resolve, reject) => {
      const req = store.put({ id: 'main', ...userData });
      req.onsuccess = () => resolve(true);
      req.onerror = () => reject(req.error);
    });
  },
  
  async getEncryptedData() {
    const tx = this.db.transaction('encrypted_data', 'readonly');
    const store = tx.objectStore('encrypted_data');
    
    return new Promise((resolve, reject) => {
      const req = store.get('main');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  
  async saveEncryptedData(encryptedPayload) {
    const tx = this.db.transaction('encrypted_data', 'readwrite');
    const store = tx.objectStore('encrypted_data');
    
    return new Promise((resolve, reject) => {
      const req = store.put({ id: 'main', ...encryptedPayload });
      req.onsuccess = () => resolve(true);
      req.onerror = () => reject(req.error);
    });
  },
  
  async saveUserAndData(userData, encryptedPayload) {
    const tx = this.db.transaction(['user', 'encrypted_data'], 'readwrite');

    return new Promise((resolve, reject) => {
      tx.objectStore('user').put({ id: 'main', ...userData });
      tx.objectStore('encrypted_data').put({ id: 'main', ...encryptedPayload });
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
    });
  },

  async deleteAllData() {
    const tx = this.db.transaction(['user', 'encrypted_data'], 'readwrite');
    
    return new Promise((resolve, reject) => {
      tx.objectStore('user').clear();
      tx.objectStore('encrypted_data').clear();
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }
};


const PersistentStorage = {

  async isSupported() {
    return !!(navigator.storage && navigator.storage.persist && navigator.storage.persisted);
  },

  isFileProtocol() {
    try { return window.location.protocol === 'file:'; } catch { return false; }
  },

  async check() {
    try {
      if (!(await this.isSupported())) return null;
      return await navigator.storage.persisted();
    } catch {
      return null;
    }
  },

  async request() {
    try {
      if (!(await this.isSupported())) return null;
      const already = await navigator.storage.persisted();
      if (already) return true;

      const timeout = new Promise(resolve => setTimeout(() => resolve('__timeout__'), 6000));
      const result = await Promise.race([navigator.storage.persist(), timeout]);
      if (result === '__timeout__') {
        console.warn('[persistent-storage] persist() did not settle within 6s treating as inconclusive');
        return null;
      }
      return result;
    } catch (err) {
      console.error('[persistent-storage] request() failed:', err);
      return null;
    }
  }
};

function labelOf(list, id) {
  if (!id) return "";
  if (!Array.isArray(list)) return String(id);
  const hit = list.find(x => x && x.id === id);
  return hit ? hit.label : String(id);
}

function findInList(list, idOrLabel) {
  if (!idOrLabel || !Array.isArray(list)) return null;
  return list.find(x => x && (x.id === idOrLabel || x.label === idOrLabel)) || null;
}

function ensureIdList(arr, knownMap) {
  knownMap = knownMap || {};
  if (!Array.isArray(arr)) return [];
  const out = [];
  const seenIds = new Set();
  const seenLabels = new Set();
  let defaultAssigned = false;

  arr.forEach(item => {
    let id, label, isDefault = false;
    if (typeof item === "string") {
      label = item.trim();
      if (!label) return;
      id = knownMap[label] || newRefId("ref");
    } else if (item && typeof item === "object") {
      label = String(item.label || item.name || "").trim();
      if (!label) return;
      id = item.id || knownMap[label] || newRefId("ref");
      isDefault = item.isDefault === true;
    } else {
      return;
    }
    // merge typo variants into known stable ids
    if (knownMap[label]) id = knownMap[label];
    if (seenIds.has(id) || seenLabels.has(label)) return;
    seenIds.add(id);
    seenLabels.add(label);
    // only one default per list
    if (isDefault && defaultAssigned) isDefault = false;
    if (isDefault) defaultAssigned = true;
    out.push({ id, label, isDefault: !!isDefault });
  });
  return out;
}

function getDefaultId(list) {
  if (!Array.isArray(list)) return "";
  const hit = list.find(x => x && x.isDefault);
  return hit ? hit.id : "";
}

/** Toggle default: click same id clears; otherwise only that id is default. */
function setDefaultInList(list, id) {
  if (!Array.isArray(list)) return [];
  const current = list.find(x => x && x.isDefault);
  const clearing = current && current.id === id;
  return list.map(x => ({
    ...x,
    isDefault: clearing ? false : x.id === id
  }));
}

function ensureEmployees(arr) {
  if (!Array.isArray(arr)) return [];
  return arr.map(e => {
    if (!e || typeof e !== "object") return null;
    const name = String(e.name || "").trim();
    if (!name) return null;
    return {
      id: e.id || newRefId("emp"),
      name,
      role: typeof e.role === "string" ? e.role : ""
    };
  }).filter(Boolean);
}

function resolveRefId(list, value, knownMap) {
  if (!value) return "";
  const found = findInList(list, value);
  if (found) return found.id;
  if (knownMap && knownMap[value]) return knownMap[value];
  return "";
}

function ensureRefOnList(list, label, knownMap) {
  if (!label) return { list, id: "" };
  const existing = findInList(list, label);
  if (existing) return { list, id: existing.id };
  const id = (knownMap && knownMap[label]) || newRefId("ref");
  return { list: [...list, { id, label }], id };
}

function migrateCase(c, ctx) {
  if (!c || typeof c !== "object") return null;

  let { statuses, categories, departments, helpTypes, delayReasons, auditResults, employees } = ctx;

  const pick = (list, idField, legacyField, knownMap) => {
    if (c[idField] && findInList(list, c[idField])) return { list, id: c[idField] };
    const legacy = c[legacyField] || c[idField] || "";
    if (!legacy) return { list, id: "" };
    const resolved = resolveRefId(list, legacy, knownMap);
    if (resolved) return { list, id: resolved };
    const added = ensureRefOnList(list, String(legacy), knownMap);
    return added;
  };

  let r;
  r = pick(statuses, "statusId", "status", KNOWN_STATUS_IDS);
  statuses = r.list; const statusId = r.id;

  r = pick(categories, "categoryId", "category", null);
  categories = r.list; const categoryId = r.id;

  r = pick(departments, "departmentId", "department", null);
  departments = r.list; const departmentId = r.id;

  r = pick(helpTypes, "helpTypeId", "helpType", null);
  helpTypes = r.list; const helpTypeId = r.id;

  r = pick(delayReasons, "delayReasonId", "delayReason", null);
  delayReasons = r.list; const delayReasonId = r.id;

  r = pick(auditResults, "auditResultId", "auditResult", KNOWN_AUDIT_IDS);
  auditResults = r.list; const auditResultId = r.id;

  let operatorId = c.operatorId || "";
  if (operatorId && !employees.find(e => e.id === operatorId)) operatorId = "";
  if (!operatorId && c.operator) {
    const emp = employees.find(e => e.name === c.operator);
    if (emp) operatorId = emp.id;
    else {
      const id = newRefId("emp");
      employees = [...employees, { id, name: String(c.operator), role: "" }];
      operatorId = id;
    }
  }

  ctx.statuses = statuses;
  ctx.categories = categories;
  ctx.departments = departments;
  ctx.helpTypes = helpTypes;
  ctx.delayReasons = delayReasons;
  ctx.auditResults = auditResults;
  ctx.employees = employees;

  return {
    ...c,
    statusId,
    categoryId,
    departmentId,
    helpTypeId,
    delayReasonId,
    auditResultId,
    operatorId,
    // keep legacy string fields in sync for any leftover readers / exports safety
    status: labelOf(statuses, statusId),
    category: labelOf(categories, categoryId),
    department: labelOf(departments, departmentId),
    helpType: labelOf(helpTypes, helpTypeId),
    delayReason: labelOf(delayReasons, delayReasonId),
    auditResult: labelOf(auditResults, auditResultId),
    operator: (employees.find(e => e.id === operatorId) || {}).name || ""
  };
}

function migrateIncident(inc, ctx) {
  if (!inc || typeof inc !== "object") return null;
  let { incidentTypes, employees } = ctx;

  let incidentTypeId = inc.incidentTypeId || "";
  if (incidentTypeId && !findInList(incidentTypes, incidentTypeId)) incidentTypeId = "";
  if (!incidentTypeId && inc.incidentType) {
    const found = findInList(incidentTypes, inc.incidentType);
    if (found) incidentTypeId = found.id;
    else {
      const id = newRefId("ref");
      incidentTypes = [...incidentTypes, { id, label: String(inc.incidentType) }];
      incidentTypeId = id;
    }
  }

  let employeeId = inc.employeeId || "";
  if (employeeId && !employees.find(e => e.id === employeeId)) employeeId = "";
  if (!employeeId && inc.employee) {
    const emp = employees.find(e => e.name === inc.employee);
    if (emp) employeeId = emp.id;
    else {
      const id = newRefId("emp");
      employees = [...employees, { id, name: String(inc.employee), role: "" }];
      employeeId = id;
    }
  }

  ctx.incidentTypes = incidentTypes;
  ctx.employees = employees;

  return {
    ...inc,
    incidentTypeId,
    employeeId,
    incidentType: labelOf(incidentTypes, incidentTypeId),
    employee: (employees.find(e => e.id === employeeId) || {}).name || ""
  };
}

function normalizeData(raw) {
  const safeArr = (v, fallback) => Array.isArray(v) ? v : fallback;
  const safeStr = (v) => typeof v === "string" ? v : "";

  const ctx = {
    categories: ensureIdList(safeArr(raw?.categories, [])),
    departments: ensureIdList(safeArr(raw?.departments, [])),
    helpTypes: ensureIdList(safeArr(raw?.helpTypes, [])),
    delayReasons: ensureIdList(safeArr(raw?.delayReasons, [])),
    statuses: ensureIdList(safeArr(raw?.statuses, []), KNOWN_STATUS_IDS),
    auditResults: ensureIdList(safeArr(raw?.auditResults, []), KNOWN_AUDIT_IDS),
    incidentTypes: ensureIdList(safeArr(raw?.incidentTypes, [])),
    employees: ensureEmployees(safeArr(raw?.employees, []))
  };

  const cases = safeArr(raw?.cases, []).map(c => migrateCase(c, ctx)).filter(Boolean);
  const incidents = safeArr(raw?.incidents, []).map(i => migrateIncident(i, ctx)).filter(Boolean);

  return {
    categories: ctx.categories,
    departments: ctx.departments,
    helpTypes: ctx.helpTypes,
    delayReasons: ctx.delayReasons,
    statuses: ctx.statuses,
    auditResults: ctx.auditResults,
    incidentTypes: ctx.incidentTypes,
    employees: ctx.employees,
    cases,
    incidents,
    responsibleName: safeStr(raw?.responsibleName),
    responsiblePosition: safeStr(raw?.responsiblePosition)
  };
}

/** Re-sync denormalized label fields from current lists (call after rename). */
function resyncLabels(data) {
  const cases = (data.cases || []).map(c => ({
    ...c,
    status: labelOf(data.statuses, c.statusId),
    category: labelOf(data.categories, c.categoryId),
    department: labelOf(data.departments, c.departmentId),
    helpType: labelOf(data.helpTypes, c.helpTypeId),
    delayReason: labelOf(data.delayReasons, c.delayReasonId),
    auditResult: labelOf(data.auditResults, c.auditResultId),
    operator: (data.employees.find(e => e.id === c.operatorId) || {}).name || ""
  }));
  const incidents = (data.incidents || []).map(i => ({
    ...i,
    incidentType: labelOf(data.incidentTypes, i.incidentTypeId),
    employee: (data.employees.find(e => e.id === i.employeeId) || {}).name || ""
  }));
  return { ...data, cases, incidents };
}

function isStatusClosed(c) {
  return c.statusId === "st_closed" || c.status === "დახურულია" || c.status === "დახურული";
}

function statusColorFor(nameOrId) {
  if (nameOrId && STATUS_COLOR[nameOrId]) return STATUS_COLOR[nameOrId];
  const id = KNOWN_STATUS_IDS[nameOrId];
  if (id && STATUS_COLOR[id]) return STATUS_COLOR[id];
  return { fg: "#555", bg: "#eee", ring: "#999" };
}

function auditColorFor(nameOrId) {
  if (nameOrId && AUDIT_RESULT_COLOR[nameOrId]) return AUDIT_RESULT_COLOR[nameOrId];
  const id = KNOWN_AUDIT_IDS[nameOrId];
  if (id && AUDIT_RESULT_COLOR[id]) return AUDIT_RESULT_COLOR[id];
  return { fg: "#555", bg: "#eee", ring: "#999" };
}

function tallyById(list, idKey, labelList, emptyLabel) {
  const map = {};
  const labelMap = {};
  list.forEach(item => {
    const id = item[idKey] || "";
    const label = id
      ? (labelOf(labelList, id) || id)
      : (emptyLabel || "—");
    const key = id || "__empty__";
    map[key] = (map[key] || 0) + 1;
    labelMap[key] = label;
  });
  return Object.keys(map)
    .map(k => [labelMap[k], map[k]])
    .sort((a, b) => b[1] - a[1]);
}

function chartDrawDonut(rows, canvasW, canvasH, titleText, palette) {
  palette = palette || TALLY_PALETTE;
  const canvas = document.createElement("canvas");
  canvas.width = canvasW;
  canvas.height = canvasH;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvasW, canvasH);
  ctx.font = "bold 15px sans-serif";
  ctx.fillStyle = "#16213E";
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  ctx.fillText(titleText, 4, 4);
  const topPad = 34;
  const sum = rows.reduce((s, [, v]) => s + v, 0) || 1;
  const donutSize = Math.min(canvasH - topPad - 12, 160);
  const cx = donutSize / 2 + 16, cy = topPad + (canvasH - topPad) / 2, r = donutSize / 2 - 4;
  let start = -Math.PI / 2;
  rows.forEach(([, value], i) => {
    const angle = value / sum * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, start + angle);
    ctx.closePath();
    ctx.fillStyle = palette[i % palette.length];
    ctx.fill();
    start += angle;
  });
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.55, 0, Math.PI * 2);
  ctx.fillStyle = "#ffffff";
  ctx.fill();
  ctx.fillStyle = "#16213E";
  ctx.font = "bold 20px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(String(sum), cx, cy - 8);
  ctx.font = "10px sans-serif";
  ctx.fillStyle = "#8A8672";
  ctx.fillText("სულ", cx, cy + 12);
  const lx = donutSize + 40;
  const availW = canvasW - lx - 60;
  const lineH = Math.min(30, (canvasH - topPad - 8) / Math.max(rows.length, 1));
  rows.forEach(([label, value], i) => {
    const ly = topPad + i * lineH + lineH / 2;
    ctx.fillStyle = palette[i % palette.length];
    ctx.fillRect(lx, ly - 7, 14, 14);
    ctx.font = "13px sans-serif";
    let display = label;
    while (ctx.measureText(display).width > availW && display.length > 4) {
      display = display.slice(0, -2);
    }
    if (display !== label) display = display.replace(/\s+$/, "") + "…";
    ctx.fillStyle = "#3A3A32";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText(display, lx + 22, ly);
    ctx.fillStyle = "#16213E";
    ctx.font = "bold 13px sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(String(value), canvasW - 10, ly);
  });
  return canvas.toDataURL("image/png");
}

function chartDrawBar(rows, width, height, titleText, palette) {
  palette = palette || TALLY_PALETTE;
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, width, height);
  ctx.font = "bold 15px sans-serif";
  ctx.fillStyle = "#16213E";
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  ctx.fillText(titleText, 4, 4);
  const topPad = 34;
  const max = Math.max(...rows.map(([, v]) => v), 1);
  ctx.font = "13px sans-serif";
  let widest = 0;
  rows.forEach(([label]) => {
    const w = ctx.measureText(label).width;
    if (w > widest) widest = w;
  });
  const leftPad = Math.min(Math.max(widest + 26, 120), width * 0.42);
  const rightPad = 50;
  const n = Math.max(rows.length, 1);
  const barH = Math.min(26, Math.floor((height - topPad - 10) / n) - 8);
  rows.forEach(([label, value], i) => {
    const y = topPad + i * (barH + 8);
    let display = label;
    let font = "13px sans-serif";
    ctx.font = font;
    if (ctx.measureText(display).width > leftPad - 14) {
      font = "11px sans-serif";
      ctx.font = font;
    }
    ctx.fillStyle = "#3A3A32";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillText(display, leftPad - 10, y + barH / 2);
    const barW = (width - leftPad - rightPad) * value / max;
    ctx.fillStyle = palette[i % palette.length];
    ctx.fillRect(leftPad, y, Math.max(barW, 2), barH);
    ctx.fillStyle = "#16213E";
    ctx.font = "bold 13px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(String(value), leftPad + barW + 8, y + barH / 2);
  });
  return canvas.toDataURL("image/png");
}

const EXCEL_COLORS = {
  NAVY: "FF16213E", GREEN: "FF1F6F50", RED: "FFC0392B", GOLD: "FFB8860B",
  PAPER: "FFFBF9F3", WHITE: "FFFFFFFF", BORDERC: "FFDBD7C8", MUTED: "FF8A8672"
};


function excelColLetter(n) {
  let s = "";
  while (n > 0) {
    const m = (n - 1) % 26;
    s = String.fromCharCode(65 + m) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}


function paintExcelBanner(sheet, navyArgb, dataColCount) {
  const cols = Math.max(dataColCount || 10, 2);
  for (let r = 1; r <= 3; r++) {
    for (let c = 1; c <= cols; c++) {
      sheet.getCell(r, c).fill = {
        type: "pattern",
        pattern: "solid",
        fgColor: { argb: navyArgb }
      };
    }
  }
  sheet.getRow(1).height = 10;
  sheet.getRow(2).height = 30;
  sheet.getRow(3).height = 24;
  return excelColLetter(Math.max(cols - 1, 2));
}

function applyExcelPrintSetup(sheet, {
  lastColLetter,
  lastRow,
  titleRows = "1:5",
  orientation = "landscape"
}) {
  sheet.pageSetup = {
    orientation,
    fitToPage: true,
    fitToWidth: 1,
    fitToHeight: 0,
    paperSize: 9, 
    horizontalCentered: true,
    margins: {
      left: 0.35,
      right: 0.35,
      top: 0.4,
      bottom: 0.4,
      header: 0,
      footer: 0.2
    },
    printArea: `A1:${lastColLetter}${Math.max(lastRow, 5)}`,
    printTitlesRow: titleRows
  };
}

const uid = () => Math.random().toString(36).slice(2, 10);

function isoWeek(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + "T00:00:00");
  if (isNaN(d)) return null;
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + 4 - (d.getDay() || 7));
  const yearStart = new Date(d.getFullYear(), 0, 1);
  return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
}

function monthOf(dateStr) {
  if (!dateStr) return null;
  return Number(dateStr.slice(5, 7));
}

function quarterOf(dateStr) {
  const m = monthOf(dateStr);
  return m ? Math.ceil(m / 3) : null;
}

function yearOf(dateStr) {
  if (!dateStr) return null;
  return Number(dateStr.slice(0, 4));
}

function formatDate(dateStr) {
  if (!dateStr) return "—";
  const [y, m, d] = dateStr.split("-");
  return `${d}.${m}.${y}`;
}

function formatDateTime(iso) {
  if (!iso) return "—";
  try {
    const d = new Date(iso);
    return d.toLocaleString("ka-GE", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
  } catch {
    return "—";
  }
}

const BACKUP_REMINDER_DAYS = 7;

function daysSince(iso) {
  if (!iso) return null;
  const diffMs = Date.now() - new Date(iso).getTime();
  return Math.floor(diffMs / (1000 * 60 * 60 * 24));
}

function isBackupStale(lastBackupAt) {
  const d = daysSince(lastBackupAt);
  return d === null || d >= BACKUP_REMINDER_DAYS;
}

/* ================================================================== */
/*   SHARED DOCUMENT HEADER (used by every PDF & Excel export)      */
/*  Formats the generation date/time as DD/MM/YYYY + HH:MM, and       */
/*  resolves the responsible-person text from Settings, with a        */
/*  clear fallback when it hasn't been filled in.                     */
/* ================================================================== */

function pad2(n) { return String(n).padStart(2, "0"); }

function formatDocDate(d) {
  d = d || new Date();
  return `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()}`;
}

function formatDocTime(d) {
  d = d || new Date();
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

function getResponsiblePersonLines(data) {
  const name = (data?.responsibleName || "").trim();
  const position = (data?.responsiblePosition || "").trim();
  if (!name) {
    return { primary: "პასუხისმგებელი პირი მითითებული არ არის", secondary: "" };
  }
  return { primary: name, secondary: position };
}

function tally(list, key) {
  const map = {};
  list.forEach(item => {
    const v = item[key] || "შეფერხების გარეშე ✓";
    map[v] = (map[v] || 0) + 1;
  });
  return Object.entries(map).sort((a, b) => b[1] - a[1]);
}

function applyFilters(cases, f) {
  return cases.filter(c => {
    const d = c.incidentDate;
    if (f.date && d !== f.date) return false;
    if (f.week && String(isoWeek(d)) !== String(f.week)) return false;
    if (f.month && String(monthOf(d)) !== String(f.month)) return false;
    if (f.quarter && String(quarterOf(d)) !== String(f.quarter)) return false;
    if (f.year && String(yearOf(d)) !== String(f.year)) return false;
    return true;
  });
}

/*  CHANGE PASSWORD MODAL                                          */
/*  Safe flow: re-verify current password against storage (independent */
/*  of the already-unlocked session) -> fresh salt + v2 credentials ->  */
/*  re-encrypt the in-memory data with the new key -> atomic dual-store */
/*  write -> only then hand the new key back to the caller. Any        */
/*  failure aborts before anything is written, so there is no path     */
/*  that can leave the account half-changed or the data unreadable.    */
/* ================================================================== */

function ChangePasswordModal({ getLatestData, onPrepare, onSuccess, onClose }) {
  const [currentPassword, setCurrentPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [showPw, setShowPw] = useState(false);
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const strength = CryptoModule.checkPasswordStrength(newPassword);
  const strengthLabel = ["", "სუსტი", "საშუალო", "ძლიერი"][strength];
  const strengthClass = ["", "pwd-weak", "pwd-medium", "pwd-strong"][strength];

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError("");

    if (!currentPassword) {
      setError("შეიყვანეთ მიმდინარე პაროლი");
      return;
    }
    if (newPassword.length < 8) {
      setError("ახალი პაროლი უნდა იყოს მინიმუმ 8 სიმბოლო");
      return;
    }
    if (newPassword !== confirmPassword) {
      setError("ახალი პაროლები არ ემთხვევა");
      return;
    }
    if (strength < 2) {
      setError("ახალი პაროლი ძალიან სუსტია. გამოიყენეთ დიდი/პატარა ასოები და ციფრები.");
      return;
    }
    if (newPassword === currentPassword) {
      setError("ახალი პაროლი არ უნდა ემთხვეოდეს მიმდინარეს");
      return;
    }

    setLoading(true);

    try {

      if (typeof onPrepare === "function") {
        await onPrepare();
      }

      const user = await SecureStorage.getUser();
      if (!user) {
        setError("მომხმარებელი ვერ მოიძებნა");
        setLoading(false);
        return;
      }

      let currentValid = false;
      if (user.scheme === 'v2') {
        const key = await CryptoModule.verifyAndDeriveV2(currentPassword, user.passwordHash, user.salt, user.iterations);
        currentValid = !!key;
      } else {
        currentValid = await CryptoModule.verifyPassword(currentPassword, user.passwordHash, user.salt, user.iterations);
      }

      if (!currentValid) {
        setError(" მიმდინარე პაროლი არასწორია");
        setLoading(false);
        return;
      }

      const { hash, salt, iterations, scheme, encryptionKey: newKey } = await CryptoModule.createCredentialsV2(newPassword);

      const latestData = typeof getLatestData === "function" ? getLatestData() : null;
      if (!latestData) {
        setError("მონაცემები ვერ მოიძებნა სცადეთ თავიდან");
        setLoading(false);
        return;
      }
      const newEncryptedPayload = await CryptoModule.encryptData(latestData, newKey);

      await SecureStorage.saveUserAndData(
        {
          ...user,
          passwordHash: hash,
          salt: salt,
          iterations: iterations,
          scheme: scheme
        },
        newEncryptedPayload
      );

      await onSuccess(newKey);
      setLoading(false);
    } catch (err) {
      setError("პაროლის შეცვლა ვერ მოხერხდა: " + (err.message || err));
      setLoading(false);
    }
  };

  return React.createElement(Modal, { title: "პაროლის შეცვლა", onClose: onClose },
    React.createElement("form", { onSubmit: handleSubmit, className: "flex flex-col gap-4" },
      React.createElement("div", {
        className: "bg-[#E6EBF4] border border-[#C4CCE0] rounded-md px-3 py-2 text-xs text-[#2A4270] flex gap-2"
      },
        React.createElement(Icon, { name: "info", size: 14, className: "shrink-0 mt-0.5" }),
        React.createElement("span", null, "თქვენი მონაცემები ავტომატურად გადაიშიფრება ახალი პაროლით.")
      ),

      React.createElement(Field, { label: "მიმდინარე პაროლი" },
        React.createElement("input", {
          type: showPw ? "text" : "password",
          className: inputCls,
          value: currentPassword,
          autoFocus: true,
          onChange: e => { setError(""); setCurrentPassword(e.target.value); }
        })
      ),

      React.createElement(Field, {
        label: "ახალი პაროლი",
        hint: "მინიმუმ 8 სიმბოლო, სასურველია დიდი/პატარა ასოები და ციფრები"
      },
        React.createElement("input", {
          type: showPw ? "text" : "password",
          className: inputCls,
          value: newPassword,
          onChange: e => { setError(""); setNewPassword(e.target.value); }
        }),
        newPassword && React.createElement("div", { className: "mt-2" },
          React.createElement("div", { className: "flex justify-between text-xs mb-1" },
            React.createElement("span", { className: "text-[#9A967F]" }, "პაროლის სიძლიერე:"),
            React.createElement("span", {
              className: strength === 3 ? "text-[#1F6F50]" : strength === 2 ? "text-[#B8860B]" : "text-[#C0392B]",
              style: { fontWeight: 600 }

      ),

      },

        React.createElement("span", null, error)
      ),

      React.createElement("div", { className: "flex justify-end gap-2 mt-2" },
        React.createElement("button", {

function RegistrationPage({ onRegister }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [showPw, setShowPw] = useState(false);
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  
  const strength = CryptoModule.checkPasswordStrength(password);
  const strengthLabel = ["", "სუსტი", "საშუალო", "ძლიერი"][strength];
  const strengthClass = ["", "pwd-weak", "pwd-medium", "pwd-strong"][strength];
  
  const handleSubmit = async (e) => {
    e.preventDefault();
    setError("");
    
    const emailRegex = /^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/;
    if (!emailRegex.test(email.trim())) {
      setError("გთხოვთ შეიყვანოთ სწორი ელფოსტა (წერტილის შემდეგ მინიმუმ 2 სიმბოლო)");
      return;
    }
    
    if (password.length < 8) {
      setError("პაროლი უნდა იყოს მინიმუმ 8 სიმბოლო");
      return;
    }
    
    if (password !== confirmPassword) {
      setError("პაროლები არ ემთხვევა");
      return;
    }
    
    if (strength < 2) {
      setError("პაროლი ძალიან სუსტია. გამოიყენეთ დიდი/პატარა ასოები და ციფრები.");
      return;
    }
    
    setLoading(true);
    
    try {
      const { hash, salt, iterations, scheme, encryptionKey } = await CryptoModule.createCredentialsV2(password);
      const encryptedPayload = await CryptoModule.encryptData(SEED_DATA, encryptionKey);

      await SecureStorage.saveUserAndData(
        {
          email: email.toLowerCase().trim(),
          passwordHash: hash,
          salt: salt,
          iterations: iterations,
          scheme: scheme,
          createdAt: new Date().toISOString(),
          lastBackupAt: null
        },
        encryptedPayload
      );

      onRegister(encryptionKey, SEED_DATA, email);
      
    } catch (err) {
      setError("რეგისტრაცია ვერ მოხერხდა: " + err.message);
      setLoading(false);
    }

      ),
      
      React.createElement("div", { className: "bg-[#FBF6E7] border border-[#EADFB8] rounded-lg p-3 text-xs text-[#8C6B21]" },
        React.createElement("div", { className: "flex gap-2" },

          React.createElement("div", null,
            React.createElement("p", { className: "font-semibold mb-1" }, "⚠️ მნიშვნელოვანი გაფრთხილება"),
            React.createElement("p", null, "პაროლის დაკარგვის შემთხვევაში ყველა მონაცემი შეუქცევადად წაიშლება! პაროლი შეინახეთ უსაფრთხო ადგილას.")

function LoginPage({ userEmail, onLogin, onReset }) {
  const [password, setPassword] = useState("");
  const [showPw, setShowPw] = useState(false);
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  
  const emailTag = useMemo(() => {
    let h = 5381;
    const s = String(userEmail || "");
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  }, [userEmail]);
  const LOCKOUT_KEY = `qa_lockout_${emailTag}`;
  const ATTEMPTS_KEY = `qa_attempts_${emailTag}`;
  
  const [loginAttempts, setLoginAttempts] = useState(() => {
    try {
      return parseInt(localStorage.getItem(ATTEMPTS_KEY) || "0", 10);
    } catch {
      return 0;
    }
  });
  
  const [lockedUntil, setLockedUntil] = useState(() => {
    try {
      const stored = localStorage.getItem(LOCKOUT_KEY);
      if (stored) {
        const timestamp = parseInt(stored, 10);
        if (timestamp > Date.now()) {
          return timestamp;
        } else {
          localStorage.removeItem(LOCKOUT_KEY);
          localStorage.removeItem(ATTEMPTS_KEY);
          return null;
        }
      }
    } catch {
      return null;
    }
    return null;
  });
  
  const [remainingSeconds, setRemainingSeconds] = useState(0);
  
  useEffect(() => {
    if (lockedUntil) {
      const interval = setInterval(() => {
        const remaining = Math.ceil((lockedUntil - Date.now()) / 1000);
        
        if (remaining <= 0) {
          setLockedUntil(null);
          setLoginAttempts(0);
          setRemainingSeconds(0);
          setError("");
          
          localStorage.removeItem(LOCKOUT_KEY);
          localStorage.removeItem(ATTEMPTS_KEY);
        } else {
          setRemainingSeconds(remaining);
        }
      }, 1000);
      
      return () => clearInterval(interval);
    }
  }, [lockedUntil, LOCKOUT_KEY, ATTEMPTS_KEY]);
  
  const handleSubmit = async (e) => {
    e.preventDefault();
    e.stopPropagation();
    setError("");
    
    if (lockedUntil && Date.now() < lockedUntil) {
      const mins = Math.floor(remainingSeconds / 60);
      const secs = remainingSeconds % 60;
      setError(`🔒 ბლოკირებულია უსაფრთხოების გამო. დარჩენილია: ${mins}:${String(secs).padStart(2, '0')}`);
      return;
    }
    
    setLoading(true);
    
    try {
      const user = await SecureStorage.getUser();
      if (!user) {
        setError("მომხმარებელი ვერ მოიძებნა");
        setLoading(false);
        return;
      }

      const encrypted = await SecureStorage.getEncryptedData();
      if (!encrypted) {
        setError("დაშიფრული მონაცემები ვერ მოიძებნა");
        setLoading(false);
        return;
      }

      let encryptionKey = null;
      if (user.scheme === 'v2') {
        encryptionKey = await CryptoModule.verifyAndDeriveV2(password, user.passwordHash, user.salt, user.iterations);
      } else {
        const isValidLegacy = await CryptoModule.verifyPassword(password, user.passwordHash, user.salt, user.iterations);
        if (isValidLegacy) {
          encryptionKey = await CryptoModule.deriveKey(password, new Uint8Array(user.salt), user.iterations);
        }
      }

      if (!encryptionKey) {
        const newAttempts = loginAttempts + 1;
        setLoginAttempts(newAttempts);
        

        localStorage.setItem(ATTEMPTS_KEY, String(newAttempts));
        
        if (newAttempts >= 5) {
          const lockoutTime = 5 * 60 * 1000; // 5 წუთი
          const lockUntil = Date.now() + lockoutTime;
          
          setLockedUntil(lockUntil);
          setRemainingSeconds(300);
          
          localStorage.setItem(LOCKOUT_KEY, String(lockUntil));
          
          setError(`⚠️ 5 წარუმატებელი მცდელობა. ბლოკირებულია 5:00 წუთით.`);
        } else {
          setError(` პაროლი არასწორია (${newAttempts}/5 მცდელობა)`);
        }
        setLoading(false);
        return;
      }
      
      setLoginAttempts(0);
      setLockedUntil(null);
      setRemainingSeconds(0);
      localStorage.removeItem(LOCKOUT_KEY);
      localStorage.removeItem(ATTEMPTS_KEY);

      const decryptedData = await CryptoModule.decryptData(
        encrypted.encrypted,
        encrypted.iv,
        encryptionKey
      );

      if (user.scheme !== 'v2') {
        try {
          const migrated = await CryptoModule.createCredentialsV2(password);
          const newEncryptedPayload = await CryptoModule.encryptData(decryptedData, migrated.encryptionKey);
          await SecureStorage.saveUserAndData(
            {
              ...user,
              passwordHash: migrated.hash,
              salt: migrated.salt,
              iterations: migrated.iterations,
              scheme: migrated.scheme
            },
            newEncryptedPayload
          );
          encryptionKey = migrated.encryptionKey;
          console.log('[security] Account migrated to v2 credential scheme');
        } catch (migrationErr) {
          console.warn('[security] v2 migration skipped, will retry next login:', migrationErr);
        }
      }

      onLogin(encryptionKey, normalizeData(decryptedData), user.email);
      
    } catch (err) {
      setError(err.message || "შესვლა ვერ მოხერხდა");
      setLoading(false);
    }
  };
  
  return React.createElement("div", { className: "qa-root min-h-screen flex items-center justify-center bg-[#F3F1E7] p-6" },
    React.createElement(FontStyles, null),
    React.createElement("form", {
      onSubmit: handleSubmit,
      noValidate: true,
      className: "qa-fade-up w-full max-w-sm bg-white rounded-xl border border-[#E4E1D6] shadow-xl p-8 flex flex-col gap-5"
    },
      React.createElement("div", { className: "flex flex-col items-center gap-2 mb-1" },
        React.createElement("div", { className: "w-12 h-12 rounded-lg bg-[#16213E] flex items-center justify-center" },
          React.createElement(Icon, { name: "approval", size: 22, className: "text-[#B8860B]" })
        ),
        React.createElement("h1", { className: "qa-serif text-xl font-bold text-[#16213E]" }, "QA აუდიტის პლათფორმა"),
        React.createElement("p", { className: "text-xs text-[#9A967F]" }, "გთხოვთ, შეხვიდეთ სისტემაში")
      ),
      
      React.createElement(Field, { label: "ელფოსტა" },
        React.createElement("input", {
          type: "email",
          disabled: true,
          className: inputCls + " opacity-60",
          value: userEmail,
          readOnly: true
        })
      ),
      
      React.createElement(Field, { label: "პაროლი" },
        React.createElement("div", { className: "relative" },
          React.createElement("input", {
            type: showPw ? "text" : "password",
            required: true,
            autoFocus: true,
            disabled: lockedUntil && Date.now() < lockedUntil,
            className: inputCls + " pr-9",
            value: password,
            onChange: e => { setError(""); setPassword(e.target.value); }
          }),
          React.createElement("button", {
            type: "button",
            onClick: () => setShowPw(!showPw),
            className: "absolute right-2 top-1/2 -translate-y-1/2 text-[#9A967F] hover:text-[#16213E]",
            tabIndex: -1
          }, showPw
            ? React.createElement(Icon, { name: "visibility_off", size: 15 })
            : React.createElement(Icon, { name: "visibility", size: 15 })
          )
        )
      ),
      
      lockedUntil && remainingSeconds > 0 && React.createElement("div", {
        className: "bg-[#F6E4E1] border border-[#F0999B] rounded-md px-4 py-3 text-center"
      },
        React.createElement("div", { className: "text-3xl font-bold text-[#C0392B] qa-mono mb-1" },
          `${Math.floor(remainingSeconds / 60)}:${String(remainingSeconds % 60).padStart(2, '0')}`
        ),
        React.createElement("p", { className: "text-xs text-[#C0392B]" }, "ბლოკირებულია უსაფრთხოების მიზეზით"),
      ),
      
      error && React.createElement("div", {
        className: "bg-[#F6E4E1] border border-[#F0999B] rounded-md px-3 py-2 text-xs text-[#C0392B] flex gap-2"
      },
        React.createElement(Icon, { name: "error", size: 14, className: "shrink-0" }),
        React.createElement("span", null, error)
      ),
      
      React.createElement("button", {
        type: "submit",
        disabled: loading || (lockedUntil && Date.now() < lockedUntil),
        className: "mt-1 px-4 py-2.5 rounded-md text-sm font-semibold bg-[#16213E] text-white hover:bg-[#223057] disabled:opacity-40 flex items-center justify-center gap-2"
      },
        loading && React.createElement(Icon, { name: "progress_activity", size: 14, className: "animate-pulse" }),
        loading ? "შემოწმება..." : "შესვლა"
      ),
      
    )
  );
}

function CasesTable({ cases, onEdit, onDelete, compact, selectedIds, onToggleSelect, onToggleSelectAll, onPageChange, onBulkDelete }) {
  const [expanded, setExpanded] = useState(null);
  const [currentPage, setCurrentPage] = useState(0);
  const ITEMS_PER_PAGE = 100;
  const selectable = typeof onToggleSelect === "function";
  const selectedSet = useMemo(() => new Set(selectedIds || []), [selectedIds]);
  
  const totalPages = Math.ceil(cases.length / ITEMS_PER_PAGE);
  const paginatedCases = useMemo(() => {
    const start = currentPage * ITEMS_PER_PAGE;
    return cases.slice(start, start + ITEMS_PER_PAGE);
  }, [cases, currentPage]);

  const pageIds = useMemo(() => paginatedCases.map(c => c.id), [paginatedCases]);
  const allPageSelected = pageIds.length > 0 && pageIds.every(id => selectedSet.has(id));
  const somePageSelected = pageIds.some(id => selectedSet.has(id));
  
  useEffect(() => {
    setCurrentPage(0);
  }, [cases.length]);

  useEffect(() => {
    if (typeof onPageChange === "function") onPageChange(currentPage);
  }, [currentPage]);
  
  if (cases.length === 0) {
    return React.createElement("div", { className: "text-center py-14 text-[#9A967F]" },
      React.createElement(Icon, { name: "assignment", className: "mx-auto mb-2 opacity-40", size: 30 }),
      React.createElement("p", { className: "text-sm italic" }, "ჩანაწერები არ მოიძებნა")
    );

/* ================================================================== */
/*  CASES PAGE (with Excel Export)                                */
/* ================================================================== */

function CasesPage({ data, saveData }) {
  const [query, setQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("");
  const [categoryFilter, setCategoryFilter] = useState("");
  const [resultFilter, setResultFilter] = useState("");
  const [timeFilters, setTimeFilters] = useState({
    date: "",
    week: "",
    month: "",
    quarter: "",
    year: ""
  });
  const [editing, setEditing] = useState(null);
  const [adding, setAdding] = useState(false);
  const [toDelete, setToDelete] = useState(null);
  const [selectedIds, setSelectedIds] = useState([]);
  const [bulkDeletePending, setBulkDeletePending] = useState(false);
  
  const years = useMemo(() => {
    const s = new Set(data.cases.map(c => yearOf(c.incidentDate)).filter(Boolean));
    
    if (s.size === 0) {
      s.add(new Date().getFullYear());
    }

    return Array.from(s).sort((a, b) => b - a);
  }, [data.cases]);
  
  const searchIndex = useMemo(() => {
    return data.cases.map(c => ({
      id: c.id,
      searchable: [
        c.jira,
        c.operator,
        c.category,
        c.problem,
        c.recommendation,
        c.department,
        c.delayReason
      ].filter(Boolean).join(' ').toLowerCase()
    }));
  }, [data.cases]);

  useEffect(() => {
    setSelectedIds([]);
  }, [query, statusFilter, categoryFilter, resultFilter, timeFilters.date, timeFilters.week, timeFilters.month, timeFilters.quarter, timeFilters.year]);
  
  const filtered = useMemo(() => {
    let result = applyFilters(data.cases, timeFilters);
    
    if (statusFilter) {
      result = result.filter(c => c.statusId === statusFilter || c.status === statusFilter);
    }

    if (categoryFilter) {
      result = result.filter(c => c.categoryId === categoryFilter || c.category === categoryFilter);
    }

    if (resultFilter) {
      result = result.filter(c => c.auditResultId === resultFilter || c.auditResult === resultFilter);
    }

    if (query) {
      const q = query.toLowerCase();
      const matchingIds = new Set(
        searchIndex
          .filter(item => item.searchable.includes(q))
          .map(item => item.id)
      );
      result = result.filter(c => matchingIds.has(c.id));
    }
    
    return result.slice().reverse();
  }, [data.cases, query, statusFilter, categoryFilter, resultFilter, timeFilters, searchIndex]);
  
  const filtersActive = Boolean(
    statusFilter || categoryFilter || resultFilter ||
    timeFilters.date || timeFilters.week || timeFilters.month ||
    timeFilters.quarter || timeFilters.year
  );
  
  const saveCase = form => {
    let cases;
    if (editing) {
      cases = data.cases.map(c => c.id === editing.id ? { ...editing, ...form } : c);
    } else {
      const no = (data.cases.reduce((m, c) => Math.max(m, c.no || 0), 0) || 0) + 1;
      cases = [...data.cases, { id: uid(), no, ...form }];
    }
    saveData({ ...data, cases });
    setEditing(null);
    setAdding(false);
  };
  
  const deleteCase = () => {
    saveData({ ...data, cases: data.cases.filter(c => c.id !== toDelete.id) });
    setToDelete(null);
    setSelectedIds(ids => ids.filter(id => id !== toDelete.id));
  };

  const toggleSelect = (id) => {
    setSelectedIds(ids => ids.includes(id) ? ids.filter(x => x !== id) : [...ids, id]);
  };

  const toggleSelectAll = (pageIds, select) => {
    if (select) {
      setSelectedIds(prev => [...new Set([...prev, ...pageIds])]);
    } else {
      const pageSet = new Set(pageIds);
      setSelectedIds(prev => prev.filter(id => !pageSet.has(id)));
    }
  };

  const confirmBulkDelete = () => {
    const idSet = new Set(selectedIds);
    saveData({ ...data, cases: data.cases.filter(c => !idSet.has(c.id)) });
    setSelectedIds([]);
    setBulkDeletePending(false);
  };
  
  const exportExcel = async (filteredCases) => {
    const all = [...filteredCases].sort((a, b) => (a.no || 0) - (b.no || 0));
    const total = all.length;
    const closed = all.filter(c => isStatusClosed(c)).length;
    const open = total - closed;
    const auditRows = tally(all, "auditResult");
    const catRows = tally(all, "category");
    const statusRows = tally(all, "status");
    const helpRows = tally(all, "helpType");
    const delayRows = tally(all, "delayReason");
    
    const NAVY = "FF16213E", GREEN = "FF1F6F50", RED = "FFC0392B";
    const PAPER = "FFFBF9F3", WHITE = "FFFFFFFF", BORDERC = "FFDBD7C8", MUTED = "FF8A8672";
    const PIE_COLORS = ["#16213E", "#B8860B", "#C0392B", "#2A4270", "#1F6F50", "#6B7A99", "#8C6B21"];

    function drawDonutLegend(rows, canvasW, canvasH, titleText) {
        const canvas = document.createElement("canvas");
        canvas.width = canvasW;
        canvas.height = canvasH;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvasW, canvasH);
        ctx.font = "bold 15px sans-serif";
        ctx.fillStyle = "#16213E";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText(titleText, 4, 4);
        const topPad = 34;
        const sum = rows.reduce((s, [, v]) => s + v, 0) || 1;
        const donutSize = Math.min(canvasH - topPad - 12, 160);
        const cx = donutSize / 2 + 16, cy = topPad + (canvasH - topPad) / 2, r = donutSize / 2 - 4;
        let start = -Math.PI / 2;
        rows.forEach(([, value], i) => {
            const angle = value / sum * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, start, start + angle);
            ctx.closePath();
            ctx.fillStyle = PIE_COLORS[i % PIE_COLORS.length];
            ctx.fill();
            start += angle;
        });
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.55, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.fillStyle = "#16213E";
        ctx.font = "bold 20px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(String(sum), cx, cy - 8);
        ctx.font = "10px sans-serif";
        ctx.fillStyle = "#8A8672";
        ctx.fillText("სულ", cx, cy + 12);
        const lx = donutSize + 40;
        const availW = canvasW - lx - 60;
        const lineH = Math.min(30, (canvasH - topPad - 8) / Math.max(rows.length, 1));
        rows.forEach(([label, value], i) => {
            const ly = topPad + i * lineH + lineH / 2;
            ctx.fillStyle = PIE_COLORS[i % PIE_COLORS.length];
            ctx.fillRect(lx, ly - 7, 14, 14);
            ctx.font = "13px sans-serif";
            let display = label;
            while (ctx.measureText(display).width > availW && display.length > 4) {
                display = display.slice(0, -2);
            }
            if (display !== label) display = display.replace(/\s+$/, "") + "…";
            ctx.fillStyle = "#3A3A32";
            ctx.textAlign = "left";
            ctx.textBaseline = "middle";
            ctx.fillText(display, lx + 22, ly);
            ctx.fillStyle = "#16213E";
            ctx.font = "bold 13px sans-serif";
            ctx.textAlign = "right";
            ctx.fillText(String(value), canvasW - 10, ly);
        });
        return canvas.toDataURL("image/png");
    }

    function drawBar(rows, width, height, titleText) {
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, width, height);
        ctx.font = "bold 15px sans-serif";
        ctx.fillStyle = "#16213E";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText(titleText, 4, 4);
        const topPad = 34;
        const max = Math.max(...rows.map(([, v]) => v), 1);
        ctx.font = "13px sans-serif";
        let widest = 0;
        rows.forEach(([label]) => {
            const w = ctx.measureText(label).width;
            if (w > widest) widest = w;
        });
        const leftPad = Math.min(Math.max(widest + 26, 120), width * 0.42);
        const rightPad = 50;
        const n = Math.max(rows.length, 1);
        const barH = Math.min(26, Math.floor((height - topPad - 10) / n) - 8);
        rows.forEach(([label, value], i) => {
            const y = topPad + i * (barH + 8);
            let display = label;
            let font = "13px sans-serif";
            ctx.font = font;
            if (ctx.measureText(display).width > leftPad - 14) {
                font = "11px sans-serif";
                ctx.font = font;
            }
            ctx.fillStyle = "#3A3A32";
            ctx.textAlign = "right";
            ctx.textBaseline = "middle";
            ctx.fillText(display, leftPad - 10, y + barH / 2);
            const barW = (width - leftPad - rightPad) * value / max;
            ctx.fillStyle = PIE_COLORS[i % PIE_COLORS.length];
            ctx.fillRect(leftPad, y, Math.max(barW, 2), barH);
            ctx.fillStyle = "#16213E";
            ctx.font = "bold 13px sans-serif";
            ctx.textAlign = "left";
            ctx.fillText(String(value), leftPad + barW + 8, y + barH / 2);
        });
        return canvas.toDataURL("image/png");
    }

    const wb = new ExcelJS.Workbook();
    wb.creator = "QA აუდიტის პლათფორმა";
    wb.created = new Date();

    const dash = wb.addWorksheet("დეშბორდი", { views: [{ showGridLines: false }] });

        { width: 3 }, { width: 14 }, { width: 14 }, { width: 14 }, { width: 14 },

    const dashBannerRight = paintExcelBanner(dash, NAVY, 10);

    const excelGeneratedAt = `${formatDocDate()} ${formatDocTime()}`;

    dash.mergeCells(`C3:${dashBannerRight}3`);

    dash.addImage(wb.addImage({ base64: LOGO_PNG_BASE64, extension: "png" }), {

        ext: { width: 180, height: 40 }

    dash.mergeCells("B4:I4");
    const sectionTitleCell = dash.getCell("B4");
    sectionTitleCell.value = "მიმოხილვა";
    sectionTitleCell.font = { size: 15, bold: true, color: { argb: NAVY }, name: "Calibri" };
    sectionTitleCell.alignment = { vertical: "middle" };
    dash.getRow(4).height = 26;

    const kpis = [
        ["სულ ქეისი", total, NAVY, "B"],
        ["დახურული", closed, GREEN, "E"],
        ["ღია", open, RED, "H"]
    ];

    kpis.forEach(([label, value, color, col]) => {
        const nextCol = String.fromCharCode(col.charCodeAt(0) + 1);
        dash.mergeCells(`${col}5:${nextCol}5`);
        dash.mergeCells(`${col}6:${nextCol}7`);
        const labelCell = dash.getCell(`${col}5`);
        labelCell.value = label;
        labelCell.font = { size: 10, bold: true, color: { argb: MUTED } };
        const valueCell = dash.getCell(`${col}6`);
        valueCell.value = value;

        valueCell.alignment = { vertical: "middle" };
    });

    const donutW = 430, donutH = 230;
    const auditImg = drawDonutLegend(auditRows, donutW, donutH, "აუდიტის შედეგი");
    dash.addImage(wb.addImage({ base64: auditImg, extension: "png" }), "B9:E17");

    const statusImg = drawDonutLegend(statusRows, donutW, donutH, "სტატუსი");
    dash.addImage(wb.addImage({ base64: statusImg, extension: "png" }), "F9:I17");

    let row = 19;
    function barSection(title, rows, rowStart) {
        const h = Math.max(rows.length * 34 + 46, 140);
        const img = drawBar(rows, 900, h, title);
        const spanRows = Math.max(Math.round(h / 20), 6);
        dash.addImage(wb.addImage({ base64: img, extension: "png" }), `B${rowStart}:I${rowStart + spanRows}`);
        return rowStart + spanRows + 2;
    }

    row = barSection("მოთხოვნის კატეგორია", catRows, row);
    row = barSection("დახმარების ტიპი", helpRows, row);
    barSection("შეფერხების მიზეზი", delayRows, row);

    const cs = wb.addWorksheet("საქმეები", { views: [{ state: "frozen", ySplit: 5 }] });

    const headerDefs = [
        ["№", 6],
        ["აუდიტის თარიღი", 15],
        ["ინციდენტის თარიღი", 16],
        ["Jira", 14],
        ["ოპერატორი", 40],
        ["დეპარტამენტი", 40],
        ["კატეგორია", 40],
        ["დახმარების ტიპი", 21],  
        ["შეფერხების მიზეზი", 40],
        ["სხვა მიზეზი", 53],
        ["პრობლემა", 53],
        ["რეკომენდაცია", 53],
        ["სტატუსი", 19],       
        ["აუდიტის შედეგი", 19]   
    ];
  
    const centeredCols = new Set([1, 2, 3, 4, 8, 13, 14]);
    const lastColLetter = String.fromCharCode(64 + headerDefs.length);

    cs.columns = headerDefs.map(([h, w]) => ({ key: h, width: w }));

    const csBannerRight = paintExcelBanner(cs, NAVY, headerDefs.length);

    cs.mergeCells(`C2:${csBannerRight}2`);
    const csRespCell = cs.getCell("C2");
    const csRespLines = getResponsiblePersonLines(data);
    csRespCell.value = csRespLines.primary;
    csRespCell.font = { size: 11, bold: true, color: { argb: WHITE } };
    csRespCell.alignment = { horizontal: "right", vertical: "middle" };

    cs.mergeCells(`C3:${csBannerRight}3`);
    const csExcelGeneratedAt = `${formatDocDate()} ${formatDocTime()}`;
    const csRespSubCell = cs.getCell("C3");
    csRespSubCell.value = [csRespLines.secondary, csExcelGeneratedAt].filter(Boolean).join("   •   ");
    csRespSubCell.font = { size: 9, color: { argb: WHITE } };
    csRespSubCell.alignment = { horizontal: "right", vertical: "middle" };

    cs.addImage(wb.addImage({ base64: LOGO_PNG_BASE64, extension: "png" }), {
        tl: { col: 0.55, row: 1.1 },
        ext: { width: 180, height: 40 }
    });

    cs.mergeCells(`A4:${lastColLetter}4`);
    const csSectionTitle = cs.getCell("A4");
    csSectionTitle.value = "საქმეების ჟურნალი";

    cs.getRow(4).height = 24;

    const headerRow = cs.getRow(5);
    headerDefs.forEach(([label], i) => { headerRow.getCell(i + 1).value = label; });
    headerRow.eachCell((cell, colNumber) => {
        cell.font = { bold: true, color: { argb: WHITE } };
        cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: NAVY } };
        cell.alignment = {

        };

    all.forEach((c, i) => {

            cell.value = { text: String(c.jira).trim(), hyperlink: jiraUrl(c.jira) };
            cell.font = { color: { argb: "FF0563C1" }, underline: true };
        }

        if (i % 2 === 1) {
            r.eachCell(cell => {

            });
        }

        r.eachCell((cell, colNumber) => {
            cell.border = { bottom: { style: "thin", color: { argb: BORDERC } } };
            cell.alignment = {

                horizontal: centeredCols.has(colNumber) ? "center" : "left",

        const longest = Math.max(

    cs.autoFilter = {
        from: "A5",
        to: `${lastColLetter}5`

    });
    applyExcelPrintSetup(dash, {
      lastColLetter: "J",
      lastRow: dash.rowCount || 40,
      titleRows: "1:3",
      orientation: "landscape"
    });

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], {
        type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `qa-audit-report-${new Date().toISOString().slice(0, 10)}.xlsx`;
    a.click();

      React.createElement("p", { className: "text-xs text-[#9A967F] mb-3 italic" },
        "დააჭირეთ ნებისმიერ ჩანაწერს და გაიხსნება სრული დეტალები."
      ),
      React.createElement(CasesTable, {
        cases: filtered,
        onEdit: setEditing,
        onDelete: setToDelete,
        selectedIds,
        onToggleSelect: toggleSelect,
        onToggleSelectAll: toggleSelectAll,
        onPageChange: () => setSelectedIds([]),
        onBulkDelete: () => setBulkDeletePending(true)
      })
    ),
    (adding || editing) && React.createElement(CaseFormModal, {
      initial: editing,
      lists: data,
      employees: data.employees,
      onSave: saveCase,
      onClose: () => {
        setEditing(null);
        setAdding(false);
      }
    }),
    toDelete && React.createElement(ConfirmDialog, {
      text: `ნამდვილად გსურთ საქმის №${String(toDelete.no).padStart(3, "0")} წაშლა?`,
      onConfirm: deleteCase,
      onCancel: () => setToDelete(null)
    }),
    bulkDeletePending && React.createElement(ConfirmDialog, {
      text: `ნამდვილად გსურთ ${selectedIds.length} მონიშნული ჩანაწერის წაშლა?`,
      onConfirm: confirmBulkDelete,
      onCancel: () => setBulkDeletePending(false)
    })
  );
}

function IncidentFormModal({ initial, incidentTypes, employees, onSave, onClose }) {

    if (initial) {
      return {
        ...initial,
        incidentTypeId: initial.incidentTypeId || "",
        employeeId: initial.employeeId || ""
      };
    }
    return {
      jira: "",
      employeeId: "",
      incidentTypeId: getDefaultId(incidentTypes),
      protocolCompliant: false,
      incomingRequest: "",
      response: ""
    };
  });

  const set = k => e => setForm({ ...form, [k]: e.target.value });

  const buildPayload = () => ({
    ...form,
    incidentTypeId: form.incidentTypeId || "",
    employeeId: form.employeeId || "",

        },

/*  INCIDENTS TABLE (expandable rows)                              */
/* ================================================================== */

function IncidentsTable({ incidents, onEdit, onDelete, onPrint, selectedIds, onToggleSelect, onToggleSelectAll, onPageChange, onBulkDelete }) {
  const [expanded, setExpanded] = useState(null);
  const [currentPage, setCurrentPage] = useState(0);
  const ITEMS_PER_PAGE = 100;
  const selectable = typeof onToggleSelect === "function";
  const selectedSet = useMemo(() => new Set(selectedIds || []), [selectedIds]);

  const totalPages = Math.ceil(incidents.length / ITEMS_PER_PAGE);
  const paginatedIncidents = useMemo(() => {
    const start = currentPage * ITEMS_PER_PAGE;
    return incidents.slice(start, start + ITEMS_PER_PAGE);
  }, [incidents, currentPage]);

  const pageIds = useMemo(() => paginatedIncidents.map(i => i.id), [paginatedIncidents]);
  const allPageSelected = pageIds.length > 0 && pageIds.every(id => selectedSet.has(id));
  const somePageSelected = pageIds.some(id => selectedSet.has(id));

  useEffect(() => {
    setCurrentPage(0);
  }, [incidents.length]);

  useEffect(() => {
    if (typeof onPageChange === "function") onPageChange(currentPage);
  }, [currentPage]);

  if (incidents.length === 0) {
    return React.createElement("div", { className: "text-center py-14 text-[#9A967F]" },
      React.createElement(Icon, { name: "task_alt", className: "mx-auto mb-2 opacity-40", size: 30 }),
      React.createElement("p", { className: "text-sm italic" }, "შემთხვევები არ მოიძებნა")
    );
  }

  const goPage = (next) => setCurrentPage(next);

  const Pager = () => React.createElement("div", {
    className: "flex items-center justify-between px-3 py-2 bg-[#FBF9F3] rounded-lg border border-[#E4E1D6]"
  },
    React.createElement("span", { className: "text-xs text-[#8A8672]" },
      `ნაჩვენებია ${currentPage * ITEMS_PER_PAGE + 1}-${Math.min((currentPage + 1) * ITEMS_PER_PAGE, incidents.length)} / ${incidents.length} ჩანაწერი`
    ),
    React.createElement("div", { className: "flex gap-1" },
      React.createElement("button", {
        disabled: currentPage === 0,
        onClick: () => goPage(currentPage - 1),
        className: "px-3 py-1 text-xs font-semibold rounded-md border border-[#DBD7C8] hover:bg-[#EFEDE2] disabled:opacity-40 disabled:cursor-not-allowed"
      }, "← წინა"),
      React.createElement("span", { className: "px-3 py-1 text-xs font-semibold text-[#16213E]" },
        `${currentPage + 1} / ${totalPages}`
      ),
      React.createElement("button", {
        disabled: currentPage >= totalPages - 1,
        onClick: () => goPage(currentPage + 1),
        className: "px-3 py-1 text-xs font-semibold rounded-md border border-[#DBD7C8] hover:bg-[#EFEDE2] disabled:opacity-40 disabled:cursor-not-allowed"
      }, "შემდეგი →")
    )
  );

  const selectedCount = (selectedIds || []).length;

  return React.createElement("div", { className: "flex flex-col gap-3" },
    selectable && React.createElement("div", {
      className: "flex items-center justify-between gap-3 flex-wrap px-3 py-2 bg-[#FBF9F3] rounded-lg border border-[#E4E1D6]"
    },
      React.createElement("label", {
        className: "inline-flex items-center gap-2 text-[11px] font-semibold text-[#6B6A5C] cursor-pointer select-none"
      },
        React.createElement("input", {
          type: "checkbox",
          checked: allPageSelected,
          ref: el => { if (el) el.indeterminate = somePageSelected && !allPageSelected; },
          onChange: () => onToggleSelectAll && onToggleSelectAll(pageIds, !allPageSelected),
          className: "w-3.5 h-3.5 accent-[#16213E] cursor-pointer"
        }),
        "ყველას მონიშვნა"
      ),
      selectedCount > 0 && typeof onBulkDelete === "function" && React.createElement("button", {
        onClick: onBulkDelete,
        className: "flex items-center gap-1.5 px-3 py-1.5 rounded-md text-sm font-semibold bg-[#C0392B] text-white hover:bg-[#a5312a]"
      },
        React.createElement(Icon, { name: "delete", size: 15 }),
        ` წაშლა (${selectedCount})`
      )
    ),
    incidents.length > ITEMS_PER_PAGE && React.createElement(Pager, null),
    React.createElement("div", { className: "flex flex-col gap-2" },
    paginatedIncidents.map(inc => {
      const isOpen = expanded === inc.id;
      const isChecked = selectedSet.has(inc.id);
      return React.createElement("div", {
        key: inc.id,
        className: `qa-fade-up rounded-lg border ${isOpen ? "border-[#EADFB8] bg-[#FBF9F3]" : "border-[#E4E1D6] bg-white"} overflow-hidden ${isChecked ? "ring-1 ring-[#B8860B]/40" : ""}`
      },
        React.createElement("div", {
          onClick: () => setExpanded(isOpen ? null : inc.id),
          className: "flex items-center gap-3 px-4 py-3 cursor-pointer hover:bg-[#FBF9F3] transition-colors group"
        },
          selectable && React.createElement("input", {
            type: "checkbox",
            checked: isChecked,
            onChange: () => onToggleSelect(inc.id),
            onClick: e => e.stopPropagation(),
            className: "w-3.5 h-3.5 accent-[#16213E] cursor-pointer shrink-0"
          }),
          React.createElement(Icon, {
            name: "chevron_right",
            size: 15,
            className: `transition-transform duration-200 ${isOpen ? "rotate-90" : ""} text-[#B8860B] shrink-0`
          }),
          React.createElement(Icon, {
            name: "star",
            size: 18,
            filled: inc.protocolCompliant,
            className: "shrink-0",
            style: { color: inc.protocolCompliant ? "#FFC107" : "#D8D4C4" }
          }),
          React.createElement("span", { className: "qa-mono text-sm text-[#2A4270] font-semibold shrink-0 min-w-[90px]" },
            inc.jira
              ? React.createElement("a", {
                  href: jiraUrl(inc.jira),
                  target: "_blank",
                  rel: "noopener noreferrer",
                  className: "hover:underline",
                  onClick: e => e.stopPropagation()
                }, inc.jira)
              : "—"
          ),
          React.createElement("span", { className: "text-sm text-[#3A3A32] flex-1 min-w-0 truncate" },
            inc.employee || "თანამშრომელი არ არის მითითებული"
          ),
          React.createElement("span", { className: "shrink-0" },
            React.createElement("span", {
              className: "qa-stamp qa-serif inline-flex items-center px-2.5 py-1 text-xs font-semibold tracking-wide",
              style: { color: "#2A4270", background: "#E6EBF4" }
            }, inc.incidentType || "—")
          ),
          React.createElement("div", { className: "flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity shrink-0" },
            onPrint && React.createElement("button", {
              onClick: e => { e.stopPropagation(); onPrint(inc); },
              className: "p-1.5 rounded-md hover:bg-[#E6EBF4] text-[#2A4270]",
              title: "PDF გენერირება"
            }, React.createElement(Icon, { name: "picture_as_pdf", size: 14 })),
            onEdit && React.createElement("button", {
              onClick: e => { e.stopPropagation(); onEdit(inc); },
              className: "p-1.5 rounded-md hover:bg-[#E6EBF4] text-[#2A4270]",
              title: "რედაქტირება"
            }, React.createElement(Icon, { name: "edit", size: 14 })),
            onDelete && React.createElement("button", {
              onClick: e => { e.stopPropagation(); onDelete(inc); },
              className: "p-1.5 rounded-md hover:bg-[#F6E4E1] text-[#C0392B]",
              title: "წაშლა"
            }, React.createElement(Icon, { name: "delete", size: 14 }))
          )
        ),
        React.createElement("div", {
          className: `grid transition-all duration-300 ease-out ${isOpen ? "grid-rows-[1fr]" : "grid-rows-[0fr]"}`
        },
          React.createElement("div", { className: "overflow-hidden" },
            React.createElement("div", { className: "px-4 pb-4 pt-1 grid grid-cols-1 md:grid-cols-2 gap-4 border-t border-[#EEEBDF]" },
              React.createElement("div", { className: "flex flex-col gap-1 pt-3" },
                React.createElement("span", { className: "text-[10px] uppercase tracking-wide text-[#8A8672] font-semibold" }, "შემოსული მოთხოვნა"),
                React.createElement("p", { className: "text-sm text-[#2C2B24]", style: { whiteSpace: "pre-wrap" } }, inc.incomingRequest || "—")
              ),
              React.createElement("div", { className: "flex flex-col gap-1 pt-3" },
                React.createElement("span", { className: "text-[10px] uppercase tracking-wide text-[#8A8672] font-semibold" }, "დაბრუნებული პასუხი"),
                React.createElement("p", { className: "text-sm text-[#2C2B24]", style: { whiteSpace: "pre-wrap" } }, inc.response || "—")
              )
            )
          )
        )
      );
    })
    ),
    incidents.length > ITEMS_PER_PAGE && React.createElement(Pager, null)
  );
}

function IncidentsPage({ data, saveData }) {
  const [query, setQuery] = useState("");
  const [typeFilter, setTypeFilter] = useState("");
  const [employeeFilter, setEmployeeFilter] = useState("");
  const [starFilter, setStarFilter] = useState("");

  const [adding, setAdding] = useState(false);
  const [toDelete, setToDelete] = useState(null);
  const [printId, setPrintId] = useState(null);
  const [selectedIds, setSelectedIds] = useState([]);

  const incidents = data.incidents || [];

  useEffect(() => {
    setSelectedIds([]);

  useEffect(() => {
    if (printId) {

      const onAfterPrint = () => setPrintId(null);
      window.addEventListener("afterprint", onAfterPrint);
      return () => {
        clearTimeout(t);
        window.removeEventListener("afterprint", onAfterPrint);
      };
    }
  }, [printId]);

  const searchIndex = useMemo(() => {
    return incidents.map(i => ({
      id: i.id,
      searchable: [i.jira, i.employee, i.incidentType, i.incomingRequest, i.response]
        .filter(Boolean).join(' ').toLowerCase()
    }));
  }, [incidents]);

  const filtered = useMemo(() => {
    let result = incidents;
    if (typeFilter) result = result.filter(i => i.incidentTypeId === typeFilter || i.incidentType === typeFilter);
    if (employeeFilter) {
      if (employeeFilter === "__none__") {
        result = result.filter(i => !i.employee);
      } else {
        result = result.filter(i => i.employee === employeeFilter);
      }
    }
    if (starFilter === "yes") result = result.filter(i => i.protocolCompliant);
    if (starFilter === "no") result = result.filter(i => !i.protocolCompliant);
    if (query) {
      const q = query.toLowerCase();
      const matchingIds = new Set(
        searchIndex.filter(item => item.searchable.includes(q)).map(item => item.id)
      );
      result = result.filter(i => matchingIds.has(i.id));
    }
    return result.slice().reverse();
  }, [incidents, typeFilter, employeeFilter, starFilter, query, searchIndex]);

  const filtersActive = Boolean(typeFilter || employeeFilter || starFilter || query);

  const total = filtered.length;
  const starredCount = filtered.filter(i => i.protocolCompliant).length;

  const typeRows = tally(filtered, "incidentType");

      list = [...incidents, { id: uid(), no, createdAt: new Date().toISOString(), ...form }];

    saveData({ ...data, incidents: list });
    setEditing(null);
    setAdding(false);

  const toggleSelect = (id) => {

      titleRows: "1:5",
      orientation: "landscape"
    });
    applyExcelPrintSetup(dash, {
      lastColLetter: "J",
      lastRow: dash.rowCount || 40,
      titleRows: "1:3",
      orientation: "landscape"
    });

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], {
      type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `qa-incidents-report-${new Date().toISOString().slice(0, 10)}.xlsx`;
    a.click();
  };

  const selectCls = "px-2.5 py-1.5 rounded-md border border-[#DBD7C8] bg-white text-sm text-[#2C2B24] focus:outline-none focus:ring-2 focus:ring-[#B8860B]/40";
  const printIncident = printId ? incidents.find(i => i.id === printId) : null;

  return React.createElement("div", { className: "flex flex-col gap-6" },
    React.createElement("div", { className: "qa-noprint flex flex-col gap-6" },
      React.createElement("div", { className: "flex flex-wrap items-center justify-between gap-3" },
        React.createElement("div", null,
          React.createElement("h1", { className: "qa-serif text-2xl font-bold text-[#16213E]" }, "შემთხვევები"),
          React.createElement("p", { className: "text-sm text-[#8A8672] mt-0.5" },
            "შემოსული მოთხოვნები, დაბრუნებული პასუხები და პროტოკოლის შესაბამისობა."
          )
        ),
        React.createElement("div", { className: "flex gap-2 flex-wrap" },
          React.createElement("button", {
            onClick: () => exportIncidentsExcel(filtered),
            className: "flex items-center gap-1.5 px-3.5 py-2 rounded-md text-sm font-semibold border border-[#DBD7C8] bg-white hover:bg-[#F3F1E7] text-[#3A3A32]",
            title: filtersActive ? "გატანილი იქნება მხოლოდ გაფილტრული ჩანაწერები" : "გატანილი იქნება ყველა ჩანაწერი"
          },
            React.createElement(Icon, { name: "download", size: 15 }),
            " Excel ",
            filtersActive && React.createElement("span", {
              className: "qa-mono text-[10px] bg-[#EADFB8] text-[#8C6B21] px-1.5 py-0.5 rounded-full"
            }, filtered.length)
          ),
          React.createElement("button", {
            onClick: () => setAdding(true),
            className: "flex items-center gap-1.5 px-3.5 py-2 rounded-md text-sm font-semibold bg-[#16213E] text-white hover:bg-[#223057]"
          },
            React.createElement(Icon, { name: "add", size: 15 }),
            " ახალი შემთხვევა"
          )
        )
      ),

      React.createElement("div", { className: "flex flex-wrap gap-3 items-center bg-[#FBF9F3] border border-[#E4E1D6] rounded-lg p-3" },
        React.createElement("div", { className: "relative flex-1 min-w-[200px]" },
          React.createElement(Icon, {
            name: "search",
            size: 15,
            className: "absolute left-2.5 top-1/2 -translate-y-1/2 text-[#9A967F]"
          }),
          React.createElement("input", {
            className: "w-full pl-8 pr-3 py-1.5 rounded-md border border-[#DBD7C8] bg-white text-sm focus:outline-none focus:ring-2 focus:ring-[#B8860B]/40",
            placeholder: "ძებნა: Jira, თანამშრომელი, მოთხოვნა, პასუხი…",
            value: query,
            onChange: e => setQuery(e.target.value)
          })
        ),
        React.createElement("select", {
          className: selectCls,
          value: typeFilter,
          onChange: e => setTypeFilter(e.target.value)
        },
          React.createElement("option", { value: "" }, "ყველა შემთხვევა"),
          data.incidentTypes.map(t => React.createElement("option", { key: t.id, value: t.id }, t.label))
        ),
        React.createElement("select", {

        },

          React.createElement("option", { value: "__none__" }, "თანამშრომელი არ არის მითითებული"),
          data.employees.map(e => React.createElement("option", { key: e.id, value: e.name }, e.name))
        ),
        React.createElement("select", {
          className: selectCls,

        },
          React.createElement("option", { value: "" }, "⭐ ყველა"),
