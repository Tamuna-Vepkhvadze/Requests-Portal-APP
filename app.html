try {

/* ================================================================== */
/*  CRYPTO MODULE                                                  */
/* ================================================================== */

const CryptoModule = {
  PBKDF2_ITERATIONS: 310000, 
  
  generateSalt() {
    return crypto.getRandomValues(new Uint8Array(16));
  },
  
  async deriveKey(password, salt, iterations = this.PBKDF2_ITERATIONS) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw',
      enc.encode(password),
      'PBKDF2',
      false,
      ['deriveBits', 'deriveKey']
    );
    
    return crypto.subtle.deriveKey(
      {
        name: 'PBKDF2',
        salt: salt,
        iterations: iterations,
        hash: 'SHA-256'
      },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false, 
      ['encrypt', 'decrypt']
    );
  },
  
  async hashPassword(password) {
    const salt = this.generateSalt();
    const iterations = this.PBKDF2_ITERATIONS;
    
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw',
      enc.encode(password),
      'PBKDF2',
      false,
      ['deriveBits']
    );
    
    const hashBuffer = await crypto.subtle.deriveBits(
      {
        name: 'PBKDF2',
        salt: salt,
        iterations: iterations,
        hash: 'SHA-256'
      },
      keyMaterial,
      256
    );
    
    return {
      hash: Array.from(new Uint8Array(hashBuffer)),
      salt: Array.from(salt),
      iterations
    };
  },
  
  async verifyPassword(password, storedHash, storedSalt, iterations) {
    const salt = new Uint8Array(storedSalt);
    
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw',
      enc.encode(password),
      'PBKDF2',
      false,
      ['deriveBits']
    );
    
    const hashBuffer = await crypto.subtle.deriveBits(
      {
        name: 'PBKDF2',
        salt: salt,
        iterations: iterations,
        hash: 'SHA-256'
      },
      keyMaterial,
      256
    );
    
    const hash = Array.from(new Uint8Array(hashBuffer));
    
    if (hash.length !== storedHash.length) return false;
    let diff = 0;
    for (let i = 0; i < hash.length; i++) {
      diff |= hash[i] ^ storedHash[i];
    }
    return diff === 0;
  },
  
  async encryptData(data, key) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const enc = new TextEncoder();
    const encoded = enc.encode(JSON.stringify(data));
    
    const encrypted = await crypto.subtle.encrypt(
      { name: 'AES-GCM', iv },
      key,
      encoded
    );
    
    return {
      encrypted: Array.from(new Uint8Array(encrypted)),
      iv: Array.from(iv)
    };
  },
  
  async decryptData(encryptedData, iv, key) {
    try {
      const decrypted = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: new Uint8Array(iv) },
        key,
        new Uint8Array(encryptedData)
      );
      
      const dec = new TextDecoder();
      return JSON.parse(dec.decode(decrypted));
    } catch (e) {
      throw new Error('დეშიფრაცია ვერ მოხერხდა პაროლი არასწორია ან მონაცემები დაზიანებულია.');
    }
  },
  
  // ============================================================
  // v2 KDF SCHEME domain-separated verification hash vs
  // encryption key (fixes v1 bug where both were byte-identical).
  // Two-stage derivation: PBKDF2(password) -> master bits,
  // then HKDF(master bits, info="verify"/"encrypt") -> two
  // cryptographically independent outputs.
  // Legacy v1 methods above are kept ONLY for transparently
  // migrating pre-existing accounts; new accounts always use v2.
  // ============================================================

  async deriveMasterBits(password, salt, iterations) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']
    );
    return crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
      keyMaterial,
      256
    );
  },

  async deriveSubkeysV2(masterBits) {
    const hkdfKey = await crypto.subtle.importKey('raw', masterBits, 'HKDF', false, ['deriveBits', 'deriveKey']);
    const verifyBits = await crypto.subtle.deriveBits(
      { name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(0), info: new TextEncoder().encode('qa-audit-verify-v1') },
      hkdfKey,
      256
    );
    const encryptionKey = await crypto.subtle.deriveKey(
      { name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(0), info: new TextEncoder().encode('qa-audit-encrypt-v1') },
      hkdfKey,
      { name: 'AES-GCM', length: 256 },
      false, 
      ['encrypt', 'decrypt']
    );
    return { verifyHash: Array.from(new Uint8Array(verifyBits)), encryptionKey };
  },


  async createCredentialsV2(password, iterations = this.PBKDF2_ITERATIONS) {
    const salt = this.generateSalt();
    const masterBits = await this.deriveMasterBits(password, salt, iterations);
    const { verifyHash, encryptionKey } = await this.deriveSubkeysV2(masterBits);
    return {
      hash: verifyHash,
      salt: Array.from(salt),
      iterations,
      scheme: 'v2',
      encryptionKey
    };
  },


  async verifyAndDeriveV2(password, storedHash, storedSalt, iterations) {
    const salt = new Uint8Array(storedSalt);
    const masterBits = await this.deriveMasterBits(password, salt, iterations);
    const { verifyHash, encryptionKey } = await this.deriveSubkeysV2(masterBits);

    if (verifyHash.length !== storedHash.length) return null;
    let diff = 0;
    for (let i = 0; i < verifyHash.length; i++) {
      diff |= verifyHash[i] ^ storedHash[i];
    }
    return diff === 0 ? encryptionKey : null;
  },

  checkPasswordStrength(password) {
    if (password.length < 8) return 0;
    
    let strength = 0;
    if (password.length >= 12) strength++;
    if (/[a-z]/.test(password)) strength++;
    if (/[A-Z]/.test(password)) strength++;
    if (/[0-9]/.test(password)) strength++;
    if (/[^a-zA-Z0-9]/.test(password)) strength++;
    
    if (strength <= 2) return 1;
    if (strength <= 3) return 2;
    return 3;
  }
};

/* ================================================================== */
/*  SECURE STORAGE                                                 */
/* ================================================================== */

const QA_IDB_NAME = "qa_audit_secure_v1";
const QA_IDB_VERSION = 1;

const SecureStorage = {
  db: null,
  
  async init() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(QA_IDB_NAME, QA_IDB_VERSION);
      
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        
        if (!db.objectStoreNames.contains('user')) {
          db.createObjectStore('user', { keyPath: 'id' });
        }
        if (!db.objectStoreNames.contains('encrypted_data')) {
          db.createObjectStore('encrypted_data', { keyPath: 'id' });
        }
      };
      
      req.onsuccess = () => {
        this.db = req.result;
        resolve(true);
      };
      
      req.onerror = () => reject(req.error);
    });
  },
  
  async getUser() {
    const tx = this.db.transaction('user', 'readonly');
    const store = tx.objectStore('user');
    
    return new Promise((resolve, reject) => {
      const req = store.get('main');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  
  async saveUser(userData) {
    const tx = this.db.transaction('user', 'readwrite');
    const store = tx.objectStore('user');
    
    return new Promise((resolve, reject) => {
      const req = store.put({ id: 'main', ...userData });
      req.onsuccess = () => resolve(true);
      req.onerror = () => reject(req.error);
    });
  },
  
  async getEncryptedData() {
    const tx = this.db.transaction('encrypted_data', 'readonly');
    const store = tx.objectStore('encrypted_data');
    
    return new Promise((resolve, reject) => {
      const req = store.get('main');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  
  async saveEncryptedData(encryptedPayload) {
    const tx = this.db.transaction('encrypted_data', 'readwrite');
    const store = tx.objectStore('encrypted_data');
    
    return new Promise((resolve, reject) => {
      const req = store.put({ id: 'main', ...encryptedPayload });
      req.onsuccess = () => resolve(true);
      req.onerror = () => reject(req.error);
    });
  },
  
  async saveUserAndData(userData, encryptedPayload) {
    const tx = this.db.transaction(['user', 'encrypted_data'], 'readwrite');

    return new Promise((resolve, reject) => {
      tx.objectStore('user').put({ id: 'main', ...userData });
      tx.objectStore('encrypted_data').put({ id: 'main', ...encryptedPayload });
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
    });
  },

  async deleteAllData() {
    const tx = this.db.transaction(['user', 'encrypted_data'], 'readwrite');
    
    return new Promise((resolve, reject) => {
      tx.objectStore('user').clear();
      tx.objectStore('encrypted_data').clear();
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }
};


const PersistentStorage = {

  async isSupported() {
    return !!(navigator.storage && navigator.storage.persist && navigator.storage.persisted);
  },

  isFileProtocol() {
    try { return window.location.protocol === 'file:'; } catch { return false; }
  },

  async check() {
    try {
      if (!(await this.isSupported())) return null;
      return await navigator.storage.persisted();
    } catch {
      return null;
    }
  },

  async request() {
    try {
      if (!(await this.isSupported())) return null;
      const already = await navigator.storage.persisted();
      if (already) return true;

      const timeout = new Promise(resolve => setTimeout(() => resolve('__timeout__'), 6000));
      const result = await Promise.race([navigator.storage.persist(), timeout]);
      if (result === '__timeout__') {
        console.warn('[persistent-storage] persist() did not settle within 6s treating as inconclusive');
        return null;
      }
      return result;
    } catch (err) {
      console.error('[persistent-storage] request() failed:', err);
      return null;
    }
  }
};

const JIRA_BASE_URL = "https://jira.lb.ge/login.jsp?permissionViolation=true&os_destination=%2Fbrowse%2F";

function jiraUrl(key) {
  if (!key || !String(key).trim()) return null;
  const raw = String(key).trim();
  if (raw.startsWith("http://") || raw.startsWith("https://")) return raw;
  return JIRA_BASE_URL + encodeURIComponent(raw);
}

const PERSONAL_ID_URL = "https://lien.lb.ge/#/letters";

const ID_FIELD_DEFS = [
  { key: "jira", label: "JIRA №", short: "JIRA №" },
  { key: "personalId", label: "პირადი / საიდენტიფიკაციო №", short: "პირადი №" },
  { key: "caseNo", label: "საქმის №", short: "საქმის №" }
];

const DEFAULT_ID_FIELDS_SCOPE = { jira: true, personalId: false, caseNo: false };

function normalizeIdFieldsScope(raw) {
  const src = raw && typeof raw === "object" ? raw : {};
  return {
    jira: src.jira === undefined ? true : !!src.jira,
    personalId: !!src.personalId,
    caseNo: !!src.caseNo
  };
}

function normalizeIdFieldsConfig(raw) {
  const src = raw && typeof raw === "object" ? raw : {};
  return {
    cases: normalizeIdFieldsScope(src.cases || DEFAULT_ID_FIELDS_SCOPE),
    incidents: normalizeIdFieldsScope(src.incidents || DEFAULT_ID_FIELDS_SCOPE)
  };
}

const EXTRA_NOTE_LABEL = "დამატებითი ჩანაწერი";
const DEFAULT_EXTRA_NOTE_SCOPE = { enabled: false, panel: false, excel: false };

function normalizeExtraNoteScope(raw) {
  const s = raw && typeof raw === "object" ? raw : {};
  return {
    enabled: !!s.enabled,
    panel: !!s.panel,
    excel: !!s.excel
  };
}

function normalizeExtraNoteConfig(raw) {
  const src = raw && typeof raw === "object" ? raw : {};
  return {
    cases: normalizeExtraNoteScope(src.cases),
    incidents: normalizeExtraNoteScope(src.incidents)
  };
}

function previewExtraNote(text, maxLen) {
  const lim = maxLen == null ? 48 : maxLen;
  const t = String(text || "").trim().replace(/\s+/g, " ");
  if (!t) return "";
  if (t.length <= lim) return t;
  const cut = t.slice(0, lim);
  const softer = cut.replace(/\s+\S*$/, "");
  return (softer.length > 12 ? softer : cut) + "…";
}

function ExtraNotePreviewLine({ text }) {
  const full = String(text || "").trim();
  if (!full) return null;
  const short = previewExtraNote(full, 48);
  return React.createElement("div", {
    className: "qa-extra-note-preview",
    title: full
  }, short);
}

function sanitizePersonalId(v) {
  return String(v == null ? "" : v).replace(/\D/g, "");
}

function asIdString(v) {
  return v == null ? "" : String(v);
}

function activeIdFieldKeys(scope) {
  const s = normalizeIdFieldsScope(scope);
  return ID_FIELD_DEFS.filter(d => s[d.key]).map(d => d.key);
}

function idKeysForDisplay(scope, records) {
  const enabled = normalizeIdFieldsScope(scope);
  const list = records || [];
  return ID_FIELD_DEFS.filter(d => {
    if (enabled[d.key]) return true;
    return list.some(r => asIdString(r[d.key]).trim() !== "");
  }).map(d => d.key);

  const norm = isPersonal ? v : v.toLowerCase();
  for (let i = 0; i < list.length; i++) {

  return null;
}

async function copyTextToClipboard(text) {
  const t = String(text || "");
  if (!t) return false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(t);
      return true;
    }
  } catch (_) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = t;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (_) {
    return false;
  }
}

function normalizeCustomFieldDefs(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.map(f => {
    if (!f || typeof f !== "object") return null;
    const id = f.id || newCustomFieldId();
    const type = ["text", "textarea", "dropdown"].includes(f.type) ? f.type : "text";
    const scope = ["cases", "incidents", "both"].includes(f.scope) ? f.scope : "both";
    let options = [];
    if (type === "dropdown") {
      options = ensureIdList(Array.isArray(f.options) ? f.options : [], {});
    }
    return {
      id,
      label: String(f.label || "").trim() || "უსახელო ველი",
      type,
      scope,
      options,
      exportToExcel: f.exportToExcel !== false,
      showInFilter: type === "dropdown" && !!f.showInFilter,
      isRequired: !!f.isRequired,
      archived: !!f.archived,
      createdAt: f.createdAt || new Date().toISOString()
    };
  }).filter(Boolean);
}

function activeCustomFields(defs, entity) {
  return (defs || []).filter(f => {
    if (!f || f.archived) return false;
    if (entity === "cases") return f.scope === "cases" || f.scope === "both";
    if (entity === "incidents") return f.scope === "incidents" || f.scope === "both";
    return true;
  });
}

function normalizeCustomValues(raw) {
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return {};
  const out = {};
  Object.keys(raw).forEach(k => {
    if (raw[k] == null) out[k] = "";
    else out[k] = String(raw[k]);
  });
  return out;
}

function customFieldDisplayValue(def, value) {
  if (value == null || String(value).trim() === "") return "";
  if (def && def.type === "dropdown") {
    return labelOf(def.options || [], value) || String(value);
  }
  return String(value);
}

function customValuesForPayload(defs, entity, formCustomValues) {
  const active = activeCustomFields(defs, entity);
  const src = normalizeCustomValues(formCustomValues);
  const out = {};
  active.forEach(d => {
    out[d.id] = src[d.id] != null ? String(src[d.id]) : "";
  });
  Object.keys(src).forEach(k => {
    if (out[k] === undefined) out[k] = src[k];
  });
  return out;
}

function customFieldsRequiredOk(defs, entity, formCustomValues) {
  const src = normalizeCustomValues(formCustomValues);
  return activeCustomFields(defs, entity).every(d => {
    if (!d.isRequired) return true;
    return !!(src[d.id] && String(src[d.id]).trim());
  });
}

    if (d.type === "dropdown") {

    out[d.key] = normalizeIncidentDateFieldCfg(src[d.key], d.defaultEnabled);
  });
  return out;
}

function isIncidentDateEnabled(config, key) {
  const c = normalizeIncidentExtraFields(config);

}

function isIncidentDateRequired(config, key) {
  const c = normalizeIncidentExtraFields(config);
  return !!(c[key] && c[key].enabled && c[key].required);
}

function isIncidentDateExcel(config, key) {
  const c = normalizeIncidentExtraFields(config);
  return !!(c[key] && c[key].excel);
}

function shouldShowIncidentDate(config, form, key) {
  if (isIncidentDateEnabled(config, key)) return true;
  const v = form && form[key];
  return v != null && String(v).trim() !== "";
}

function isIncidentExtraEnabled(config, key) {
  const c = normalizeIncidentExtraFields(config);
  return !!(c[key] && c[key].enabled);
}

function isIncidentExtraRequired(config, key) {
  const c = normalizeIncidentExtraFields(config);
  return !!(c[key] && c[key].enabled && c[key].required);
}

function incidentHasExtraValue(rec, def) {
  if (!rec || !def) return false;
  const idVal = rec[def.key];
  if (idVal != null && String(idVal).trim() !== "") return true;
  const lab = rec[def.labelKey];
  return lab != null && String(lab).trim() !== "";
}

function shouldShowIncidentExtra(config, form, def) {
  if (isIncidentExtraEnabled(config, def.key)) return true;
  return incidentHasExtraValue(form, def);
}

function incidentExtraKeysForDisplay(config, records) {
  return INCIDENT_EXTRA_FIELD_DEFS.filter(d => {
    if (isIncidentExtraEnabled(config, d.key)) return true;
    return (records || []).some(r => incidentHasExtraValue(r, d));
  });
}

function incidentExtraKeysForFilter(config, records) {
  return INCIDENT_EXTRA_FIELD_DEFS.filter(d => {
    if (!d.filterable) return false;
    if (isIncidentExtraEnabled(config, d.key)) return true;
    return (records || []).some(r => incidentHasExtraValue(r, d));
  });
}

function incidentExtraKeysForExcel(config, records) {
  const c = normalizeIncidentExtraFields(config);
  const list = records || [];
  return INCIDENT_EXTRA_FIELD_DEFS.filter(d => {
    if (!(c[d.key] && c[d.key].excel)) return false;
    return list.some(r => incidentHasExtraValue(r, d));
  });
}

function customFieldsForExcel(defs, entity, records) {
  const list = records || [];
  return activeCustomFields(defs, entity).filter(f => {
    if (f.exportToExcel === false) return false;
    return list.some(r => {
      const cv = (r && r.customValues) || {};
      const v = cv[f.id];
      return v != null && String(v).trim() !== "";
    });
  });
}

function newRefId(prefix) {
  return (prefix || "ref") + "_" + Math.random().toString(36).slice(2, 10);
}

function labelOf(list, id) {
  if (!id) return "";
  if (!Array.isArray(list)) return String(id);
  const hit = list.find(x => x && x.id === id);
  return hit ? hit.label : String(id);
}

function findInList(list, idOrLabel) {
  if (!idOrLabel || !Array.isArray(list)) return null;
  return list.find(x => x && (x.id === idOrLabel || x.label === idOrLabel)) || null;
}

function ensureIdList(arr, knownMap) {
  knownMap = knownMap || {};
  if (!Array.isArray(arr)) return [];
  const out = [];
  const seenIds = new Set();
  const seenLabels = new Set();
  let defaultAssigned = false;

  arr.forEach(item => {
    let id, label, isDefault = false;
    if (typeof item === "string") {
      label = item.trim();
      if (!label) return;
      id = knownMap[label] || newRefId("ref");
    } else if (item && typeof item === "object") {
      label = String(item.label || item.name || "").trim();
      if (!label) return;
      id = item.id || knownMap[label] || newRefId("ref");
      isDefault = item.isDefault === true;
    } else {
      return;
    }
    if (knownMap[label]) id = knownMap[label];
    if (seenIds.has(id) || seenLabels.has(label)) return;
    seenIds.add(id);
    seenLabels.add(label);
    if (isDefault && defaultAssigned) isDefault = false;
    if (isDefault) defaultAssigned = true;
    out.push({ id, label, isDefault: !!isDefault });
  });
  return out;
}

function getDefaultId(list) {
  if (!Array.isArray(list)) return "";
  const hit = list.find(x => x && x.isDefault);
  return hit ? hit.id : "";
}

function setDefaultInList(list, id) {
  if (!Array.isArray(list)) return [];
  const current = list.find(x => x && x.isDefault);
  const clearing = current && current.id === id;
  return list.map(x => ({
    ...x,
    isDefault: clearing ? false : x.id === id
  }));
}

function ensureEmployees(arr) {
  if (!Array.isArray(arr)) return [];
  return arr.map(e => {
    if (!e || typeof e !== "object") return null;
    const name = String(e.name || "").trim();
    if (!name) return null;
    return {
      id: e.id || newRefId("emp"),
      name,
      role: typeof e.role === "string" ? e.role : ""
    };
  }).filter(Boolean);
}

function resolveRefId(list, value, knownMap) {
  if (!value) return "";
  const found = findInList(list, value);
  if (found) return found.id;
  if (knownMap && knownMap[value]) return knownMap[value];
  return "";
}

function ensureRefOnList(list, label, knownMap) {
  if (!label) return { list, id: "" };
  const existing = findInList(list, label);
  if (existing) return { list, id: existing.id };
  const id = (knownMap && knownMap[label]) || newRefId("ref");
  return { list: [...list, { id, label }], id };
}

function migrateCase(c, ctx) {
  if (!c || typeof c !== "object") return null;

  let { statuses, categories, departments, helpTypes, delayReasons, consultations, auditResults, employees } = ctx;

  const pick = (list, idField, legacyField, knownMap) => {
    if (c[idField] && findInList(list, c[idField])) return { list, id: c[idField] };
    const legacy = c[legacyField] || c[idField] || "";
    if (!legacy) return { list, id: "" };
    const resolved = resolveRefId(list, legacy, knownMap);
    if (resolved) return { list, id: resolved };
    const added = ensureRefOnList(list, String(legacy), knownMap);
    return added;
  };

  let r;
  r = pick(statuses, "statusId", "status", KNOWN_STATUS_IDS);
  statuses = r.list; const statusId = r.id;

  r = pick(categories, "categoryId", "category", null);
  categories = r.list; const categoryId = r.id;

  r = pick(departments, "departmentId", "department", null);
  departments = r.list; const departmentId = r.id;

  r = pick(helpTypes, "helpTypeId", "helpType", null);
  helpTypes = r.list; const helpTypeId = r.id;

  r = pick(delayReasons, "delayReasonId", "delayReason", null);
  delayReasons = r.list; const delayReasonId = r.id;

  let consultationIds = Array.isArray(c.consultationIds) ? [...c.consultationIds] : [];
  if (!consultationIds.length && c.consultationId) consultationIds = [c.consultationId];
  if (!consultationIds.length && c.consultation) {
    String(c.consultation).split(/,\s*/).forEach(part => {
      const p = part.trim();
      if (!p) return;
      const found = findInList(consultations, p);
      if (found) {
        if (!consultationIds.includes(found.id)) consultationIds.push(found.id);
      } else {
        const added = ensureRefOnList(consultations, p, KNOWN_CONSULTATION_IDS);
        consultations = added.list;
        if (!consultationIds.includes(added.id)) consultationIds.push(added.id);
      }
    });
  }
  consultationIds = consultationIds.filter(id => findInList(consultations, id));
  const consultationId = consultationIds[0] || "";

  r = pick(auditResults, "auditResultId", "auditResult", KNOWN_AUDIT_IDS);
  auditResults = r.list; const auditResultId = r.id;

  let operatorId = c.operatorId || "";
  if (operatorId && !employees.find(e => e.id === operatorId)) operatorId = "";
  if (!operatorId && c.operator) {
    const emp = employees.find(e => e.name === c.operator);
    if (emp) operatorId = emp.id;
    else {
      const id = newRefId("emp");
      employees = [...employees, { id, name: String(c.operator), role: "" }];
      operatorId = id;
    }
  }

  ctx.statuses = statuses;
  ctx.categories = categories;
  ctx.departments = departments;
  ctx.helpTypes = helpTypes;
  ctx.delayReasons = delayReasons;
  ctx.consultations = consultations;
  ctx.auditResults = auditResults;
  ctx.employees = employees;

  return applyMarksToRecord({
    ...c,
    statusId,
    categoryId,
    departmentId,
    helpTypeId,
    delayReasonId,
    consultationIds,
    consultationId,
    auditResultId,
    operatorId,
    jira: asIdString(c.jira),
    personalId: sanitizePersonalId(c.personalId),
    caseNo: asIdString(c.caseNo),

    status: labelOf(statuses, statusId),
    category: labelOf(categories, categoryId),
    department: labelOf(departments, departmentId),
    helpType: labelOf(helpTypes, helpTypeId),
    delayReason: labelOf(delayReasons, delayReasonId),
    consultation: labelsOfIds(consultations, consultationIds),
    auditResult: labelOf(auditResults, auditResultId),
    operator: (employees.find(e => e.id === operatorId) || {}).name || "",
    customValues: normalizeCustomValues(c.customValues)
  });
}

function migrateIncident(inc, ctx) {
  if (!inc || typeof inc !== "object") return null;
  let { incidentTypes, employees, consultations, categories, departments, helpTypes, delayReasons, statuses, auditResults } = ctx;
  categories = categories || [];
  departments = departments || [];
  helpTypes = helpTypes || [];
  delayReasons = delayReasons || [];
  statuses = statuses || [];
  auditResults = auditResults || [];

  let incidentTypeId = inc.incidentTypeId || "";
  if (incidentTypeId && !findInList(incidentTypes, incidentTypeId)) incidentTypeId = "";
  if (!incidentTypeId && inc.incidentType) {
    const found = findInList(incidentTypes, inc.incidentType);
    if (found) incidentTypeId = found.id;
    else {
      const id = newRefId("ref");
      incidentTypes = [...incidentTypes, { id, label: String(inc.incidentType) }];
      incidentTypeId = id;
    }
  }

  let consultationIds = Array.isArray(inc.consultationIds) ? [...inc.consultationIds] : [];
  if (!consultationIds.length && inc.consultationId) consultationIds = [inc.consultationId];
  if (!consultationIds.length && inc.consultation) {
    String(inc.consultation).split(/,\s*/).forEach(part => {
      const p = part.trim();
      if (!p) return;
      const found = findInList(consultations, p);
      if (found) {
        if (!consultationIds.includes(found.id)) consultationIds.push(found.id);
      } else {
        const added = ensureRefOnList(consultations, p, KNOWN_CONSULTATION_IDS);
        consultations = added.list;
        if (!consultationIds.includes(added.id)) consultationIds.push(added.id);
      }
    });
  }
  consultationIds = consultationIds.filter(id => findInList(consultations, id));
  const consultationId = consultationIds[0] || "";

  let employeeId = inc.employeeId || "";
  if (employeeId && !employees.find(e => e.id === employeeId)) employeeId = "";
  if (!employeeId && inc.employee) {
    const emp = employees.find(e => e.name === inc.employee);
    if (emp) employeeId = emp.id;
    else {
      const id = newRefId("emp");
      employees = [...employees, { id, name: String(inc.employee), role: "" }];
      employeeId = id;
    }
  }

  const pickExtra = (list, idKey, labelKey) => {
    let id = inc[idKey] || "";
    if (id && !findInList(list, id)) id = "";
    if (!id && inc[labelKey]) {
      const found = findInList(list, inc[labelKey]);
      if (found) id = found.id;
    }
    return { id, label: labelOf(list, id) };
  };
  const cat = pickExtra(categories, "categoryId", "category");
  const dep = pickExtra(departments, "departmentId", "department");
  const help = pickExtra(helpTypes, "helpTypeId", "helpType");
  const delay = pickExtra(delayReasons, "delayReasonId", "delayReason");
  const st = pickExtra(statuses, "statusId", "status");
  const ar = pickExtra(auditResults, "auditResultId", "auditResult");

  ctx.incidentTypes = incidentTypes;
  ctx.consultations = consultations;
  ctx.employees = employees;
  ctx.categories = categories;
  ctx.departments = departments;
  ctx.helpTypes = helpTypes;
  ctx.delayReasons = delayReasons;
  ctx.statuses = statuses;
  ctx.auditResults = auditResults;

  return applyMarksToRecord({
    ...inc,
    incidentTypeId,
    consultationIds,
    consultationId,
    employeeId,
    jira: asIdString(inc.jira),
    personalId: sanitizePersonalId(inc.personalId),
    caseNo: asIdString(inc.caseNo),
    incidentDate: inc.incidentDate ? String(inc.incidentDate).slice(0, 10) : "",
    auditDate: inc.auditDate ? String(inc.auditDate).slice(0, 10) : "",
    categoryId: cat.id,
    departmentId: dep.id,
    helpTypeId: help.id,
    delayReasonId: delay.id,
    statusId: st.id,
    auditResultId: ar.id,
    incidentType: labelOf(incidentTypes, incidentTypeId),
    consultation: labelsOfIds(consultations, consultationIds),
    employee: (employees.find(e => e.id === employeeId) || {}).name || "",
    category: cat.label,
    department: dep.label,
    helpType: help.label,
    delayReason: delay.label,
    status: st.label,
    auditResult: ar.label,
    customValues: normalizeCustomValues(inc.customValues)
  });
}

function normalizeData(raw) {
  const safeArr = (v, fallback) => Array.isArray(v) ? v : fallback;
  const safeStr = (v) => typeof v === "string" ? v : "";

  const ctx = {
    categories: ensureIdList(safeArr(raw?.categories, [])),
    departments: ensureIdList(safeArr(raw?.departments, [])),
    helpTypes: ensureIdList(safeArr(raw?.helpTypes, [])),
    delayReasons: ensureIdList(safeArr(raw?.delayReasons, [])),

    consultations: ensureIdList(safeArr(raw?.consultations, []), KNOWN_CONSULTATION_IDS),
    statuses: ensureIdList(safeArr(raw?.statuses, []), KNOWN_STATUS_IDS),
    auditResults: ensureIdList(safeArr(raw?.auditResults, []), KNOWN_AUDIT_IDS),
    incidentTypes: ensureIdList(safeArr(raw?.incidentTypes, [])),
    employees: ensureEmployees(safeArr(raw?.employees, []))
  };

  const cases = safeArr(raw?.cases, []).map(c => migrateCase(c, ctx)).filter(Boolean);
  const incidents = safeArr(raw?.incidents, []).map(i => migrateIncident(i, ctx)).filter(Boolean);

  return {
    categories: ctx.categories,
    departments: ctx.departments,
    helpTypes: ctx.helpTypes,
    delayReasons: ctx.delayReasons,
    consultations: ctx.consultations,
    statuses: ctx.statuses,
    auditResults: ctx.auditResults,
    incidentTypes: ctx.incidentTypes,
    employees: ctx.employees,
    cases,
    incidents,
    responsibleName: safeStr(raw?.responsibleName),
    responsiblePosition: safeStr(raw?.responsiblePosition),
    idFieldsConfig: normalizeIdFieldsConfig(raw?.idFieldsConfig),
    extraNoteConfig: normalizeExtraNoteConfig(raw?.extraNoteConfig),
    incidentExtraFields: normalizeIncidentExtraFields(raw?.incidentExtraFields),
    customFieldDefs: normalizeCustomFieldDefs(raw?.customFieldDefs),
    consultationExcelExport: normalizeConsultationExcelExport(raw?.consultationExcelExport)
  };
}

function normalizeConsultationExcelExport(raw) {
  if (raw === "cases" || raw === "incidents" || raw === "both") return raw;
  return null;
}

function shouldExportConsultation(mode, entity) {
  const m = normalizeConsultationExcelExport(mode);
  if (!m) return false;
  if (m === "both") return true;
  return m === entity;
}

function resyncLabels(data) {
  const cases = (data.cases || []).map(c => ({
    ...c,
    status: labelOf(data.statuses, c.statusId),
    category: labelOf(data.categories, c.categoryId),
    department: labelOf(data.departments, c.departmentId),
    helpType: labelOf(data.helpTypes, c.helpTypeId),
    delayReason: labelOf(data.delayReasons, c.delayReasonId),
    consultationIds: Array.isArray(c.consultationIds) ? c.consultationIds : (c.consultationId ? [c.consultationId] : []),
    consultation: labelsOfIds(data.consultations, Array.isArray(c.consultationIds) ? c.consultationIds : (c.consultationId ? [c.consultationId] : [])),
    auditResult: labelOf(data.auditResults, c.auditResultId),
    operator: (data.employees.find(e => e.id === c.operatorId) || {}).name || ""
  }));
  const incidents = (data.incidents || []).map(i => ({
    ...i,
    consultationIds: Array.isArray(i.consultationIds) ? i.consultationIds : (i.consultationId ? [i.consultationId] : []),
    incidentType: labelOf(data.incidentTypes, i.incidentTypeId),
    consultation: labelsOfIds(data.consultations, Array.isArray(i.consultationIds) ? i.consultationIds : (i.consultationId ? [i.consultationId] : [])),
    employee: (data.employees.find(e => e.id === i.employeeId) || {}).name || ""
  }));
  return { ...data, cases, incidents };
}


function normalizeMarks(rec) {
  if (!rec || typeof rec !== "object") {
    return { personalStar: false, personalStarNote: "", critical: false, criticalNote: "" };
  }
  const personalStar = !!(rec.personalStar || rec.protocolCompliant);
  const critical = !!rec.critical;
  return {
    personalStar,
    personalStarNote: personalStar ? String(rec.personalStarNote || "").trim() : "",
    critical,
    criticalNote: critical ? String(rec.criticalNote || "").trim() : ""
  };
}

function applyMarksToRecord(rec) {
  const m = normalizeMarks(rec);
  const out = { ...rec, ...m };
  delete out.protocolCompliant;
  return out;
}

function isStatusClosed(c) {
  return c.statusId === "st_closed" || c.status === "დახურულია" || c.status === "დახურული";
}

function statusColorFor(nameOrId) {
  if (nameOrId && STATUS_COLOR[nameOrId]) return STATUS_COLOR[nameOrId];
  const id = KNOWN_STATUS_IDS[nameOrId];
  if (id && STATUS_COLOR[id]) return STATUS_COLOR[id];
  return { fg: "#555", bg: "#eee", ring: "#999" };
}

function auditColorFor(nameOrId) {
  if (nameOrId && AUDIT_RESULT_COLOR[nameOrId]) return AUDIT_RESULT_COLOR[nameOrId];
  const id = KNOWN_AUDIT_IDS[nameOrId];
  if (id && AUDIT_RESULT_COLOR[id]) return AUDIT_RESULT_COLOR[id];
  return { fg: "#555", bg: "#eee", ring: "#999" };
}

function tallyById(list, idKey, labelList, emptyLabel) {
  const map = {};
  const labelMap = {};
  list.forEach(item => {
    const id = item[idKey] || "";
    const label = id
      ? (labelOf(labelList, id) || id)
      : (emptyLabel || "—");
    const key = id || "__empty__";
    map[key] = (map[key] || 0) + 1;
    labelMap[key] = label;
  });
  return Object.keys(map)
    .map(k => [labelMap[k], map[k]])
    .sort((a, b) => b[1] - a[1]);
}

function chartDrawDonut(rows, canvasW, canvasH, titleText, palette) {
  palette = palette || TALLY_PALETTE;
  const canvas = document.createElement("canvas");
  canvas.width = canvasW;
  canvas.height = canvasH;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvasW, canvasH);
  ctx.font = "bold 15px sans-serif";
  ctx.fillStyle = "#16213E";
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  ctx.fillText(titleText, 4, 4);
  const topPad = 34;
  const sum = rows.reduce((s, [, v]) => s + v, 0) || 1;
  const donutSize = Math.min(canvasH - topPad - 12, 160);
  const cx = donutSize / 2 + 16, cy = topPad + (canvasH - topPad) / 2, r = donutSize / 2 - 4;
  let start = -Math.PI / 2;
  rows.forEach(([, value], i) => {
    const angle = value / sum * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, start + angle);
    ctx.closePath();
    ctx.fillStyle = palette[i % palette.length];
    ctx.fill();
    start += angle;
  });
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.55, 0, Math.PI * 2);
  ctx.fillStyle = "#ffffff";
  ctx.fill();
  ctx.fillStyle = "#16213E";
  ctx.font = "bold 20px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(String(sum), cx, cy - 8);
  ctx.font = "10px sans-serif";
  ctx.fillStyle = "#8A8672";
  ctx.fillText("სულ", cx, cy + 12);
  const lx = donutSize + 40;
  const availW = canvasW - lx - 60;
  const lineH = Math.min(30, (canvasH - topPad - 8) / Math.max(rows.length, 1));
  rows.forEach(([label, value], i) => {
    const ly = topPad + i * lineH + lineH / 2;
    ctx.fillStyle = palette[i % palette.length];
    ctx.fillRect(lx, ly - 7, 14, 14);
    ctx.font = "13px sans-serif";
    let display = label;
    while (ctx.measureText(display).width > availW && display.length > 4) {
      display = display.slice(0, -2);
    }
    if (display !== label) display = display.replace(/\s+$/, "") + "…";
    ctx.fillStyle = "#3A3A32";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText(display, lx + 22, ly);
    ctx.fillStyle = "#16213E";
    ctx.font = "bold 13px sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(String(value), canvasW - 10, ly);
  });
  return canvas.toDataURL("image/png");
}

function chartDrawBar(rows, width, height, titleText, palette) {
  palette = palette || TALLY_PALETTE;
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, width, height);
  ctx.font = "bold 15px sans-serif";
  ctx.fillStyle = "#16213E";
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  ctx.fillText(titleText, 4, 4);
  const topPad = 34;
  const max = Math.max(...rows.map(([, v]) => v), 1);
  ctx.font = "13px sans-serif";
  let widest = 0;
  rows.forEach(([label]) => {
    const w = ctx.measureText(label).width;
    if (w > widest) widest = w;
  });
  const leftPad = Math.min(Math.max(widest + 26, 120), width * 0.42);
  const rightPad = 50;
  const n = Math.max(rows.length, 1);
  const barH = Math.min(26, Math.floor((height - topPad - 10) / n) - 8);
  rows.forEach(([label, value], i) => {
    const y = topPad + i * (barH + 8);
    let display = label;
    let font = "13px sans-serif";
    ctx.font = font;
    if (ctx.measureText(display).width > leftPad - 14) {
      font = "11px sans-serif";
      ctx.font = font;
    }
    ctx.fillStyle = "#3A3A32";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillText(display, leftPad - 10, y + barH / 2);
    const barW = (width - leftPad - rightPad) * value / max;
    ctx.fillStyle = palette[i % palette.length];
    ctx.fillRect(leftPad, y, Math.max(barW, 2), barH);
    ctx.fillStyle = "#16213E";
    ctx.font = "bold 13px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(String(value), leftPad + barW + 8, y + barH / 2);
  });
  return canvas.toDataURL("image/png");
}

const uid = () => Math.random().toString(36).slice(2, 10);

function isoWeek(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + "T00:00:00");
  if (isNaN(d)) return null;
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + 4 - (d.getDay() || 7));
  const yearStart = new Date(d.getFullYear(), 0, 1);
  return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
}

function monthOf(dateStr) {
  if (!dateStr) return null;
  return Number(dateStr.slice(5, 7));
}

function quarterOf(dateStr) {
  const m = monthOf(dateStr);
  return m ? Math.ceil(m / 3) : null;
}

function yearOf(dateStr) {
  if (!dateStr) return null;
  return Number(dateStr.slice(0, 4));
}

/** Dynamic filter years: unique years from date strings ∪ current calendar year, ascending. */
function buildFilterYears(dateStrList) {
  const s = new Set();
  (dateStrList || []).forEach(d => {
    const y = yearOf(d);
    if (y) s.add(Number(y));
  });
  s.add(new Date().getFullYear());
  return Array.from(s).sort((a, b) => a - b);
}

function formatDate(dateStr) {
  if (!dateStr) return "—";
  const [y, m, d] = dateStr.split("-");
  return `${d}.${m}.${y}`;
}

function formatDateTime(iso) {
  if (!iso) return "—";
  try {
    const d = new Date(iso);
    return d.toLocaleString("ka-GE", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
  } catch {
    return "—";
  }
}

const BACKUP_REMINDER_DAYS = 7; 
const BACKUP_REMINDER_HOUR = 17;
const BACKUP_REMINDER_MINUTE = 0; 
const BACKUP_REMINDER_DATE_KEY = "qa_last_backup_reminder_date";

function daysSince(iso) {
  if (!iso) return null;
  const diffMs = Date.now() - new Date(iso).getTime();
  return Math.floor(diffMs / (1000 * 60 * 60 * 24));
}

function toLocalDateISO(d) {
  const x = d instanceof Date ? d : new Date(d);
  if (Number.isNaN(x.getTime())) return "";
  return `${x.getFullYear()}-${pad2(x.getMonth() + 1)}-${pad2(x.getDate())}`;
}

function isWeekdayLocal(now) {
  const day = (now || new Date()).getDay(); 
  return day >= 1 && day <= 5;
}

function isAtOrAfterBackupReminderTime(now) {
  const n = now || new Date();
  return (n.getHours() * 60 + n.getMinutes()) >= (BACKUP_REMINDER_HOUR * 60 + BACKUP_REMINDER_MINUTE);
}

function backedUpToday(lastBackupAt, now) {
  if (!lastBackupAt) return false;
  const today = toLocalDateISO(now || new Date());
  const backupDay = toLocalDateISO(new Date(lastBackupAt));
  return !!today && backupDay === today;
}

function previousWeekdayDate(now) {
  const cursor = new Date(now || new Date());
  cursor.setHours(0, 0, 0, 0);
  cursor.setDate(cursor.getDate() - 1);
  for (let i = 0; i < 8; i++) {
    const day = cursor.getDay();
    if (day >= 1 && day <= 5) return cursor;
    cursor.setDate(cursor.getDate() - 1);
  }
  return cursor;
}

/**
 * Calendar-day backup coverage (Mon–Fri only; weekends never show).
 * - After 17:00 today: show if no backup today.
 * - Before 17:00: show only if previous weekday had zero backups
 *   (any backup that calendar day fully covers it, any hour).
 */
function shouldShowBackupReminder(lastBackupAt, now) {
  const n = now || new Date();
  if (!isWeekdayLocal(n)) return false;
  if (backedUpToday(lastBackupAt, n)) return false;

  if (isAtOrAfterBackupReminderTime(n)) return true;

  if (!lastBackupAt) return true;
  const backupTime = new Date(lastBackupAt);
  if (Number.isNaN(backupTime.getTime())) return true;
  const backupDay = toLocalDateISO(backupTime);
  const prevWorkday = toLocalDateISO(previousWeekdayDate(n));

  return backupDay < prevWorkday;
}

function getLastBackupReminderDate() {
  try { return localStorage.getItem(BACKUP_REMINDER_DATE_KEY) || ""; }
  catch (_) { return ""; }
}

function markBackupReminderShownToday(now) {
  try { localStorage.setItem(BACKUP_REMINDER_DATE_KEY, toLocalDateISO(now || new Date())); }
  catch (_) {}
}

/** @deprecated use shouldShowBackupReminder — kept for any residual callers */
function isBackupStale(lastBackupAt) {
  return shouldShowBackupReminder(lastBackupAt);
}

/*   SHARED DOCUMENT HEADER (used by every PDF & Excel export)      */
/*  Formats the generation date/time as DD/MM/YYYY + HH:MM, and       */
/*  resolves the responsible-person text from Settings, with a        */
/*  clear fallback when it hasn't been filled in.                     */
/* ================================================================== */

function pad2(n) { return String(n).padStart(2, "0"); }

function formatDocDate(d) {
  d = d || new Date();
  return `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()}`;
}

function formatDocTime(d) {
  d = d || new Date();
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

function getResponsiblePersonLines(data) {
  const name = (data?.responsibleName || "").trim();
  const position = (data?.responsiblePosition || "").trim();
  if (!name) {
    return { primary: "პასუხისმგებელი პირი მითითებული არ არის", secondary: "" };
  }
  return { primary: name, secondary: position };
}

function tally(list, key, emptyLabel) {
  const empty = emptyLabel !== undefined ? emptyLabel : "შეფერხების გარეშე ✓";
  const map = {};
  list.forEach(item => {
    const raw = item[key];
    const v = (raw !== undefined && raw !== null && String(raw).trim() !== "")
      ? String(raw)
      : empty;
    map[v] = (map[v] || 0) + 1;
  });
  return Object.entries(map).sort((a, b) => b[1] - a[1]);
}

function applyFilters(cases, f) {
  return cases.filter(c => {
    const d = c.incidentDate;
    if (f.date && d !== f.date) return false;
    if (f.week && String(isoWeek(d)) !== String(f.week)) return false;
    if (f.month && String(monthOf(d)) !== String(f.month)) return false;
    if (f.quarter && String(quarterOf(d)) !== String(f.quarter)) return false;
    if (f.year && String(yearOf(d)) !== String(f.year)) return false;
    return true;
  });
}

function labelsOfIds(list, ids) {
  if (!Array.isArray(ids) || !ids.length) return "";
  return ids.map(id => labelOf(list, id)).filter(Boolean).join(", ");
}

function resolveConsultationIds(rec, consultations) {
  const list = consultations || [];
  const out = [];
  const push = (idOrLabel) => {
    if (!idOrLabel) return;
    const found = findInList(list, idOrLabel);
    if (found && !out.includes(found.id)) out.push(found.id);
  };
  if (Array.isArray(rec.consultationIds)) {
    rec.consultationIds.forEach(push);
  }
  if (rec.consultationId) push(rec.consultationId);
  if (rec.consultation && !out.length) {
    String(rec.consultation).split(/,\s*/).forEach(p => push(p.trim()));
  }
  return out;
}

function tallyConsultationMulti(records, consultations, emptyLabel) {
  const empty = emptyLabel || "ადრესატი მითითებული არ არის";
  const map = {};
  const bump = (lab) => {
    const t = (lab || "").trim();
    if (!t) return;
    map[t] = (map[t] || 0) + 1;
  };
  (records || []).forEach(item => {
    const ids = Array.isArray(item.consultationIds) ? item.consultationIds.filter(Boolean) : [];
    const denorm = (item.consultation || "").trim();
    if (ids.length && consultations && consultations.length) {
      let resolved = 0;
      ids.forEach(id => {
        const lab = labelOf(consultations, id);
        if (lab && lab !== id) {
          bump(lab);
          resolved++;
        }
      });
      if (resolved > 0) return;
 
    }
    if (denorm) {
      denorm.split(/,\s*/).forEach(bump);
      return;
    }
    if (ids.length) {
  
      const readable = ids.filter(id => !/^con_/i.test(String(id)));
      if (readable.length) readable.forEach(id => bump(String(id)));
      else bump(empty);
      return;
    }
    bump(empty);
  });
  return Object.entries(map).sort((a, b) => b[1] - a[1]);
}

/* ================================================================== */
/*  CHANGE PASSWORD MODAL                                          */
/*  Safe flow: re-verify current password against storage (independent */
/*  of the already-unlocked session) -> fresh salt + v2 credentials ->  */
/*  re-encrypt the in-memory data with the new key -> atomic dual-store */
/*  write -> only then hand the new key back to the caller. Any        */
/*  failure aborts before anything is written, so there is no path     */
/*  that can leave the account half-changed or the data unreadable.    */
/* ================================================================== */

function ChangePasswordModal({ getLatestData, onPrepare, onSuccess, onClose }) {
  const [currentPassword, setCurrentPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [showPw, setShowPw] = useState(false);
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const strength = CryptoModule.checkPasswordStrength(newPassword);
  const strengthLabel = ["", "სუსტი", "საშუალო", "ძლიერი"][strength];
  const strengthClass = ["", "pwd-weak", "pwd-medium", "pwd-strong"][strength];

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError("");

    if (!currentPassword) {
      setError("შეიყვანეთ მიმდინარე პაროლი");
      return;
    }
    if (newPassword.length < 8) {
      setError("ახალი პაროლი უნდა იყოს მინიმუმ 8 სიმბოლო");
      return;
    }
    if (newPassword !== confirmPassword) {
      setError("ახალი პაროლები არ ემთხვევა");
      return;
    }
    if (strength < 2) {
      setError("ახალი პაროლი ძალიან სუსტია. გამოიყენეთ დიდი/პატარა ასოები და ციფრები.");
      return;
    }
    if (newPassword === currentPassword) {
      setError("ახალი პაროლი არ უნდა ემთხვეოდეს მიმდინარეს");
      return;
    }

    setLoading(true);

    try {

      if (typeof onPrepare === "function") {
        await onPrepare();
      }

      const user = await SecureStorage.getUser();
      if (!user) {
        setError("მომხმარებელი ვერ მოიძებნა");
        setLoading(false);
        return;
      }

      let currentValid = false;
      if (user.scheme === 'v2') {
        const key = await CryptoModule.verifyAndDeriveV2(currentPassword, user.passwordHash, user.salt, user.iterations);
        currentValid = !!key;
      } else {
        currentValid = await CryptoModule.verifyPassword(currentPassword, user.passwordHash, user.salt, user.iterations);
      }

      if (!currentValid) {
        setError(" მიმდინარე პაროლი არასწორია");
        setLoading(false);
        return;
      }

      const { hash, salt, iterations, scheme, encryptionKey: newKey } = await CryptoModule.createCredentialsV2(newPassword);

      const latestData = typeof getLatestData === "function" ? getLatestData() : null;
      if (!latestData) {
        setError("მონაცემები ვერ მოიძებნა სცადეთ თავიდან");
        setLoading(false);
        return;
      }
      const newEncryptedPayload = await CryptoModule.encryptData(latestData, newKey);

      await SecureStorage.saveUserAndData(
        {
          ...user,
          passwordHash: hash,
          salt: salt,
          iterations: iterations,
          scheme: scheme
        },
        newEncryptedPayload
      );

      await onSuccess(newKey);
      setLoading(false);
    } catch (err) {
      setError("პაროლის შეცვლა ვერ მოხერხდა: " + (err.message || err));
      setLoading(false);
    }
  };

  return React.createElement(Modal, { title: "პაროლის შეცვლა", onClose: onClose },
    React.createElement("form", { onSubmit: handleSubmit, className: "flex flex-col gap-4" },
      React.createElement("div", {
        className: "bg-[#E6EBF4] border border-[#C4CCE0] rounded-md px-3 py-2 text-xs text-[#2A4270] flex gap-2"
      },
        React.createElement(Icon, { name: "info", size: 14, className: "shrink-0 mt-0.5" }),
        React.createElement("span", null, "თქვენი მონაცემები ავტომატურად გადაიშიფრება ახალი პაროლით.")
      ),

      React.createElement(Field, { label: "მიმდინარე პაროლი" },
        React.createElement("input", {
          type: showPw ? "text" : "password",
          className: inputCls,
          value: currentPassword,
          autoFocus: true,
          onChange: e => { setError(""); setCurrentPassword(e.target.value); }
        })
      ),

      React.createElement(Field, {
        label: "ახალი პაროლი",
        hint: "მინიმუმ 8 სიმბოლო, სასურველია დიდი/პატარა ასოები და ციფრები"
      },
        React.createElement("input", {
          type: showPw ? "text" : "password",
          className: inputCls,
          value: newPassword,
          onChange: e => { setError(""); setNewPassword(e.target.value); }
        }),
        newPassword && React.createElement("div", { className: "mt-2" },
          React.createElement("div", { className: "flex justify-between text-xs mb-1" },
            React.createElement("span", { className: "text-[#9A967F]" }, "პაროლის სიძლიერე:"),
            React.createElement("span", {
              className: strength === 3 ? "text-[#1F6F50]" : strength === 2 ? "text-[#B8860B]" : "text-[#C0392B]",
              style: { fontWeight: 600 }
            }, strengthLabel)
          ),
          React.createElement("div", { className: "h-1 bg-[#EFEDE2] rounded-full overflow-hidden" },
            React.createElement("div", { className: `pwd-strength ${strengthClass}` })
          )
        )
      ),

      React.createElement(Field, { label: "ახალი პაროლის დადასტურება" },
        React.createElement("input", {
          type: showPw ? "text" : "password",
          className: inputCls,
          value: confirmPassword,
          onChange: e => { setError(""); setConfirmPassword(e.target.value); }
        })
      ),

      React.createElement("label", { className: "flex items-center gap-2 text-xs text-[#8A8672] cursor-pointer select-none" },
        React.createElement("input", {
          type: "checkbox",
          checked: showPw,
          onChange: e => setShowPw(e.target.checked),
          className: "w-3.5 h-3.5 accent-[#B8860B]"
        }),
        "პაროლების ჩვენება"
      ),

      error && React.createElement("div", {
        className: "bg-[#F6E4E1] border border-[#F0999B] rounded-md px-3 py-2 text-xs text-[#C0392B] flex gap-2"
      },
        React.createElement(Icon, { name: "error", size: 14, className: "shrink-0" }),
        React.createElement("span", null, error)
      ),

      React.createElement("div", { className: "flex justify-end gap-2 mt-2" },
        React.createElement("button", {
          type: "button",
          onClick: onClose,
          disabled: loading,
          className: "px-4 py-2 rounded-md text-sm font-semibold text-[#6B6A5C] hover:bg-[#EFEDE2] disabled:opacity-40"
        }, "გაუქმება"),
        React.createElement("button", {
          type: "submit",
          disabled: loading,
          className: "px-4 py-2 rounded-md text-sm font-semibold bg-[#16213E] text-white hover:bg-[#223057] disabled:opacity-40 flex items-center gap-1.5"
        },
          loading
            ? React.createElement(Icon, { name: "progress_activity", size: 15, className: "animate-pulse" })
            : React.createElement(Icon, { name: "lock_reset", size: 15 }),
          loading ? "იცვლება..." : "პაროლის შეცვლა"
        )
      )
    )
  );
}

function LoginPage({ userEmail, onLogin, onReset }) {
  const [password, setPassword] = useState("");
  const [showPw, setShowPw] = useState(false);
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  
  const emailTag = useMemo(() => {
    let h = 5381;
    const s = String(userEmail || "");
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  }, [userEmail]);
  const LOCKOUT_KEY = `qa_lockout_${emailTag}`;
  const ATTEMPTS_KEY = `qa_attempts_${emailTag}`;
  
  const [loginAttempts, setLoginAttempts] = useState(() => {
    try {
      return parseInt(localStorage.getItem(ATTEMPTS_KEY) || "0", 10);
    } catch {
      return 0;
    }
  });
  
  const [lockedUntil, setLockedUntil] = useState(() => {
    try {
      const stored = localStorage.getItem(LOCKOUT_KEY);
      if (stored) {
        const timestamp = parseInt(stored, 10);
        if (timestamp > Date.now()) {
          return timestamp;
        } else {
          localStorage.removeItem(LOCKOUT_KEY);
          localStorage.removeItem(ATTEMPTS_KEY);
          return null;
        }
      }
    } catch {
      return null;
    }
    return null;
  });
  
  const [remainingSeconds, setRemainingSeconds] = useState(0);
  
  useEffect(() => {
    if (lockedUntil) {
      const interval = setInterval(() => {
        const remaining = Math.ceil((lockedUntil - Date.now()) / 1000);
        
        if (remaining <= 0) {

          setLockedUntil(null);
          setLoginAttempts(0);
          setRemainingSeconds(0);
          setError("");
          
          localStorage.removeItem(LOCKOUT_KEY);
          localStorage.removeItem(ATTEMPTS_KEY);
        } else {
          setRemainingSeconds(remaining);
        }
      }, 1000);
      
      return () => clearInterval(interval);
    }
  }, [lockedUntil, LOCKOUT_KEY, ATTEMPTS_KEY]);
  
  const handleSubmit = async (e) => {
    e.preventDefault();
    e.stopPropagation();
    setError("");
    
    if (lockedUntil && Date.now() < lockedUntil) {
      const mins = Math.floor(remainingSeconds / 60);
      const secs = remainingSeconds % 60;
      setError(`🔒 ბლოკირებულია უსაფრთხოების გამო. დარჩენილია: ${mins}:${String(secs).padStart(2, '0')}`);
      return;
    }
    
    setLoading(true);
    
    try {
      const user = await SecureStorage.getUser();
      if (!user) {
        setError("მომხმარებელი ვერ მოიძებნა");
        setLoading(false);
        return;
      }

      const encrypted = await SecureStorage.getEncryptedData();
      if (!encrypted) {
        setError("დაშიფრული მონაცემები ვერ მოიძებნა");
        setLoading(false);
        return;
      }

      let encryptionKey = null;
      if (user.scheme === 'v2') {
        encryptionKey = await CryptoModule.verifyAndDeriveV2(password, user.passwordHash, user.salt, user.iterations);
      } else {
        const isValidLegacy = await CryptoModule.verifyPassword(password, user.passwordHash, user.salt, user.iterations);
        if (isValidLegacy) {
          encryptionKey = await CryptoModule.deriveKey(password, new Uint8Array(user.salt), user.iterations);
        }
      }

      if (!encryptionKey) {
        const newAttempts = loginAttempts + 1;
        setLoginAttempts(newAttempts);
        

        localStorage.setItem(ATTEMPTS_KEY, String(newAttempts));
        
        if (newAttempts >= 5) {
          const lockoutTime = 5 * 60 * 1000; 
          const lockUntil = Date.now() + lockoutTime;
          
          setLockedUntil(lockUntil);
          setRemainingSeconds(300);
          
          localStorage.setItem(LOCKOUT_KEY, String(lockUntil));
          
          setError(`⚠️ 5 წარუმატებელი მცდელობა. ბლოკირებულია 5:00 წუთით.`);
        } else {
          setError(` პაროლი არასწორია (${newAttempts}/5 მცდელობა)`);
        }
        setLoading(false);
        return;
      }
      
      setLoginAttempts(0);
      setLockedUntil(null);
      setRemainingSeconds(0);
      localStorage.removeItem(LOCKOUT_KEY);
      localStorage.removeItem(ATTEMPTS_KEY);

      const decryptedData = await CryptoModule.decryptData(
        encrypted.encrypted,
        encrypted.iv,
        encryptionKey
      );

      if (user.scheme !== 'v2') {
        try {
          const migrated = await CryptoModule.createCredentialsV2(password);
          const newEncryptedPayload = await CryptoModule.encryptData(decryptedData, migrated.encryptionKey);
          await SecureStorage.saveUserAndData(
            {
              ...user,
              passwordHash: migrated.hash,
              salt: migrated.salt,
              iterations: migrated.iterations,
              scheme: migrated.scheme
            },
            newEncryptedPayload
          );
          encryptionKey = migrated.encryptionKey;

        } catch (migrationErr) {
          console.warn('[security] v2 migration skipped, will retry next login:', migrationErr);
        }
      }

      onLogin(encryptionKey, normalizeData(decryptedData), user.email);
      
    } catch (err) {
      setError(err.message || "შესვლა ვერ მოხერხდა");
      setLoading(false);
    }
  };
  
  return React.createElement("div", { className: "qa-root min-h-screen flex items-center justify-center bg-[#F3F1E7] p-6" },
    React.createElement(FontStyles, null),
    React.createElement("form", {
      onSubmit: handleSubmit,
      noValidate: true,
      className: "qa-fade-up w-full max-w-sm bg-white rounded-xl border border-[#E4E1D6] shadow-xl p-8 flex flex-col gap-5"
    },
      React.createElement("div", { className: "flex flex-col items-center gap-2 mb-1" },
        React.createElement("div", { className: "w-12 h-12 rounded-lg bg-[#16213E] flex items-center justify-center" },
          React.createElement(Icon, { name: "approval", size: 22, className: "text-[#B8860B]" })
        ),
        React.createElement("h1", { className: "qa-serif text-xl font-bold text-[#16213E]" }, "QA აუდიტის პლათფორმა"),
        React.createElement("p", { className: "text-xs text-[#9A967F]" }, "სისტემაში შესვლა")
      ),
      
      React.createElement(Field, { label: "ელფოსტა" },
        React.createElement("input", {
          type: "email",
          disabled: true,
          className: inputCls + " opacity-60",
          value: userEmail,
          readOnly: true
        })
      ),
      
      React.createElement(Field, { label: "პაროლი" },
        React.createElement("div", { className: "relative" },
          React.createElement("input", {
            type: showPw ? "text" : "password",
            required: true,
            autoFocus: true,
            disabled: lockedUntil && Date.now() < lockedUntil,
            className: inputCls + " pr-9",
            value: password,
            onChange: e => { setError(""); setPassword(e.target.value); }
          }),
          React.createElement("button", {
            type: "button",
            onClick: () => setShowPw(!showPw),
            className: "absolute right-2 top-1/2 -translate-y-1/2 text-[#9A967F] hover:text-[#16213E]",
            tabIndex: -1
          }, showPw
            ? React.createElement(Icon, { name: "visibility_off", size: 15 })
            : React.createElement(Icon, { name: "visibility", size: 15 })
          )
        )
      ),
      
      lockedUntil && remainingSeconds > 0 && React.createElement("div", {
        className: "bg-[#F6E4E1] border border-[#F0999B] rounded-md px-4 py-3 text-center"
      },
        React.createElement("div", { className: "text-3xl font-bold text-[#C0392B] qa-mono mb-1" },
          `${Math.floor(remainingSeconds / 60)}:${String(remainingSeconds % 60).padStart(2, '0')}`
        ),
        React.createElement("p", { className: "text-xs text-[#C0392B]" }, "ბლოკირებულია უსაფრთხოების მიზეზით"),
      ),
      
      error && React.createElement("div", {
        className: "bg-[#F6E4E1] border border-[#F0999B] rounded-md px-3 py-2 text-xs text-[#C0392B] flex gap-2"
      },
        React.createElement(Icon, { name: "error", size: 14, className: "shrink-0" }),
        React.createElement("span", null, error)
      ),
      
      React.createElement("button", {
        type: "submit",
        disabled: loading || (lockedUntil && Date.now() < lockedUntil),
        className: "mt-1 px-4 py-2.5 rounded-md text-sm font-semibold bg-[#16213E] text-white hover:bg-[#223057] disabled:opacity-40 flex items-center justify-center gap-2"
      },
        loading && React.createElement(Icon, { name: "progress_activity", size: 14, className: "animate-pulse" }),
        loading ? "შემოწმება..." : "შესვლა"
      ),
      
    )
  );
}

function CasesPage({ data, saveData }) {
  const [query, setQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("");
  const [categoryFilter, setCategoryFilter] = useState("");
  const [resultFilter, setResultFilter] = useState("");
  const [consultationFilter, setConsultationFilter] = useState("");
  const [markFilter, setMarkFilter] = useState("");
  const [customFilters, setCustomFilters] = useState({});
  const [timeFilters, setTimeFilters] = useState({
    date: "",
    week: "",
    month: "",
    quarter: "",
    year: ""
  });
  const [editing, setEditing] = useState(null);
  const [adding, setAdding] = useState(false);
  const [toDelete, setToDelete] = useState(null);
  const [selectedIds, setSelectedIds] = useState([]);
  const [bulkDeletePending, setBulkDeletePending] = useState(false);
  const [highlightTarget, setHighlightTarget] = useState(null);
  const highlightTimerRef = useRef(null);

  const handleViewDuplicate = (record, fieldKey, value) => {
    setEditing(null);
    setAdding(false);
    setStatusFilter("");
    setCategoryFilter("");
    setResultFilter("");
    setConsultationFilter("");
    setMarkFilter("");
    setCustomFilters({});
    setTimeFilters({ date: "", week: "", month: "", quarter: "", year: "" });
    setQuery(asIdString(value).trim());
    setHighlightTarget(record && record.id ? { id: record.id, fieldKey: fieldKey } : null);
    if (highlightTimerRef.current) clearTimeout(highlightTimerRef.current);
    highlightTimerRef.current = setTimeout(() => setHighlightTarget(null), 4500);
  };

  const caseCustomFilterDefs = useMemo(
    () => activeCustomFields(data.customFieldDefs, "cases").filter(f => f.showInFilter && f.type === "dropdown"),
    [data.customFieldDefs]
  );
  
  const years = useMemo(
    () => buildFilterYears((data.cases || []).map(c => c.incidentDate)),
    [data.cases]
  );

  useEffect(() => {
    if (timeFilters.year && !years.some(y => String(y) === String(timeFilters.year))) {
      setTimeFilters(f => ({ ...f, year: "" }));
    }
  }, [years, timeFilters.year]);
  
  const searchIndex = useMemo(() => {
    return data.cases.map(c => ({
      id: c.id,
      searchable: [
        c.jira,
        c.personalId,
        c.caseNo,
        c.operator,
        c.category,
        c.problem,
        c.recommendation,
        c.department,
        c.delayReason,
        c.consultation,
        c.criticalNote,
        c.extraNote
      ].filter(Boolean).join(' ').toLowerCase()
    }));
  }, [data.cases]);

  useEffect(() => {
    setSelectedIds([]);
  }, [query, statusFilter, categoryFilter, resultFilter, consultationFilter, markFilter, timeFilters.date, timeFilters.week, timeFilters.month, timeFilters.quarter, timeFilters.year]);
  
  const filtered = useMemo(() => {
    let result = applyFilters(data.cases, timeFilters);
    
    if (statusFilter) {
      result = result.filter(c => c.statusId === statusFilter || c.status === statusFilter);
    }

    if (categoryFilter) {
      result = result.filter(c => c.categoryId === categoryFilter || c.category === categoryFilter);
    }

    if (resultFilter) {
      result = result.filter(c => c.auditResultId === resultFilter || c.auditResult === resultFilter);
    }

    if (consultationFilter) {
      result = result.filter(c => {
        const ids = Array.isArray(c.consultationIds) ? c.consultationIds : (c.consultationId ? [c.consultationId] : []);
        return ids.includes(consultationFilter) || c.consultation === consultationFilter;
      });
    }

    if (markFilter) {
      result = result.filter(c => markFilterMatch(c, markFilter));
    }

    Object.keys(customFilters || {}).forEach(fid => {
      const val = customFilters[fid];
      if (!val) return;
      result = result.filter(c => {
        const cv = normalizeCustomValues(c.customValues);
        return cv[fid] === val;
      });
    });

    if (query) {
      const q = query.toLowerCase();
      const matchingIds = new Set(
        searchIndex
          .filter(item => item.searchable.includes(q))
          .map(item => item.id)
      );
      result = result.filter(c => matchingIds.has(c.id));
    }
    
    return result.slice().reverse();
  }, [data.cases, query, statusFilter, categoryFilter, resultFilter, consultationFilter, markFilter, customFilters, timeFilters, searchIndex]);
  
  const filtersActive = Boolean(
    statusFilter || categoryFilter || resultFilter || consultationFilter || markFilter ||
    Object.values(customFilters || {}).some(Boolean) ||
    timeFilters.date || timeFilters.week || timeFilters.month ||
    timeFilters.quarter || timeFilters.year
  );
  
  const saveCase = form => {
    let cases;
    if (editing) {
      cases = data.cases.map(c => c.id === editing.id ? { ...editing, ...form } : c);
    } else {
      const no = (data.cases.reduce((m, c) => Math.max(m, c.no || 0), 0) || 0) + 1;
      cases = [...data.cases, { id: uid(), no, ...form }];
    }
    saveData({ ...data, cases });
    setEditing(null);
    setAdding(false);
  };
  
  const deleteCase = () => {
    saveData({ ...data, cases: data.cases.filter(c => c.id !== toDelete.id) });
    setToDelete(null);
    setSelectedIds(ids => ids.filter(id => id !== toDelete.id));
  };

  const toggleSelect = (id) => {
    setSelectedIds(ids => ids.includes(id) ? ids.filter(x => x !== id) : [...ids, id]);
  };

  const toggleSelectAll = (pageIds, select) => {
    if (select) {
      setSelectedIds(prev => [...new Set([...prev, ...pageIds])]);
    } else {
      const pageSet = new Set(pageIds);
      setSelectedIds(prev => prev.filter(id => !pageSet.has(id)));
    }
  };

  const confirmBulkDelete = () => {
    const idSet = new Set(selectedIds);
    saveData({ ...data, cases: data.cases.filter(c => !idSet.has(c.id)) });
    setSelectedIds([]);
    setBulkDeletePending(false);
  };
  
  const exportExcel = async (filteredCases) => {

    const all = [...filteredCases].sort((a, b) => (a.no || 0) - (b.no || 0));
    const total = all.length;
    const closed = all.filter(c => isStatusClosed(c)).length;
    const open = total - closed;
    const auditRows = tally(all, "auditResult");
    const catRows = tally(all, "category");
    const statusRows = tally(all, "status");
    const helpRows = tally(all, "helpType");
    const delayRows = tally(all, "delayReason");
    const consultRows = tally(all, "consultation");
    const criticalCasesN = all.filter(c => c.critical).length;
    const criticalCaseRows = [
      ["დამატებითი ჩანაწერით", criticalCasesN],
      ["დამატებითი ჩანაწერის გარეშე", total - criticalCasesN]
    ];
    
    const NAVY = "FF16213E", GREEN = "FF1F6F50", RED = "FFC0392B";
    const PAPER = "FFFBF9F3", WHITE = "FFFFFFFF", BORDERC = "FFDBD7C8", MUTED = "FF8A8672";
    const PIE_COLORS = ["#16213E", "#B8860B", "#C0392B", "#2A4270", "#1F6F50", "#6B7A99", "#8C6B21"];

    function drawDonutLegend(rows, canvasW, canvasH, titleText) {
        const canvas = document.createElement("canvas");
        canvas.width = canvasW;
        canvas.height = canvasH;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvasW, canvasH);
        ctx.font = "bold 15px sans-serif";
        ctx.fillStyle = "#16213E";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText(titleText, 4, 4);
        const topPad = 34;
        const sum = rows.reduce((s, [, v]) => s + v, 0) || 1;
        const donutSize = Math.min(canvasH - topPad - 12, 160);
        const cx = donutSize / 2 + 16, cy = topPad + (canvasH - topPad) / 2, r = donutSize / 2 - 4;
        let start = -Math.PI / 2;
        rows.forEach(([, value], i) => {
            const angle = value / sum * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, start, start + angle);
            ctx.closePath();
            ctx.fillStyle = PIE_COLORS[i % PIE_COLORS.length];
            ctx.fill();
            start += angle;
        });
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.55, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.fillStyle = "#16213E";
        ctx.font = "bold 20px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(String(sum), cx, cy - 8);
        ctx.font = "10px sans-serif";
        ctx.fillStyle = "#8A8672";
        ctx.fillText("სულ", cx, cy + 12);
        const lx = donutSize + 40;
        const availW = canvasW - lx - 60;
        const lineH = Math.min(30, (canvasH - topPad - 8) / Math.max(rows.length, 1));
        rows.forEach(([label, value], i) => {
            const ly = topPad + i * lineH + lineH / 2;
            ctx.fillStyle = PIE_COLORS[i % PIE_COLORS.length];
            ctx.fillRect(lx, ly - 7, 14, 14);
            ctx.font = "13px sans-serif";
            let display = label;
            while (ctx.measureText(display).width > availW && display.length > 4) {
                display = display.slice(0, -2);
            }
            if (display !== label) display = display.replace(/\s+$/, "") + "…";
            ctx.fillStyle = "#3A3A32";
            ctx.textAlign = "left";
            ctx.textBaseline = "middle";
            ctx.fillText(display, lx + 22, ly);
            ctx.fillStyle = "#16213E";
            ctx.font = "bold 13px sans-serif";
            ctx.textAlign = "right";
            ctx.fillText(String(value), canvasW - 10, ly);
        });
        return canvas.toDataURL("image/png");
    }

    function drawBar(rows, width, height, titleText) {
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, width, height);
        ctx.font = "bold 15px sans-serif";
        ctx.fillStyle = "#16213E";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText(titleText, 4, 4);
        const topPad = 34;
        const max = Math.max(...rows.map(([, v]) => v), 1);
        ctx.font = "13px sans-serif";
        let widest = 0;
        rows.forEach(([label]) => {
            const w = ctx.measureText(label).width;
            if (w > widest) widest = w;
        });
        const leftPad = Math.min(Math.max(widest + 26, 120), width * 0.42);
        const rightPad = 50;
        const n = Math.max(rows.length, 1);
        const barH = Math.min(26, Math.floor((height - topPad - 10) / n) - 8);
        rows.forEach(([label, value], i) => {
            const y = topPad + i * (barH + 8);
            let display = label;
            let font = "13px sans-serif";
            ctx.font = font;
            if (ctx.measureText(display).width > leftPad - 14) {
                font = "11px sans-serif";
                ctx.font = font;
            }
            ctx.fillStyle = "#3A3A32";
            ctx.textAlign = "right";
            ctx.textBaseline = "middle";
            ctx.fillText(display, leftPad - 10, y + barH / 2);
            const barW = (width - leftPad - rightPad) * value / max;
            ctx.fillStyle = PIE_COLORS[i % PIE_COLORS.length];
            ctx.fillRect(leftPad, y, Math.max(barW, 2), barH);
            ctx.fillStyle = "#16213E";
            ctx.font = "bold 13px sans-serif";
            ctx.textAlign = "left";
            ctx.fillText(String(value), leftPad + barW + 8, y + barH / 2);
        });
        return canvas.toDataURL("image/png");
    }

const LOGO_DATA_URL = "data:image/png;base64," + LOGO_PNG_BASE64;

function DocumentLogoMark({ height = 28 }) {
  const width = Math.round(height * (248 / 56));
  return React.createElement("img", {
    src: LOGO_DATA_URL,
    alt: "ლოგო",
    style: { height, width, display: "block" }
  });
}

function DocumentHeaderBanner({ data, generatedAt }) {
  const { primary, secondary } = getResponsiblePersonLines(data);
  return React.createElement("div", {
    className: "qa-print-header",
    style: {
      width: "100%",
      margin: 0,
      padding: 0,
      borderBottom: "4px solid #E65C03",
      boxSizing: "border-box"
    }
  },
    React.createElement("div", {
      className: "qa-print-header-inner flex items-center justify-between",
      style: {
        background: "#16213E",
        padding: "10mm 15mm",
        width: "100%",
        margin: 0,
        boxSizing: "border-box"
      }
    },
      React.createElement(DocumentLogoMark, { height: 30 }),
      React.createElement("div", { className: "text-right" },
        React.createElement("p", { className: "text-xs font-semibold text-white" }, primary),
        secondary && React.createElement("p", { className: "text-[11px] text-white", style: { marginTop: 4 } }, secondary),
        React.createElement("p", { className: "text-[10px] text-white", style: { marginTop: 4 } }, generatedAt)
      )
    )
  );
}

      )
